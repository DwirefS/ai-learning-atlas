<rect width="480" height="180" rx="16" fill="url(#rengineer)"/>
<g fill="#fff" opacity=".35"><circle cx="30" cy="22" r="1.2"/><circle cx="440" cy="30" r="1.5"/><circle cx="400" cy="150" r="1"/><circle cx="60" cy="150" r="1.3"/><circle cx="250" cy="14" r="1"/></g>
<rect x="60" y="25" width="360" height="130" rx="12" fill="#0e1520" stroke="url(#gengineer)" stroke-width="3"/><circle cx="80" cy="42" r="5" fill="#fb7185"/><circle cx="96" cy="42" r="5" fill="#fbbf24"/><circle cx="112" cy="42" r="5" fill="#34d399"/><text x="85" y="72" font-family="monospace" font-size="13"><tspan fill="#5eb0ff">def</tspan><tspan fill="#e8eef8"> answer(q):</tspan></text><text x="85" y="92" font-family="monospace" font-size="13"><tspan fill="#5eb0ff">  docs</tspan><tspan fill="#e8eef8"> = retrieve(q)</tspan></text><text x="85" y="112" font-family="monospace" font-size="13"><tspan fill="#5eb0ff">  out</tspan><tspan fill="#e8eef8"> = llm(q, docs)</tspan></text><text x="85" y="132" font-family="monospace" font-size="13"><tspan fill="#5eb0ff">  return</tspan><tspan fill="#e8eef8"> cite(out)</tspan></text><text x="330" y="125" font-size="42" fill="url(#gengineer)" font-family="monospace" filter="url(#fengineer)">{}</text>
