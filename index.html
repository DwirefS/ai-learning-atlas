apacity planning across providers, model upgrade campaigns (re-evaluate every agent against the new model before switching aliases), cost governance (showback and chargeback), and inter-agent protocols such as A2A where agents delegate to each other, which adds new failure and trust paths.\n\nCommon mistakes: shadow agents nobody registered; one shared API key for all agents; model upgrades pushed fleet-wide without per-agent evals.\n\nMental model: treat agents like employees and services at once: each needs an identity, a manager, a job description, a budget and a performance review.", "resources": [{"title": "Google A2A protocol", "url": "https://a2a-protocol.org/latest/"}, {"title": "Microsoft Entra Agent ID", "url": "https://learn.microsoft.com/en-us/entra/agent-id/"}, {"title": "FinOps for AI (FinOps Foundation)", "url": "https://www.finops.org/wg/finops-for-ai-overview/"}, {"title": "CSA: Agentic AI threat modeling (MAESTRO)", "url": "https://cloudsecurityalliance.org/blog/2025/02/06/agentic-ai-threat-modeling-framework-maestro"}], "project": "Build an agent registry service (owner, tier, tools, data products, model alias, SLOs, budget) and a fleet dashboard. Register 10 sample agents, enforce that unregistered agents cannot get gateway keys, and run a model-upgrade campaign that evaluates every agent on the new model and switches aliases only for those that pass.", "topics": [{"id": "t-fleet-t1", "title": "Agent registry and lifecycle", "explainer": "The registry is the source of truth: every agent has an ID, owner, business purpose, risk tier, declared tools and data products, model alias, prompt version, SLOs, budget and status. Gateways and policy engines consult it, so unregistered agents get no keys. Lifecycle stages run from proposal and review through pilot, production and retirement, with gates at each. The registry also feeds compliance inventories and cost reports.", "subtopics": [{"id": "t-fleet-t1-s1", "title": "Registry schema"}, {"id": "t-fleet-t1-s2", "title": "Registration as a gate for keys"}, {"id": "t-fleet-t1-s3", "title": "Lifecycle stages and reviews"}, {"id": "t-fleet-t1-s4", "title": "Ownership and on-call"}, {"id": "t-fleet-t1-s5", "title": "Retirement and credential revocation"}]}, {"id": "t-fleet-t2", "title": "Risk tiers, identity and autonomy", "explainer": "Tier agents by the impact of their actions and data sensitivity. Tie autonomy levels to tiers: fully autonomous within budgets, sampled human review, or approval per action. Give each agent its own identity with scoped credentials, so its actions show up distinctly in audit logs and can be revoked alone. When agents call other agents, propagate the originating user and agent chain so authorization and accountability survive delegation.", "subtopics": [{"id": "t-fleet-t2-s1", "title": "Risk tiering criteria"}, {"id": "t-fleet-t2-s2", "title": "Autonomy levels per tier"}, {"id": "t-fleet-t2-s3", "title": "Per-agent identity and credentials"}, {"id": "t-fleet-t2-s4", "title": "Delegation chains and A2A"}, {"id": "t-fleet-t2-s5", "title": "Revocation and quarantine"}]}, {"id": "t-fleet-t3", "title": "Fleet-wide changes and economics", "explainer": "Changes that affect many agents, such as a new model version, a shared tool upgrade or a policy change, need campaigns: run each agent's evals against the change, roll out progressively by tier, and keep per-agent rollback. Capacity planning spans providers and self-hosted models. Showback or chargeback attributes spend to owning teams, and fleet-level dashboards show value delivered per dollar, which is what executives fund.", "subtopics": [{"id": "t-fleet-t3-s1", "title": "Model upgrade campaigns"}, {"id": "t-fleet-t3-s2", "title": "Progressive rollout by tier"}, {"id": "t-fleet-t3-s3", "title": "Multi-provider capacity planning"}, {"id": "t-fleet-t3-s4", "title": "Showback and chargeback"}, {"id": "t-fleet-t3-s5", "title": "Value per dollar dashboards"}]}], "quiz": [{"q": "How should a fleet prevent unregistered 'shadow' agents?", "choices": ["Use one shared API key", "Make registry membership a precondition for gateway keys", "Ask teams nicely", "Disable logging"], "answer": 1, "why": "Tying keys to registration enforces inventory."}, {"q": "Why give each agent its own identity?", "choices": ["Cheaper tokens", "Faster inference", "Attributable, scoped and individually revocable actions", "Required by GPUs"], "answer": 2, "why": "Per-agent identity enables audit and targeted revocation."}, {"q": "Before switching the fleet to a new model version you should…", "choices": ["Delete old prompts", "Run each agent's evals and roll out progressively", "Switch all aliases at once", "Disable monitoring"], "answer": 1, "why": "Per-agent evaluation prevents fleet-wide regressions."}], "conceptIds": ["agentops-loop", "controls-crosswalk"]}]}]}], "conceptIds": ["attention", "kv-cache", "paged-attention", "batching", "quantization", "speculative", "prefill-decode", "pd-disagg", "parallelism", "rag-pipeline", "agent-loop", "tool-calling", "mcp", "evals", "rlhf-dpo-grpo", "lora", "gpu-memory", "nvlink-ib", "k8s-gpu", "ref-arch", "threat-model", "context-eng", "multi-agent", "cost-model", "flash-attn", "ai-sre", "harness", "nccl-collectives", "gpu-sharing", "cold-start", "llm-gateway-routing", "cost-per-token", "prompt-injection-defense", "moe-routing", "hnsw", "graphrag", "a2a", "computer-use", "distillation", "rope-long-context", "xid-triage", "agent-data-arch", "permission-aware-rag", "cdc-freshness", "unstructured-pipeline", "agentops-loop", "eval-pipeline", "policy-gate", "audit-trail", "controls-crosswalk", "fde-lifecycle", "voice-latency", "docrag-pipeline", "model-router"], "capstones": {"shared": {"title": "Explain-It-Back Mini Model Lab", "goal": "Build and explain a tiny transformer end to end so every later track rests on real understanding.", "architecture": "Character- or BPE-level GPT (nanoGPT-scale) trained on a small corpus; notebook plus a short written explainer with diagrams.", "infra": "One consumer GPU or a free cloud notebook; data and checkpoints in a versioned folder.", "deploy": "Serve the model behind a tiny HTTP endpoint with streaming.", "security": "Add an input-length cap and a prompt-injection test showing why system prompts are not security boundaries.", "observability": "Log loss curves, tokens/s and memory; plot attention maps for a few prompts.", "scaling": "Estimate parameters, FLOPs and KV memory for 10x and 100x versions with the formulas from the concept cards.", "cost": "Compute training cost in GPU-hours and $/1M tokens for serving it.", "deliverables": ["Repo with training + serving code", "Explainer post with 3 diagrams", "Eval of 20 prompts with notes"]}, "architect": {"title": "Client-Ready AI Reference Architecture", "goal": "Design, justify and document a production AI system for a realistic client brief (e.g. regulated insurer claims assistant).", "architecture": "Gateway, RAG with ACL-aware retrieval, agent workers with approval queues, eval service, control plane for prompts/policies; multi-region.", "infra": "Managed APIs plus one self-hosted open-weight model for sensitive data; landing zone with private networking.", "deploy": "Blue/green for app, canary for prompts and models via gateway aliases; IaC for everything.", "security": "Threat model (STRIDE + OWASP LLM + lethal trifecta), per-user scoped tools, egress allowlists, audit logs, DPIA.", "observability": "Traces with tokens/cost per span, quality sampling, drift alerts, executive dashboard.", "scaling": "Tenancy model, quotas, DR plan with RPO/RTO for model, index and prompts.", "cost": "Unit economics per claim handled; build-vs-buy comparison at 3 volume levels.", "deliverables": ["Architecture decision records", "C4 diagrams", "Threat model", "Cost model spreadsheet", "Client presentation deck"]}, "engineer": {"title": "Production RAG + Agent Product", "goal": "Ship a cited Q&A and task assistant over a real document set, with evals gating every change.", "architecture": "Hybrid retrieval (BM25 + HNSW) with reranking, structured tool calls, small agent loop with budgets, semantic cache.", "infra": "Containerized app, vector store, gateway client; one environment per stage.", "deploy": "CI runs golden + adversarial evals; prompt changes behind flags; one-click rollback.", "security": "Doc-borne injection tests, per-user authorization on tools, PII redaction, spend caps.", "observability": "OpenTelemetry traces, retrieved-chunk logging, quality dashboards sliced by cohort.", "scaling": "Load test to target RPS; queue + backpressure for slow tools.", "cost": "Cost per successful answer; routing small vs large model with measured quality delta.", "deliverables": ["Repo + README", "Eval report", "Load test results", "Incident runbook"]}, "inference": {"title": "SLO-Driven LLM Serving Stack", "goal": "Serve an open-weight model at a stated latency SLO with the best $/1M tokens you can prove.", "architecture": "vLLM or SGLang with continuous batching, prefix caching, FP8 or INT4, optional speculative decoding; prefix-aware gateway routing; optional P/D disaggregation.", "infra": "Kubernetes GPU pool, warm pool, local NVMe weight cache.", "deploy": "Rolling engine upgrades with canary and automatic rollback on TTFT/TBT regression.", "security": "Authenticated gateway, per-tenant rate limits, isolated adapters, no prompt logging by default.", "observability": "TTFT/TBT/goodput percentiles, KV usage, queue depth, acceptance rate, cold-start phases.", "scaling": "Autoscale on queue depth; measured cold start; load shedding and fallback model.", "cost": "$/1M input and output tokens at 3 utilization levels vs two API prices.", "deliverables": ["Benchmark report with methodology", "Grafana dashboard", "Capacity plan", "Cold-start breakdown"]}, "infra": {"title": "Multi-Tenant GPU Platform", "goal": "Run a shared GPU platform that teams can self-serve safely, with failures handled automatically.", "architecture": "GPU Operator, MIG + time-slicing pools, DRA where available, Kueue queues per team, KubeRay/JobSet for training, inference namespace with gateway.", "infra": "Two node pools (training with RDMA, inference), parallel FS or object + NVMe cache, NCCL-validated fabric.", "deploy": "GitOps for cluster config; driver upgrades with drains; golden images pinned by digest.", "security": "Namespaces + network policies, gVisor for untrusted code, signed images and safetensors-only, weight bucket isolation, MCP gateway.", "observability": "DCGM + engine metrics, Xid watcher, NCCL test cron, cost per team.", "scaling": "Quota borrowing, preemption tiers, spare-node pool, capacity forecast.", "cost": "Showback per team in $/GPU-hour and $/1M tokens; idle reclaim savings; power per rack.", "deliverables": ["Cluster repo (GitOps)", "Failure-remediation controller", "Runbooks for Xid 48/79/94-95 and NCCL hangs", "Monthly FinOps report"]}, "agentic": {"title": "Governed Autonomous Agent", "goal": "Build an agent that completes multi-step real tasks safely, measurably and recoverably.", "architecture": "Harness with middleware (policy, redaction, approvals), MCP tools via gateway, episodic memory, checkpoint/resume, optional A2A delegation.", "infra": "Sandboxed microVM or gVisor runtime, ephemeral FS, egress allowlist, secrets vault.", "deploy": "Autonomy level per action class; staged rollout from draft-only to scoped auto.", "security": "Lethal-trifecta review, injection red-team suite in CI, pinned MCP manifests, kill switch drill.", "observability": "Full trajectory traces, cost per task, policy violations, abstention rate.", "scaling": "Concurrency limits, per-task budgets, queue-based workers.", "cost": "Cost per successful task vs human baseline.", "deliverables": ["Agent repo", "Eval harness with 50+ tasks run 5x each", "Red-team report", "Autonomy policy doc"]}, "data": {"title": "AI-Ready Data Product for Agents", "goal": "Turn one business domain into a data product that any team's agent can discover, understand and use safely.", "architecture": "CDC from Postgres into Iceberg gold tables, semantic-layer metrics, unstructured ticket/document index with ACLs, catalog with lineage, MCP server exposing retrieve/query_metric/find_dataset.", "infra": "Docker Compose or small K8s: Debezium, Kafka/Redpanda, Spark or DuckDB, dbt, OpenMetadata, pgvector or OpenSearch, OpenFGA.", "deploy": "Blue/green re-indexing behind aliases; contracts enforced in CI; MCP server versioned in an internal registry.", "security": "OAuth on-behalf-of to the MCP server, pre-filtered permission-aware retrieval, per-user cache scoping, PII tagging and redaction.", "observability": "Freshness canaries, quality checks, OpenLineage to the index and agent, per-agent query and embedding cost.", "scaling": "Load-isolated warehouse for agent queries, pre-aggregations, incremental embeddings via content hashing.", "cost": "Cost per 1k pages parsed and embedded; data cost per resolved agent task.", "deliverables": ["ODCS contract + semantic layer", "Permission-aware index with leak tests", "MCP server + 25 example questions + eval suite", "Freshness SLO dashboard", "Write-up with lineage diagram"]}, "trust": {"title": "Governed, Observable Agent Fleet", "goal": "Operate three agents as a fleet with SLOs, evals, security controls, policy gates and audit evidence.", "architecture": "Agent registry, LLM gateway, durable workflows, OPA/Cedar tool authorizer, eval service, tracing and WORM audit store.", "infra": "Kubernetes with workload identity, private endpoints, egress allowlists, KMS; Temporal or Restate; Langfuse/Phoenix.", "deploy": "Manifest-based releases gated by Conftest + eval CI; canaries with online evals; atomic rollback.", "security": "Threat model + red-team suite in CI, sandboxed code tools, per-agent identities, human approval for irreversible actions.", "observability": "Fleet SLO dashboards, burn-rate alerts, calibrated online judges, g"], ["inference", "i-slo", "Capacity and SLOs"], ["capstone", "inference", "Capstone: SLO-Driven Serving Stack"]]}, {"id": "agent-builder", "title": "AI Engineer → Agent Builder", "who": "You can build LLM apps; now build agents that are safe to give real permissions.", "emoji": "✶", "steps": [["agentic", "g-mental", "Agent mental model"], ["agentic", "g-tools", "Tools as the API surface"], ["agentic", "g-harness-intro", "Harness vs model"], ["agentic", "g-harness", "Harness engineering"], ["agentic", "g-mcp", "MCP and tool protocols"], ["agentic", "g-mem", "Memory systems"], ["agentic", "g-secure", "Agent security and sandboxing"], ["agentic", "g-eval", "Evaluating agents"], ["agentic", "g-browser", "Computer-use agents"], ["agentic", "g-a2a", "A2A interop"], ["agentic", "g-redteam", "Red-teaming agents"], ["capstone", "agentic", "Capstone: Governed Autonomous Agent"]]}, {"id": "universal-agentic", "title": "Universal Agentic Path: every role, in order", "emoji": "🌐", "who": "Follow this end to end to be able to do all 13 roles. Ordered so each step builds on the last. Untimed: skip what you know.", "steps": [["shared", "sc-llm", "How LLMs work: the workload behind every role"], ["shared", "sc-found", "NLP foundations: word vectors to scaling laws"], ["engineer", "e-api", "Calling models: APIs, streaming, structured outputs"], ["engineer", "e-prompt", "Prompt and context engineering"], ["engineer", "e-reasoning", "Reasoning models and API platform features"], ["agentic", "g-mental", "Agent mental models: loop, tools, memory, stop"], ["agentic", "g-patterns", "Agentic design patterns and deep research"], ["engineer", "e-tools", "Tool calling done well"], ["agentic", "g-mcp", "MCP: the standard plug for tools and data"], ["data", "d-found", "Data foundations: lakehouse and gold tables"], ["data", "d-model", "Semantic layer: metrics agents can trust"], ["engineer", "e-rag", "RAG pipelines"], ["data", "d-unstruct", "Unstructured pipelines at scale"], ["engineer", "e-docrag", "Multimodal and document RAG"], ["engineer", "e-vision", "Vision and document AI extraction"], ["data", "d-cdc", "Fresh context with CDC"], ["data", "d-quality", "Data contracts and circuit breakers"], ["data", "d-catalog", "Catalog and lineage as agent runtime"], ["data", "d-connect", "Connecting agents to enterprise data"], ["data", "d-perm", "Permission-aware retrieval"], ["shared", "sc-eval", "Evaluation fundamentals"], ["trust", "t-evalfound", "Eval engineering: error analysis and golden sets"], ["trust", "t-judge", "Calibrated judges and online evals"], ["agentic", "g-harness", "Building the harness"], ["agentic", "g-frameworks", "Agent frameworks and managed platforms"], ["trust", "t-traj", "Trajectory evals and pass^k"], ["trust", "t-agentops", "Tracing and SLOs"], ["engineer", "e-voice", "Real-time voice agents"], ["trust", "t-durable", "Queues and durable execution"], ["trust", "t-runbook", "Kill switches, budgets, runbooks"], ["engineer", "e-llmops", "AI platform and LLMOps"], ["shared", "sc-sec", "AI security fundamentals"], ["trust", "t-threat", "Threat modeling, red teaming, sandboxing"], ["trust", "t-agentattacks", "Agent attacks deep dive"], ["trust", "t-cloudsec", "Cloud security for AI"], ["trust", "t-policy", "Policy as code"], ["trust", "t-audit", "Audit logging and evidence"], ["trust", "t-reg", "EU AI Act, NIST AI RMF, ISO 42001 mapping"], ["trust", "t-responsible", "Responsible AI: fairness, transparency, safety"], ["infra", "f-gpu", "GPU literacy"], ["infra", "f-k8s", "Kubernetes for accelerators"], ["inference", "i-engines", "Inference engines (vLLM and friends)"], ["inference", "i-batch", "Batching and throughput"], ["inference", "i-gateway", "Gateways and routing"], ["infra", "f-obs", "Infra observability and AI SRE"], ["engineer", "e-ft", "Fine-tuning"], ["engineer", "e-post", "Post-training and RL"], ["agentic", "g-train", "RL on agent harnesses"], ["engineer", "e-rlenv", "RL environments and reward design"], ["data", "d-memory", "Agent memory and feedback data"], ["data", "d-products", "AI-ready data products"], ["architect", "a-fde", "Forward deployed engineering"], ["architect", "a-solarch", "Solutions architecture and sizing"], ["architect", "a-product", "AI product management"], ["data", "d-fleetdata", "Data ops for agent fleets"], ["trust", "t-fleet", "Operating agent fleets 24/7"], ["capstone", "trust", "Capstone: Governed agent fleet"], ["capstone", "data", "Capstone: AI-ready data product"]]}], "glossary": [{"term": "A2A", "def": "Agent-to-agent protocol for discovering remote agents and delegating tasks with a lifecycle."}, {"term": "Agent Card", "def": "JSON document advertising an A2A agent's skills, endpoint and auth."}, {"term": "AgentOps", "def": "Operating AI agents in production: tracing, SLOs, queues, budgets, incidents and releases."}, {"term": "AI-SPM", "def": "AI security posture management: inventory and misconfiguration scanning for models, endpoints, notebooks and AI data."}, {"term": "All-reduce", "def": "Collective where every GPU ends with the sum of all GPUs' buffers."}, {"term": "All-to-all", "def": "Collective where every GPU sends distinct data to every other GPU; used by MoE expert parallelism."}, {"term": "ANN", "def": "Approximate nearest neighbor search: fast vector search trading a little recall for speed."}, {"term": "AWQ", "def": "Activation-aware weight quantization method for INT4 weights."}, {"term": "Barge-in", "def": "The user interrupting a voice agent mid-speech; the agent must stop audio and truncate context to what was spoken."}, {"term": "Best-of-N", "def": "Sample N answers and pick the best with a scorer or verifier."}, {"term": "BPE", "def": "Byte-pair encoding tokenizer that merges frequent byte pairs into tokens."}, {"term": "busbw", "def": "nccl-tests bus bandwidth: algorithm bandwidth normalized to compare with link speed."}, {"term": "Capacity factor", "def": "MoE setting for how many tokens each expert accepts relative to perfect balance."}, {"term": "CDC", "def": "Change data capture: streaming inserts, updates and deletes from a database's transaction log."}, {"term": "Cedar", "def": "An authorization policy language (principal, action, resource, conditions) with formal analysis; used by Amazon Verified Permissions."}, {"term": "Chain-of-thought", "def": "Prompting or training a model to reason step by step before answering."}, {"term": "Chunked prefill", "def": "Splitting long prompt processing into chunks interleaved with decode steps."}, {"term": "Circuit breaker (data)", "def": "A check that stops agents from answering or acting on data that failed freshness or quality checks."}, {"term": "Cold start", "def": "Time for a new replica to become ready: node, image, weights, engine init."}, {"term": "ColPali", "def": "A visual document retrieval model that embeds page images as patch vectors and scores with late interaction."}, {"term": "Confidential computing", "def": "Hardware TEEs that encrypt data in use and attest the environment."}, {"term": "Confused deputy", "def": "A privileged component tricked into misusing its authority for an attacker."}, {"term": "Context engineering", "def": "Choosing and ordering what goes into a model's context window."}, {"term": "Continuous batching", "def": "Adding and removing sequences from a batch every decode step."}, {"term": "Cross-encoder", "def": "Model scoring a query-document pair jointly; accurate, used for reranking."}, {"term": "CSPM", "def": "Cloud security posture management: continuous scanning of cloud configurations against policies and benchmarks."}, {"term": "CUDA graphs", "def": "Captured sequences of GPU kernels replayed with low CPU launch overhead."}, {"term": "Data contract", "def": "A versioned, enforced agreement on a dataset's schema, semantics, quality and freshness."}, {"term": "Data product", "def": "A dataset with an owner, contract, SLOs, documentation and interfaces, published for reuse."}, {"term": "DCGM", "def": "NVIDIA D ectly, escalating when needed."}, {"term": "MoE", "def": "Mixture of Experts: router sends each token to a few expert networks."}, {"term": "MPS", "def": "CUDA Multi-Process Service: concurrent kernels from multiple processes."}, {"term": "MQA", "def": "Multi-query attention: all query heads share one KV head."}, {"term": "NCCL", "def": "NVIDIA Collective Communications Library for multi-GPU collectives."}, {"term": "NIST AI RMF", "def": "NIST's voluntary AI risk framework with functions Govern, Map, Measure and Manage."}, {"term": "NIXL", "def": "NVIDIA Inference Xfer Library for moving KV cache between workers."}, {"term": "NVLink", "def": "High-bandwidth GPU-to-GPU interconnect."}, {"term": "NVSwitch", "def": "Switch chip connecting many GPUs over NVLink at full bandwidth."}, {"term": "OPA / Rego", "def": "Open Policy Agent and its declarative policy language, used for CI, admission and API authorization."}, {"term": "OpenLineage", "def": "An open standard for lineage events emitted by data jobs."}, {"term": "P/D disaggregation", "def": "Running prefill and decode on separate GPU pools."}, {"term": "PagedAttention", "def": "KV cache in fixed-size blocks like virtual memory pages."}, {"term": "pass^k", "def": "The probability an agent succeeds on all k independent attempts; measures reliability."}, {"term": "Pipeline parallelism", "def": "Splitting model layers into stages on different GPUs."}, {"term": "Policy as code", "def": "Rules expressed in a policy language, versioned, tested and enforced by an engine."}, {"term": "Prefill", "def": "Processing the whole prompt in parallel; compute-bound; sets TTFT."}, {"term": "Prefix caching", "def": "Reusing KV for identical prompt prefixes across requests."}, {"term": "Product quantization", "def": "Compressing vectors into short codes by quantizing sub-vectors."}, {"term": "PUE", "def": "Power usage effectiveness: facility power divided by IT power."}, {"term": "QLoRA", "def": "LoRA trained on a 4-bit quantized base mo red output", "def": "Constraining generation to a schema or grammar."}, {"term": "Temperature", "def": "Sampling parameter scaling logits; lower is more deterministic."}, {"term": "Tensor parallelism", "def": "Splitting each layer's matrices across GPUs."}, {"term": "Test-time compute", "def": "Extra inference computation, such as reasoning tokens, spent to improve answers."}, {"term": "Time-slicing", "def": "Sharing one GPU across processes by context switching, no isolation."}, {"term": "Token fertility", "def": "Average tokens per word for a language or domain."}, {"term": "Tool poisoning", "def": "Malicious instructions hidden in a tool's description or output."}, {"term": "Top-p", "def": "Nucleus sampling: sample from the smallest set whose probability sums to p."}, {"term": "TTFT", "def": "Time to first token."}, {"term": "VAD", "def": "Voice activity detection: classifying audio frames as speech or silence."}, {"term": "vLLM", "def": "Open-source LLM serving engine with PagedAttention and continuous batching."}, {"term": "Voice-to-voice latency", "def": "Time from the end of user speech to the first audible agent reply."}, {"term": "Volcano", "def": "Kubernetes batch scheduler with gang scheduling and queues."}, {"term": "Workload identity", "def": "Short-lived cloud credentials bound to a workload (pod/service) instead of static keys."}, {"term": "WORM storage", "def": "Write-once-read-many storage (e.g. object lock) for tamper-evident records."}, {"term": "Xid", "def": "NVIDIA driver error code in the kernel log indicating a GPU fault."}, {"term": "YaRN", "def": "RoPE scaling method for extending context length."}, {"term": "ZeRO", "def": "DeepSpeed's optimizer-state, gradient and parameter sharding."}], "roles": [{"id": "ai-engineer", "name": "AI Engineer", "emoji": "🛠️", "core": true, "mission": "Ship agentic features end to end: prompts, tool calling, RAG, evals and production hardening.", "day": ["Design tools and retrieval for an agent feature", "Write
