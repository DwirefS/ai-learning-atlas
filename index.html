<style>

.topbar{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;margin-bottom:1rem}

.tool-btns{display:flex;gap:.35rem;flex-wrap:wrap}

.hero .role{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0 0 .75rem}
.badge{display:inline-block;font-size:.68rem;padding:.12rem .45rem;border-radius:999px;border:1px solid rgba(94,176,255,.35);color:var(--accent);background:rgba(94,176,255,.1);margin-left:.35rem}

.lvl-badge{font-size:.65rem;padding:.15rem .4rem;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.l1 .lvl-badge{color:#93c5fd}.l2 .lvl-badge{color:#86efac}.l3 .lvl-badge{color:#fcd34d}.l4 .lvl-badge{color:#f9a8d4}.l5 .lvl-badge{color:#c4b5fd}

.subject-body{padding:0 .85rem .9rem}
.why{font-size:.86rem;color:var(--muted);margin:0 0 .55rem;line-height:1.45}
.explainer{font-size:.9rem;line-height:1.55;margin:0 0 .75rem;white-space:pre-wrap}
.meta-box{display:grid;gap:.6rem;margin-bottom:.75rem}
@media(min-width:760px){.meta-box{grid-template-columns:1fr 1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.65rem .75rem}
.card h4{margin:0 0 .35rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card ul{margin:0;padding-left:1.05rem;font-size:.84rem;line-height:1.45}
.card p{margin:0;font-size:.84rem;line-height:1.45}

.topic{margin:.4rem 0;border-left:2px solid var(--border);padding-left:.5rem}

.topic-body{padding:.1rem 0 .3rem .85rem}
.sub{display:flex;gap:.5rem;align-items:flex-start;padding:.25rem .1rem;font-size:.86rem}

.quiz h4{margin:0 0 .4rem;font-size:.78rem;color:var(--warn)}
.qitem{margin:.45rem 0}.qitem p{margin:0 0 .3rem;font-size:.86rem}
.qitem label{display:block;font-size:.82rem;padding:.2rem 0;cursor:pointer;color:var(--muted)}
.qitem button{margin-top:.25rem;font-size:.75rem}
.qok{color:var(--good)}.qbad{color:var(--hot)}
.concepts{margin-top:1.2rem}
.concept{border:1px solid var(--border);border-radius:12px;background:var(--bg2);margin-bottom:.55rem;overflow:hidden}
.concept-h{padding:.7rem .85rem;font-weight:650}
.concept-body{padding:0 .9rem .9rem;border-top:1px solid var(--border)}
.concept-body .body{font-size:.9rem;line-height:1.55;white-space:pre-wrap}
.mermaid-wrap{background:#0a1018;border:1px solid var(--border);border-radius:10px;padding:.75rem;margin:.65rem 0;overflow:auto}
.mermaid-fallback{display:none;font-family:ui-monospace,monospace;font-size:.72rem;white-space:pre-wrap;color:var(--muted)}
.example{font-size:.84rem;color:#c4d4e8;background:rgba(94,176,255,.07);border-left:3px solid var(--accent);padding:.5rem .7rem;margin:.5rem 0}
.hit{background:rgba(251,191,36,.28);border-radius:3px;padding:0 2px}
.footer-note{margin-top:2rem;font-size:.72rem;color:var(--muted);line-height:1.4}

on drifts from another; it is the leash in RLHF that keeps a tuned model near its reference. Entropy tells you how unsure the model is, which is useful for routing and abstention. Calibration asks whether \"80% confident\" is right 80% of the time, which is different from accuracy. Bayes is the mental tool for reasoning about evaluations: a 95%-accurate classifier on a 1% base-rate problem still produces mostly false alarms."}, {"id": "sc-math-opt", "title": "Optimization", "subtopics": [{"id": "sc-math-opt-s1", "title": "Gradients and chain rule"}, {"id": "sc-math-opt-s2", "title": "SGD, Adam, AdamW"}, {"id": "sc-math-opt-s3", "title": "LR schedules and warmup"}, {"id": "sc-math-opt-s4", "title": "Overfitting vs underfitting"}, {"id": "sc-math-opt-s5", "title": "Gradient clipping"}], "explainer": "Training is gradient descent: compute how the loss changes with each weight (backprop is the chain rule applied efficiently) and nudge weights the other way. Adam keeps running averages of gradients and their squares so each weight gets its own step size; AdamW separates weight decay from that update, which matters for generalization. Learning-rate warmup avoids blowing up early when statistics are noisy, then cosine or linear decay settles the model. Gradient clipping caps rare huge updates. Watch both training and validation loss: if validation rises while training falls you are overfitting; if both stay high you are underfitting or the learning rate is wrong."}], "quiz": [{"q": "Raising temperature generally…", "choices": ["Increases entropy of the next-token distribution", "Always improves factual accuracy", "Removes the need for top-p", "Zeros the KL term"], "answer": 0, "why": "Higher T flattens the distribution, raising entropy."}, {"q": "Cross-entropy LM training is closest to…", "choices": ["Maximum likelihood of next tokens", "Minimizing cosine distance only", "Maximizing BLEU", "Random search"], "answer": 0, "why": "NLL/cross-entropy is MLE for next-token prediction."}, {"q": "LoRA works because weight updates during fine-tuning are often…", "choices": ["Exactly zero", "Larger than the base weights", "Random noise", "Well approximated by a low-rank matrix"], "answer": 3, "why": "If a few singular values dominate the update, two thin matrices capture most of it."}, {"q": "A 95%-accurate detector on a 1%-prevalence problem will flag mostly…", "choices": ["False positives", "Nothing", "True positives", "Duplicates"], "answer": 0, "why": "Base rates dominate: about 5% of the 99% negatives get flagged, versus at most 1% true positives."}, {"q": "AdamW differs from Adam mainly by…", "choices": ["Using no momentum", "Removing learning rates", "Using integer weights", "Decoupling weight decay from the gradient update"], "answer": 3, "why": "Decoupled weight decay behaves more predictably and usually generalizes better."}], "conceptIds": ["attention"]}, {"id": "sc-nn", "title": "Neural Nets & Representation Learning", "why": "Everything after this is a specialization of these ideas.", "explainer": "A neural net is a stack of differentiable transforms that learn representations. Depth and width buy capacity; inductive biases buy sample efficiency. For LLMs the representation is a contextual embedding at every layer.\n\nResiduals and norms (LayerNorm/RMSNorm) are why deep stacks train. Activations are not cosmetics. Regularization fights memorization — and in LLM fine-tunes, weight decay and LoRA rank interact in ways that surprise people who only know classical ML.\n\nCommon mistake: blaming the model when the learning rate is an order of magnitude off. Another: assuming more parameters always help when you are data-limited (see Chinchilla).\n\nRepresentation thinking helps you decide when embeddings alone solve retrieval, when you need cross-encoders, and when a small specialist net beats prompting a giant LM.", "resources": [{"title": "Karpathy Zero to Hero", "url": "https://karpathy.ai/zero-to-hero.html"}, {"title": "PyTorch tutorials", "url": "https://docs.pytorch.org/tutorials/"}, {"title": "Deep Learning Book", "url": "https://www.deeplearningbook.org/"}, {"title": "Chinchilla scaling laws", "url": "https://arxiv.org/abs/2203.15556"}], "project": "Train a tiny MLP and a nano-scale LM; ablate width, depth, and learning rate.", "topics": [{"id": "sc-nn-blocks", "title": "Building Blocks", "subtopics": [{"id": "sc-nn-blocks-s1", "title": "Layers, activations, losses"}, {"id": "sc-nn-blocks-s2", "title": "Backprop intuition"}, {"id": "sc-nn-blocks-s3", "title": "Residuals and norms"}, {"id": "sc-nn-blocks-s4", "title": "Dropout / weight decay"}, {"id": "sc-nn-blocks-s5", "title": "Parameter counting"}], "explainer": "A neural network stacks simple layers: a linear map, a nonlinearity such as GELU or SiLU, and a loss at the end. Backprop sends error signals backward through every layer. Residual connections add the input of a block to its output, so gradients have a short path back and very deep networks stay trainable. Normalization (LayerNorm, RMSNorm) keeps activations in a sane range. Dropout and weight decay are regularizers that discourage memorization. Parameter counting is a practical skill: a transformer block has roughly 12·d² parameters (4·d² attention, 8·d² MLP), so you can sanity-check model sizes and memory before downloading anything."}, {"id": "sc-nn-rep", "title": "Representations & Scale", "subtopics": [{"id": "sc-nn-rep-s1", "title": "Embeddings and latent spaces"}, {"id": "sc-nn-rep-s2", "title": "Transfer learning"}, {"id": "sc-nn-rep-s3", "title": "Scaling laws intuition"}, {"id": "sc-nn-rep-s4", "title": "Under/over-parameterization"}, {"id": "sc-nn-rep-s5", "title": "Inductive bias"}], "explainer": "Networks learn representations: internal coordinates where similar things sit close together. That is why pretrained models transfer, since the features learned on a huge corpus are reusable for your task with little extra data. Scaling laws describe how loss falls smoothly as you add parameters, data and compute, and Chinchilla showed that many early models were undertrained for their size (roughly 20 tokens per parameter is compute-optimal). Inductive bias is what an architecture assumes before seeing data: convolutions assume locality, attention assumes little. Large over-parameterized models can still generalize well, which overturned the classic \"more parameters means more overfitting\" intuition."}], "quiz": [{"q": "Chinchilla-style scaling emphasizes…", "choices": ["Matching data size to model size for a compute budget", "Always preferring the largest model", "Ignoring tokens seen", "Training only on code"], "answer": 0, "why": "Compute-optimal training balances parameters and tokens."}, {"q": "A transformer block has roughly how many parameters per layer for hidden size d?", "choices": ["d³", "4·d", "12·d²", "d"], "answer": 2, "why": "About 4·d² for attention projections and 8·d² for the MLP with 4x expansion."}, {"q": "Residual connections mainly help by…", "choices": ["Encrypting activations", "Removing the need for data", "Giving gradients a short path through deep networks", "Reducing vocabulary size"], "answer": 2, "why": "The identity path keeps gradients flowing, so very deep stacks stay trainable."}], "conceptIds": []}, {"id": "sc-llm", "title": "LLM Mechanics", "why": "Shared vocabulary: tokens in, logits out, KV in between.", "explainer": "Large language models are transformers trained to predict the next token. The operational stack is: tokenizer, embedding, blocks of attention plus MLP (or MoE), unembedding, softmax. Generation samples or argmaxes, appends the token, and repeats — unless constrained decode intervenes.\n\nTokenization is not free: fertility differs by language and code, which changes cost and latency. Attention is expensive; the KV cache avoids recomputing past keys/values each step. Positional schemes (RoPE) and attention variants (MHA, GQA, MQA, MLA) trade quality for memory.\n\nCommon mistake: comparing context windows without checking tokenizer and usable context after system prompt and tools. Another: swapping chat templates across families and wondering why quality collapsed.\n\nThis subject is the lingua franca across all five tracks.", "resources": [{"title": "Attention Is All You Need (Vaswani et al.)", "url": "https://arxiv.org/abs/1706.03762"}, {"title": "nanoGPT", "url": "https://github.com/karpathy/nanoGPT"}, {"title": "minbpe", "url": "https://github.com/karpathy/minbpe"}, {"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}, {"title": "Stanford CS336", "url": "https://cs336.stanford.edu/"}, {"title": "Grouped-Query Attention", "url": "https://arxiv.org/abs/2305.13245"}, {"title": "RoPE / RoFormer", "url": "https://arxiv.org/abs/2104.09864"}], "project": "Implement BPE (minbpe-style) and train a tiny GPT; inspect attention on a short prompt.", "topics": [{"id": "sc-llm-tok", "title": "Tokenization", "subtopics": [{"id": "sc-llm-tok-s1", "title": "BPE / WordPiece / Unigram"}, {"id": "sc-llm-tok-s2", "title": "Special tokens and chat templates"}, {"id": "sc-llm-tok-s3", "title": "Fertility and multilingual cost"}, {"id": "sc-llm-tok-s4", "title": "Detokenization pitfalls"}, {"id": "sc-llm-tok-s5", "title": "Domain-specific tokenizers"}], "explainer": "Models never see characters, only token ids. BPE and similar algorithms merge frequent byte pairs into a vocabulary of roughly 32k to 200k pieces. Fertility, the number of tokens per word, varies a lot by language and domain: code, Thai, or chemical names can cost several times more tokens than English prose, which hits both cost and context budget. Chat templates wrap messages with special tokens that mark roles; using the wrong template quietly degrades quality. Detokenization can split multi-byte characters across tokens, so streaming clients must buffer bytes. Always count tokens with the model's own tokenizer before you send."}, {"id": "sc-llm-attn", "title": "Attention & Blocks", "subtopics": [{"id": "sc-llm-attn-s1", "title": "QKV self-attention"}, {"id": "sc-llm-attn-s2", "title": "MHA / GQA / MQA / MLA"}, {"id": "sc-llm-attn-s3", "title": "RoPE and positions"}, {"id": "sc-llm-attn-s4", "title": "FFN and MoE layers"}, {"id": "sc-llm-attn-s5", "title": "Causal mask and KV cache role"}], "explainer": "A transformer block is attention followed by a feed-forward network, each wrapped in a residual connection and normalization. Attention lets every token gather information from earlier tokens, weighted by query-key similarity. Multi-head attention runs several of these in parallel. GQA and MQA share key/value heads across query heads to shrink the KV cache; MLA compresses keys and values into a smaller latent. RoPE encodes position by rotating query and key vectors so relative distance shows up in their dot product. The causal mask stops tokens from peeking at the future, which is exactly what makes caching earlier keys and values valid during generation."}, {"id": "sc-llm-gen", "title": "Generation", "subtopics": [{"id": "sc-llm-gen-s1", "title": "Greedy / temperature / top-k / top-p"}, {"id": "sc-llm-gen-s2", "title": "Stop sequences"}, {"id": "sc-llm-gen-s3", "title": "Structured / constrained decode"}, {"id": "sc-llm-gen-s4", "title": "Logprobs and entropy"}, {"id": "sc-llm-gen-s5", "title": "Streaming tokens"}], "explainer": "Generation is a loop: run the model, get logits for the next token, pick one, append it, repeat. Greedy picks the top token; temperature reshapes the distribution (lower is sharper); top-k and top-p cut off the unlikely tail before sampling. Stop sequences end the loop. Constrained decoding masks tokens that would break a grammar or JSON schema, so output is valid by construction. Logprobs expose the model's confidence per token and are handy for classification and routing. Streaming sends tokens as they appear, which improves perceived latency but means your client must handle partial output and cancellation."}], "quiz": [{"q": "KV cache primarily avoids…", "choices": ["Recomputing attention over past tokens each decode step", "Downloading weights again", "Tokenizer training", "Gradient updates"], "answer": 0, "why": "Cached K/V skip full prefill every decode step."}, {"q": "Lower temperature makes sampling…", "choices": ["More deterministic", "Faster on GPU", "Longer", "More random"], "answer": 0, "why": "Dividing logits by a smaller temperature sharpens the distribution toward the top token."}, {"q": "Why can text cost more tokens in Thai or code than in English prose?", "choices": ["Larger KV heads", "Higher tokenizer fertility", "Slower GPUs", "Longer system prompts"], "answer": 1, "why": "Vocabularies trained mostly on English split other text into more pieces per word."}], "conceptIds": ["attention", "kv-cache", "rope-long-context"]}, {"id": "sc-long", "title": "Long Context, Multimodal & MoE Basics", "why": "Modern models are not just short-text left-to-right stacks.", "explainer": "Three extensions show up in every 2026 stack. Long context (100K to 1M+ tokens) changes retrieval versus stuffing tradeoffs, but attention cost and lost-in-the-middle still bite. Multimodal VLMs add vision (and sometimes audio) encoders; failure modes include OCR errors, layout blindness, and unsafe image instructions. Mixture-of-Experts activates a subset of experts per token — great for capacity per dollar, painful for serving (expert parallelism, load imbalance).\n\nCommon mistake: treating a 1M context model as a free database. Another: sending every PDF to a VLM when a parser plus text model is cheaper and more reliable.\n\nArchitects need these options in the build/buy matrix; inference engineers feel MoE on the interconnect; app engineers feel long context on the invoice.", "resources": [{"title": "Mixture of Experts (Shazeer et al.)", "url": "https://arxiv.org/abs/1701.06538"}, {"title": "Switch Transformers", "url": "https://arxiv.org/abs/2101.03961"}, {"title": "Attention Is All You Need (Vaswani et al.)", "url": "https://arxiv.org/abs/1706.03762"}, {"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}], "project": "Benchmark the same QA with short RAG versus long-context stuffing; compare cost, latency, accuracy.", "topics": [{"id": "sc-long-ctx", "title": "Long Context", "subtopics": [{"id": "sc-long-ctx-s1", "title": "Context window vs usable context"}, {"id": "sc-long-ctx-s2", "title": "Lost-in-the-middle"}, {"id": "sc-long-ctx-s3", "title": "Sparse / dilated attention ideas"}, {"id": "sc-long-ctx-s4", "title": "Memory and KV growth"}, {"id": "sc-long-ctx-s5", "title": "When RAG still wins"}], "explainer": "A model may accept 1M tokens, but usable context is smaller: recall of facts buried in the middle often drops (\"lost in the middle\"), and cost and latency grow with length. KV cache memory grows linearly with tokens, and attention compute grows quadratically during prefill, so long prompts are expensive to serve. Sparse, sliding-window and chunked attention variants trade some quality for efficiency. RoPE scaling methods stretch positional encodings beyond training length. RAG still wins when the corpus is bigger than any window, changes often, or needs access control per document. Measure with needle-in-a-haystack and, better, task-level evals on your own long documents."}, {"id": "sc-mm", "title": "Multimodal & Speech", "subtopics": [{"id": "sc-mm-s1", "title": "VLM encoder plus LLM patterns"}, {"id": "sc-mm-s2", "title": "Image patches / tokens"}, {"id": "sc-mm-s3", "title": "OCR and document AI"}, {"id": "sc-mm-s4", "title": "STT/TTS in agent loops"}, {"id": "sc-mm-s5", "title": "Cross-modal safety"}], "explainer": "Vision-language models usually bolt a vision encoder onto an LLM: the image is cut into patches, encoded, projected into the token embedding space, and treated like extra tokens. A single high-resolution image can cost hundreds to thousands of tokens. For documents, classic OCR or PDF text extraction is often cheaper and more accurate than sending page images, with the VLM as a fallback for charts and layout. Speech systems pair speech-to-text and text-to-speech with an LLM, or use native audio models for lower latency. New modalities bring new attack surfaces, such as instructions hidden in images or audio."}, {"id": "sc-moe", "title": "Mixture of Experts", "subtopics": [{"id": "sc-moe-s1", "title": "Sparse activation"}, {"id": "sc-moe-s2", "title": "Gating and load balancing"}, {"id": "sc-moe-s3", "title": "Expert parallelism"}, {"id": "sc-moe-s4", "title": "Serving MoE pain"}, {"id": "sc-moe-s5", "title": "Quality vs dense"}], "explainer": "Mixture-of-experts replaces the single feed-forward block with many experts and a small router that sends each token to the top-k of them (often 2 of 8, or 8 of 256). Only a fraction of the parameters run per token, so you get the quality of a big model at the compute of a smaller one. The catch is memory: all experts must be resident, so a 600B-parameter MoE still needs the HBM of a 600B model. Training adds load-balancing losses so experts are used evenly. Serving uses expert parallelism, which turns routing into all-to-all network traffic and makes batch composition matter."}], "quiz": [{"q": "MoE models typically…", "choices": ["Activate a subset of experts per token", "Use all parameters every token", "Remove the need for GPUs", "Make RAG obsolete"], "answer": 0, "why": "Sparsity is the point of MoE."}, {"q": "A 600B-parameter MoE that activates 37B per token still needs memory for…", "choices": ["Only the router", "37B parameters", "All 600B parameters", "Only the KV cache"], "answer": 2, "why": "All experts must be resident because any token may route to any expert."}, {"q": "RAG still beats a huge context window when…", "choices": ["The model has no tokenizer", "The corpus is small and static", "You want lower recall", "The corpus is larger than the window or needs per-document access control"], "answer": 3, "why": "Windows have limits, cost scales with length, and ACLs are easier at retrieval time."}], "conceptIds": ["moe-routing", "rope-long-context"]}, {"id": "sc-eval", "title": "Evaluation Literacy", "why": "If you cannot measure it, you cannot improve or sell it.", "explainer": "Evals turn probabilistic systems into engineering. Separate capability, safety, and cost. Offline golden sets catch regressions; online metrics catch drift. LLM-as-judge is useful and biased — calibrate it. Contamination silently inflates leaderboards.\n\nProcess metrics (right tool called?) matter as much as outcomes for agents. For RAG, measure retrieval and generation separately or you will fine-tune the wrong stage.\n\nCommon mistake: weeks of demos before twenty labeled cases. Another: tuning a judge until it agrees with you.\n\nShip a thin eval harness on day one; thicken it as the product hardens.", "resources": [{"title": "Stanford HELM", "url": "https://crfm.stanford.edu/helm/"}, {"title": "lm-evaluation-harness", "url": "https://github.com/EleutherAI/lm-evaluation-harness"}, {"title": "OpenAI Evals", "url": "https://github.com/openai/evals"}, {"title": "Ragas", "url": "https://docs.ragas.io/en/stable/"}, {"title": "Judging LLM-as-a-Judge", "url": "https://arxiv.org/abs/2306.05685"}], "project": "Build a 50-item golden set; score exact match plus LLM-judge; measure judge agreement.", "topics": [{"id": "sc-eval-what", "title": "What to Measure", "subtopics": [{"id": "sc-eval-what-s1", "title": "Capability vs safety vs cost"}, {"id": "sc-eval-what-s2", "title": "Process vs outcome"}, {"id": "sc-eval-what-s3", "title": "Online vs offline"}, {"id": "sc-eval-what-s4", "title": "Contamination / leakage"}, {"id": "sc-eval-what-s5", "title": "Calibration and abstention"}], "explainer": "Decide what \"good\" means before measuring. Capability (does it solve the task), safety (does it avoid harm and leaks), and cost/latency are separate axes and often trade off. For agents, outcome metrics (task done) and process metrics (steps, tool errors, policy violations) both matter. Offline evals on fixed sets catch regressions; online signals such as user edits, thumbs, and escalations catch what your set missed. Contamination happens when test items leaked into training data, inflating scores. Calibration and abstention matter in high-stakes domains: a model that says \"I don't know\" correctly is often worth more than one that is slightly more accurate."}, {"id": "sc-eval-how", "title": "How to Run", "subtopics": [{"id": "sc-eval-how-s1", "title": "Golden sets and rubrics"}, {"id": "sc-eval-how-s2", "title": "LLM-as-judge pitfalls"}, {"id": "sc-eval-how-s3", "title": "CI regression gates"}, {"id": "sc-eval-how-s4", "title": "Shadow traffic and A/B"}, {"id": "sc-eval-how-s5", "title": "Error taxonomy"}], "explainer": "Start with a golden set: 50 to 200 real, labeled examples with clear rubrics, built before you tune anything. LLM-as-judge scales grading but has biases (position, verbosity, self-preference), so calibrate it against human labels and keep the judge model and prompt versioned. Put evals in CI so prompt or model changes fail the build when quality drops. Shadow traffic and A/B tests validate changes on real users safely. Keep an error taxonomy (retrieval miss, hallucination, format error, refusal) so failures turn into specific fixes rather than vague \"the model is worse\" complaints."}], "quiz": [{"q": "Best time to create a golden set is…", "choices": ["With the first prompt, before the demo hardens", "After Series B", "Only when fine-tuning", "Never"], "answer": 0, "why": "Early evals prevent demo-driven dead ends."}, {"q": "LLM-as-judge should be…", "choices": ["Used only for math", "Run once a year", "Trusted without checks", "Calibrated against human labels and versioned"], "answer": 3, "why": "Judges have position, verbosity and self-preference biases that drift with versions."}, {"q": "Contamination means…", "choices": ["The GPU is dusty", "The eval set leaked into training data", "Logs are too large", "The judge is too strict"], "answer": 1, "why": "Leaked test items inflate scores without real capability."}], "conceptIds": ["evals"]}, {"id": "sc-sec", "title": "AI Security & Trust Basics", "why": "Tools turn models into attack surfaces.", "explainer": "Prompt injection (direct and indirect), data/model poisoning, supply-chain risk (weights, MCP servers, plugins), and secret leakage through logs are everyday threats. OWASP LLM Top 10 and MITRE ATLAS give shared language; NIST AI RMF and the EU AI Act shape enterprise buying.\n\nControls: least-privilege tools, sandboxes, egress allowlists, output validation, human approval for irreversible actions, and provenance for models and data.\n\nCommon mistake: a regex on user input while tools still hold broad SaaS tokens. Another: logging full prompts with PII into a third-party tracer.\n\nEvery track inherits this threat model.", "resources": [{"title": "OWASP Top 10 for LLM Apps", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}, {"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}, {"title": "MITRE ATLAS", "url": "https://atlas.mitre.org/"}, {"title": "Google SAIF", "url": "https://safety.google/cybersecurity-advancements/saif/"}, {"title": "EU AI Act", "url": "https://artificialintelligenceact.eu/"}], "project": "Red-team a toy RAG+tools bot for indirect injection; document findings and mitigations.", "topics": [{"id": "sc-sec-threats", "title": "Threats", "subtopics": [{"id": "sc-sec-threats-s1", "title": "Direct / indirect prompt injection"}, {"id": "sc-sec-threats-s2", "title": "Poisoning and backdoors"}, {"id": "sc-sec-threats-s3", "title": "Supply chain (models, plugins, MCP)"}, {"id": "sc-sec-threats-s4", "title": "Secrets in context/logs"}, {"id": "sc-sec-threats-s5", "title": "Model extraction / membership"}], "explainer": "LLM systems mix instructions and data in one channel, so prompt injection is the signature threat: direct when a user types it, indirect when it hides in a web page, email, PDF or tool result the model reads. Poisoning plants bad behavior in training or retrieval data. The supply chain now includes model weights, tokenizers, plugins and MCP servers, any of which can be malicious. Secrets pasted into prompts end up in logs and traces. Attackers can also query a model to extract its behavior or test whether a record was in its training data. Treat every model output as untrusted input to the next system."}, {"id": "sc-sec-ctrl", "title": "Controls", "subtopics": [{"id": "sc-sec-ctrl-s1", "title": "Least-privilege tools"}, {"id": "sc-sec-ctrl-s2", "title": "Sandboxing and egress"}, {"id": "sc-sec-ctrl-s3", "title": "Output validation"}, {"id": "sc-sec-ctrl-s4", "title": "Human approval gates"}, {"id": "sc-sec-ctrl-s5", "title": "Audit and provenance"}], "explainer": "You cannot reliably filter prompt injection, so design so it cannot do much damage. Give tools least privilege: narrow scopes, read before write, per-user credentials rather than a shared admin key. Run code and browsers in sandboxes with egress allowlists. Validate model output against schemas and business rules before acting on it. Put human approval in front of irreversible actions like sending money or email. Keep tamper-evident audit logs of prompts, tool calls and approvals so you can reconstruct incidents. Record provenance for models and data so you know exactly what was running when something went wrong."}], "quiz": [{"q": "Indirect prompt injection often arrives via…", "choices": ["Retrieved documents or tool outputs", "Only the system prompt file", "GPU firmware", "Learning rate"], "answer": 0, "why": "Untrusted retrieved content is a classic channel."}, {"q": "The most reliable defense against prompt injection consequences is…", "choices": ["A longer system prompt", "Using temperature 0", "Limiting what the model's tools can do", "Asking the model to be careful"], "answer": 2, "why": "You cannot filter injection perfectly, so least privilege limits the damage."}, {"q": "Pickle-based model files are risky because…", "choices": ["Loading them can execute arbitrary code", "They are slow on GPUs", "They are large", "They lack metadata"], "answer": 0, "why": "Pickle deserialization runs code; prefer safetensors."}], "conceptIds": ["threat-model", "prompt-injection-defense"]}, {"id": "sc-found", "title": "NLP Foundations: Word Vectors to Scaling Laws", "why": "Knowing how we got from word2vec to frontier models makes today's design choices (context, scale, data, interpretability) make sense.", "explainer": "Modern LLMs are the end of a short chain of ideas. Word embeddings (word2vec, GloVe) showed that meaning can be captured as vectors learned from co-occurrence. Recurrent networks (RNNs, LSTMs) processed sequences token by token but struggled with long-range dependencies and could not parallelize across a sequence. Attention, then the transformer, removed recurrence and let every token look at every other token in parallel, which made training on vast data practical.\n\nPretraining on next-token prediction over trillions of tokens produces general capabilities; scaling laws (Kaplan et al., then Chinchilla) describe how loss falls predictably with parameters, data and compute, and that compute-optimal training uses roughly 20 tokens per parameter. Data curation (deduplication, quality filtering, mixtures) matters as much as size. Interpretability research (probing, attention analysis, sparse autoencoders) tries to explain what the network learned.\n\nCommon mistakes: assuming bigger is always better instead of compute-optimal; ignoring data quality; treating attention maps as full explanations.\n\nMental model: every generation fixed the previous one's bottleneck: meaning, then sequence, then parallelism, then scale.", "resources": [{"title": "Stanford CS224N", "url": "https://web.stanford.edu/class/cs224n/"}, {"title": "Stanford CS336: Language Modeling from Scratch", "url": "https://stanford-cs336.github.io/spring2025/"}, {"title": "Chinchilla: Training compute-optimal LLMs (arXiv)", "url": "https://arxiv.org/abs/2203.15556"}, {"title": "Anthropic: Towards monosemanticity (sparse autoencoders)", "url": "https://transformer-circuits.pub/2023/monosemantic-features"}], "project": "Train word2vec on a small corpus and test analogies; train a tiny LSTM and a tiny transformer on the same character-level data and compare loss and speed; then fit a scaling-law curve from 4 model sizes and predict the loss of a 5th.", "topics": [{"id": "sc-found-t1", "title": "Word embeddings and recurrent networks", "explainer": "Word2vec learns a vector per word by predicting neighbors (skip-gram) or the center word (CBOW); similar words end up close, and some relations become vector offsets. Embeddings are static: one vector per word regardless of context. RNNs and LSTMs added context by reading tokens sequentially with a hidden state; LSTM gates reduced vanishing gradients, but sequential processing limited training speed and long-range memory. These limits motivated attention, first added to RNN encoders for translation, and then the attention-only transformer.", "subtopics": [{"id": "sc-found-t1-s1", "title": "Skip-gram and CBOW"}, {"id": "sc-found-t1-s2", "title": "Static vs contextual embeddings"}, {"id": "sc-found-t1-s3", "title": "RNN hidden state"}, {"id": "sc-found-t1-s4", "title": "LSTM gates and vanishing gradients"}, {"id": "sc-found-t1-s5", "title": "Seq2seq with attention"}]}, {"id": "sc-found-t2", "title": "Pretraining and scaling laws", "explainer": "Pretraining minimizes next-token prediction loss on web, code, books and curated data. Scaling laws show loss decreasing as a power law in parameters N, tokens D and compute C, roughly C ≈ 6ND FLOPs. Chinchilla found earlier models were undertrained and that compute-optimal training uses about 20 tokens per parameter, though production models are often trained far beyond that to make inference cheaper. Data pipelines with deduplication, quality filters and domain mixtures often move results more than architecture tweaks.", "subtopics": [{"id": "sc-found-t2-s1", "title": "Next-token objective"}, {"id": "sc-found-t2-s2", "title": "C ≈ 6ND compute rule"}, {"id": "sc-found-t2-s3", "title": "Compute-optimal vs overtrained models"}, {"id": "sc-found-t2-s4", "title": "Data deduplication and filtering"}, {"id": "sc-found-t2-s5", "title": "Data mixtures"}]}, {"id": "sc-found-t3", "title": "Interpretability basics", "explainer": "Interpretability asks what representations and circuits a model uses. Probing trains a small classifier on hidden states to test whether a property is encoded. Attention visualization shows where heads look but not why. Mechanistic interpretability identifies circuits, and sparse autoencoders decompose activations into many more interpretable features, some of which can be steered. For engineers, interpretability is mostly a research lens today, but it informs safety evaluations and debugging of fine-tuned behavior.", "subtopics": [{"id": "sc-found-t3-s1", "title": "Linear probes"}, {"id": "sc-found-t3-s2", "title": "Attention visualization limits"}, {"id": "sc-found-t3-s3", "title": "Circuits"}, {"id": "sc-found-t3-s4", "title": "Sparse autoencoders and features"}, {"id": "sc-found-t3-s5", "title": "Steering and safety uses"}]}], "quiz": [{"q": "Why did transformers replace RNNs for large-scale training?", "choices": ["They use no attention", "They process all tokens in parallel and handle long-range dependencies better", "They need no data", "Fewer parameters"], "answer": 1, "why": "Removing recurrence enables parallel training and direct long-range attention."}, {"q": "Chinchilla's compute-optimal rule of thumb is about…", "choices": ["No relation", "1,000 tokens per parameter", "20 tokens per parameter", "1 token per parameter"], "answer": 2, "why": "Chinchilla suggests roughly 20 training tokens per parameter for compute-optimal training."}, {"q": "A 7B model trained on 2T tokens needs roughly how many training FLOPs (C ≈ 6ND)?", "choices": ["8.4 × 10^25", "8.4 × 10^16", "8.4 × 10^22", "8.4 × 10^19"], "answer": 2, "why": "6 × 7e9 × 2e12 = 8.4e22 FLOPs."}], "conceptIds": ["attention"]}]}, "tracks": [{"id": "architect", "name": "AI Architect", "role": "Owns system shape: requirements to reference architecture, build/buy, governance, cost and risk. Day to day: ADRs, vendor bake-offs, security reviews, capacity models. Differs from AI Engineer (ships the app) and Infra (runs GPUs): you decide what gets built and why it survives a year.", "icon": "compass", "levels": [{"id": "a-l1", "name": "L1 Foundations", "subjects": [{"id": "a-sys", "title": "Systems Thinking for AI Products", "why": "AI is a probabilistic subsystem; architecture must absorb that.", "explainer": "Classical architecture assumes deterministic services. AI features return distributions, burn tokens, and fail semantically even when HTTP is 200. Your job is to place bounds: SLOs for latency and quality, human-in-the-loop where irreversible actions live, and clear ownership of model versus product metrics.\n\nDecompose around bounded contexts, not around the newest framework. Prefer sync paths for user-facing chat and async workers for long agents. Design degraded modes (smaller model, cached answers, keyword search) the same way you design for AZ loss.\n\nCommon mistake: a single mega-agent diagram with no failure domains. Another: copying a Big Tech reference architecture that assumes their data platform.\n\nWrite ADRs that record the probabilistic assumptions — future you will need them when the model changes.", "resources": [{"title": "Designing Data-Intensive Applications", "url": "https://www.oreilly.com/library/view/designing-data-intensive-applications/9781491903063/"}, {"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}, {"title": "Azure AI architecture", "url": "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/"}, {"title": "Designing Machine Learning Systems", "url": "https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/"}], "project": "Write an ADR for customer-support AI: workflow vs agent, retrieval vs fine-tune, rollback plan.", "topics": [{"id": "a-sys-req", "title": "Requirements", "subtopics": [{"id": "a-sys-req-s1", "title": "Functional vs NFR"}, {"id": "a-sys-req-s2", "title": "Latency / accuracy / cost SLOs"}, {"id": "a-sys-req-s3", "title": "Data residency and tenancy"}, {"id": "a-sys-req-s4", "title": "Human-in-the-loop needs"}, {"id": "a-sys-req-s5", "title": "Abuse and misuse cases"}], "explainer": "AI requirements need numbers on more axes than usual. Besides features, pin down latency (time to first token and total), quality (task success on an eval set), cost per request or per user per month, and availability. Ask where data may be processed and stored, and whether tenants must be isolated. Decide where humans review or approve. Write abuse cases alongside use cases: what happens when someone tries to jailbreak it, scrape it, or run up the bill? Requirements that skip these show up later as surprise invoices, compliance blockers, or a security incident."}, {"id": "a-sys-decomp", "title": "Decomposition", "subtopics": [{"id": "a-sys-decomp-s1", "title": "Bounded contexts"}, {"id": "a-sys-decomp-s2", "title": "Sync vs async paths"}, {"id": "a-sys-decomp-s3", "title": "Failure domains"}, {"id": "a-sys-decomp-s4", "title": "Strangler patterns"}, {"id": "a-sys-decomp-s5", "title": "Degraded modes"}], "explainer": "Break the system along boundaries that fail and scale differently. Keep the synchronous user path thin and push slow work (enrichment, indexing, long agent runs) to async queues. Separate failure domains so a model provider outage degrades one feature instead of the whole product. Use strangler patterns to replace legacy flows incrementally rather than in a big bang. Design degraded modes up front: cached answers, a smaller fallback model, or a \"we're busy, here's a form\" path. A good decomposition makes it obvious which team owns which latency and cost budget."}], "quiz": [{"q": "A 200 OK from an LLM API guarantees…", "choices": ["Bytes returned, not semantic correctness", "Grounded truth", "Compliance", "Zero cost"], "answer": 0, "why": "Transport success is not task success."}, {"q": "Which is a non-functional requirement for an AI feature?", "choices": ["p95 time to first token under 1 second", "Show a button", "Support PDF uploads", "Summarize a document"], "answer": 0, "why": "Latency targets constrain how, not what, the system does."}, {"q": "A degraded mode for an LLM feature could be…", "choices": ["Returning a stack trace", "Serving a cached answer or a smaller fallback model", "Retrying forever", "Disabling logging"], "answer": 1, "why": "Planned degradation keeps users served when the main path fails."}], "conceptIds": ["ref-arch"]}, {"id": "a-mlsys", "title": "ML / LLM System Lifecycle", "why": "Know data to production so you do not design dead ends.", "explainer": "Hidden Technical Debt in ML Systems still applies — only now prompts, tools, and indexes are also config. Map data, train or adapt, eval, serve, monitor, feedback. Offline versus online features matter for classical ML; for LLMs the analogs are frozen corpora versus live retrieval and tool results.\n\nDrift is not only statistical: prompt drift, schema drift, and harness drift break agents. Shadow and canary deployments need quality gates, not only error-rate gates.\n\nCommon mistake: treating the prompt store as tribal knowledge in Slack. Another: no owner for evaluation when the model vendor ships a silent upgrade.\n\nArchitects insist on lineage: which prompt, which index build, which model revision produced this answer.", "resources": [{"title": "Designing Machine Learning Systems", "url": "https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/"}, {"title": "Chip Huyen ML Systems Design", "url": "https://github.com/chiphuyen/machine-learning-systems-design"}, {"title": "Full Stack Deep Learning", "url": "https://fullstackdeeplearning.com/"}, {"title": "ml-ops.org", "url": "https://ml-ops.org/"}, {"title": "GCP MLOps", "url": "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning"}], "project": "Map a past project onto the lifecycle; list every place drift can hide.", "topics": [{"id": "a-mlsys-pipe", "title": "Pipeline", "subtopics": [{"id": "a-mlsys-pipe-s1", "title": "Data to adapt to eval to serve to monitor"}, {"id": "a-mlsys-pipe-s2", "title": "Offline vs online signals"}, {"id": "a-mlsys-pipe-s3", "title": "Feedback loops"}, {"id": "a-mlsys-pipe-s4", "title": "Shadow / canary / blue-green"}, {"id": "a-mlsys-pipe-s5", "title": "Artifact lineage"}], "explainer": "An AI system is a pipeline, not a model: data flows into adaptation (prompts, RAG indexes, fine-tunes), into evaluation, into serving, and into monitoring that feeds back into data. Offline signals (eval scores) and online signals (user behavior) must both exist. Release with shadow, canary or blue-green deployments, exactly as with code. Track lineage so every response can be traced to a prompt version, model version, index snapshot and config. Without lineage you cannot answer the most common incident question: what changed?"}, {"id": "a-mlsys-debt", "title": "Debt and Drift", "subtopics": [{"id": "a-mlsys-debt-s1", "title": "Data / concept drift"}, {"id": "a-mlsys-debt-s2", "title": "Prompt and config drift"}, {"id": "a-mlsys-debt-s3", "title": "Harness drift"}, {"id": "a-mlsys-debt-s4", "title": "Glue-code jungles"}, {"id": "a-mlsys-debt-s5", "title": "Metric ownership"}], "explainer": "AI systems accumulate unusual debt. Data drift shifts inputs; concept drift changes what the right answer is. Prompts and configs drift as people tweak them in production without review. Harness drift happens when the agent framework changes behavior underneath you. Glue code between models, retrievers and tools grows into a jungle with no tests. The fix is boring discipline: version prompts and configs like code, monitor input distributions, assign an owner to every metric, and schedule regular eval refreshes so the golden set still reflects real traffic."}], "quiz": [{"q": "Prompt changes should be…", "choices": ["Versioned and eval-gated like code", "Edited live in prod only", "Stored only in chat history", "Ignored if the demo works"], "answer": 0, "why": "Prompts are production config."}, {"q": "Lineage lets you answer…", "choices": ["Which font to use", "What prompt, model, index and config produced this response", "How many users signed up", "Which GPU vendor is cheapest"], "answer": 1, "why": "Lineage links outputs to every versioned input."}, {"q": "Concept drift means…", "choices": ["Inputs change format", "Logs rotate", "The correct answer for the same input changes over time", "The model file corrupts"], "answer": 2, "why": "For example, policy or price changes make old answers wrong."}], "conceptIds": []}, {"id": "a-llm-arch", "title": "Model Landscape Literacy for Architects", "why": "You cannot choose platforms without knowing model shapes.", "explainer": "Frontier APIs, open-weight dense models, MoE, small on-device models, and VLMs are different animals for cost, control, and failure modes. Licensing (open weights versus open source versus proprietary API) constrains commercialization. Context length, tool-calling quality, and multilingual fertility change the architecture more than brand names.\n\nCommon mistake: picking a model from a leaderboard without matching the client's data residency and latency envelope. Another: ignoring tokenizer and chat-template lock-in when planning multi-vendor routing.\n\nKeep a living scorecard: capability, controllability, cost, compliance, community.", "resources": [{"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}, {"title": "Stanford CS336", "url": "https://cs336.stanford.edu/"}, {"title": "Chinchilla scaling laws", "url": "https://arxiv.org/abs/2203.15556"}, {"title": "Mixture of Experts (Shazeer et al.)", "url": "https://arxiv.org/abs/1701.06538"}], "project": "Build a one-page scorecard comparing one frontier API, one open 70B, and one small edge model for a fixed use case.", "topics": [{"id": "a-llm-types", "title": "Model Types", "subtopics": [{"id": "a-llm-types-s1", "title": "Frontier APIs"}, {"id": "a-llm-types-s2", "title": "Open-weight dense"}, {"id": "a-llm-types-s3", "title": "MoE serving implications"}, {"id": "a-llm-types-s4", "title": "SLMs / on-device"}, {"id": "a-llm-types-s5", "title": "VLMs and speech"}], "explainer": "Know the categories. Frontier APIs give top capability with no ops burden but less control over data, versions and cost. Open-weight dense models can be self-hosted and tuned, at the cost of running GPUs. MoE models give big-model quality with smaller compute per token but large memory footprints. Small language models run cheaply on CPUs, phones and edge boxes for narrow tasks. Vision-language and speech models add modalities with their own latency and cost profiles. Most real architectures mix several of these behind one gateway."}, {"id": "a-llm-select", "title": "Selection", "subtopics": [{"id": "a-llm-select-s1", "title": "Leaderboard skepticism"}, {"id": "a-llm-select-s2", "title": "Licensing and use rights"}, {"id": "a-llm-select-s3", "title": "Tokenizer / template lock-in"}, {"id": "a-llm-select-s4", "title": "Tool-calling maturity"}, {"id": "a-llm-select-s5", "title": "Eval on YOUR data"}], "explainer": "Leaderboards are a starting filter, not an answer: benchmarks leak into training data and rarely match your domain. Read licenses carefully, since \"open weights\" may still restrict commercial use or user counts. Tokenizer and chat template choices create quiet lock-in in prompts and fine-tunes. Check tool-calling and structured output maturity if you are building agents. The only reliable selection method is running two or three candidates on your own golden set and comparing quality, latency and cost per successful task."}], "quiz": [{"q": "Open weights always means…", "choices": ["Not automatically OSI open source or unlimited commercial rights", "Free for any military use", "No safety risk", "Identical to the API twin"], "answer": 0, "why": "Weights, license, and API product are distinct."}, {"q": "The most reliable way to choose a model for a client is…", "choices": ["Picking the cheapest", "Picking the newest", "Top leaderboard rank", "Running candidates on the client's own golden set"], "answer": 3, "why": "Your data and tasks decide; benchmarks are only a filter."}, {"q": "Small language models are a good fit for…", "choices": ["Frontier reasoning", "Nothing", "Narrow, high-volume or on-device tasks", "Training other frontier models"], "answer": 2, "why": "They trade breadth for cost, latency and privacy."}], "conceptIds": []}]}, {"id": "a-l2", "name": "L2 Practitioner", "subjects": [{"id": "a-ref", "title": "Reference Architectures", "why": "Reuse proven shapes; do not invent a snowflake per client.", "explainer": "Most enterprise AI systems are compositions of a few patterns: request/response LLM API, RAG with citations, batch enrichment, event-driven agent workers, and human review queues. Layer edge, API, orchestration, model gateway, and data carefully. Separate control plane (prompts, policies, evals) from data plane (tokens, embeddings, tool I/O).\n\nMulti-region and multi-tenant designs need sticky considerations for prefix caches and per-tenant keys.\n\nCommon mistake: drawing microservices everywhere when a modular monolith with a model gateway would ship sooner. Another: no shared observability layer, so every squad invents tracing.\n\nYour deliverable is a one-pager engineers can build from — not a slide museum.", "resources": [{"title": "Azure AI architecture", "url": "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/"}, {"title": "GCP MLOps", "url": "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning"}, {"title": "AWS Bedrock", "url": "https://docs.aws.amazon.com/bedrock/"}, {"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}], "project": "Produce a one-page reference for multi-tenant RAG SaaS with auth, quotas, and audit.", "topics": [{"id": "a-ref-pat", "title": "Patterns", "subtopics": [{"id": "a-ref-pat-s1", "title": "LLM API facade"}, {"id": "a-ref-pat-s2", "title": "RAG plus citations"}, {"id": "a-ref-pat-s3", "title": "Batch enrichment"}, {"id": "a-ref-pat-s4", "title": "Agent workers"}, {"id": "a-ref-pat-s5", "title": "Human review queues"}], "explainer": "A handful of patterns cover most AI products. An LLM API facade wraps providers behind your own interface. RAG with citations grounds answers in your documents. Batch enrichment runs models over large datasets offline for classification or extraction. Agent workers execute multi-step tasks from a queue with tools and budgets. Human review queues route low-confidence or high-risk outputs to people. Knowing these lets you sketch a credible architecture in a first client meeting and then adjust for their constraints."}, {"id": "a-ref-layers", "title": "Layering", "subtopics": [{"id": "a-ref-layers-s1", "title": "Edge / API / orchestration / model / data"}, {"id": "a-ref-layers-s2", "title": "Control vs data plane"}, {"id": "a-ref-layers-s3", "title": "Multi-region failover"}, {"id": "a-ref-layers-s4", "title": "Shared services (auth, billing, obs)"}], "explainer": "Draw AI systems in layers: edge (auth, rate limits), API, orchestration (prompts, agents, workflows), model (gateway, serving), and data (indexes, stores). Separate the control plane, where policies, routing rules, prompt versions and budgets live, from the data plane that handles requests. Plan multi-region failover for both models and indexes. Shared services such as identity, billing, observability and secrets should be reused, not rebuilt per feature. Clear layers make it easy to swap a model or vendor without rewriting the product."}], "quiz": [{"q": "Control plane for AI usually includes…", "choices": ["Prompt registry, policies, evals, routing config", "Only GPU drivers", "Only the vector DB", "Customer PII tables"], "answer": 0, "why": "Control plane governs how models are used."}, {"q": "Separating control plane from data plane means…", "choices": ["Splitting frontend and backend", "Policies and configs are managed apart from request handling", "Using two clouds", "Duplicating databases"], "answer": 1, "why": "Policy changes then do not require redeploying request paths."}, {"q": "Which pattern best fits classifying 10 million records overnight?", "choices": ["Realtime chat", "Browser agent", "Semantic cache", "Batch enrichment"], "answer": 3, "why": "Batch APIs and offline pipelines are cheaper and simpler for bulk work."}], "conceptIds": ["ref-arch"]}, {"id": "a-bb", "title": "Build vs Buy vs Host", "why": "Wrong call here burns months of runway.", "explainer": "Decision dimensions: capability ceiling, latency and region, data control and sovereignty, unit economics, lock-in and exit. Options: frontier APIs, cloud managed (Bedrock, Azure AI Foundry, Vertex), open-weight self-host, and hybrid routing (cheap model with escalation).\n\nGateways like LiteLLM or custom routers buy portability but add an ops surface. Self-hosting shifts spend from tokens to GPUs, people, and reliability engineering.\n\nCommon mistake: self-hosting for 'savings' at low volume where APIs would be cheaper. Another: all-in on one vendor with no export path for prompts, evals, and traces.\n\nScore options with explicit weights tied to the client's constraints — not your favorite stack.", "resources": [{"title": "AWS Bedrock", "url": "https://docs.aws.amazon.com/bedrock/"}, {"title": "Azure AI Foundry", "url": "https://learn.microsoft.com/en-us/azure/ai-foundry/"}, {"title": "Vertex AI", "url": "https://cloud.google.com/vertex-ai/docs"}, {"title": "LiteLLM", "url": "https://docs.litellm.ai/"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}], "project": "Scored decision matrix: Bedrock vs Azure AI Foundry vs self-hosted vLLM for a mid-market client.", "topics": [{"id": "a-bb-dim", "title": "Dimensions", "subtopics": [{"id": "a-bb-dim-s1", "title": "Capability ceiling"}, {"id": "a-bb-dim-s2", "title": "Latency and region"}, {"id": "a-bb-dim-s3", "title": "Sovereignty"}, {"id": "a-bb-dim-s4", "title": "Unit economics"}, {"id": "a-bb-dim-s5", "title": "Lock-in / exit"}], "explainer": "Compare options on five axes. Capability ceiling: can anything but a frontier model do the task? Latency and region: where must inference run? Sovereignty: can data or weights leave the boundary? Unit economics: what is the cost per successful task at expected volume? Lock-in and exit: how hard is it to switch providers? Score each option against these explicitly with the client so the decision survives a change of leadership or a price change."}, {"id": "a-bb-opt", "title": "Options", "subtopics": [{"id": "a-bb-opt-s1", "title": "Frontier APIs"}, {"id": "a-bb-opt-s2", "title": "Cloud managed platforms"}, {"id": "a-bb-opt-s3", "title": "Open-weight self-host"}, {"id": "a-bb-opt-s4", "title": "Hybrid routing"}, {"id": "a-bb-opt-s5", "title": "Gateway layers (LiteLLM etc.)"}], "explainer": "The realistic menu is: frontier APIs, cloud-managed platforms (Bedrock, Vertex, Azure AI Foundry), self-hosted open weights on your GPUs, or a hybrid with routing. Hybrid is common: cheap or private traffic goes to a self-hosted model, hard queries go to a frontier API. A gateway layer (LiteLLM, Envoy AI Gateway, Kong, or a cloud gateway) gives one API, keys, budgets and fallbacks across all of them. Self-hosting only pays off above a utilization threshold, so do the math first."}], "quiz": [{"q": "Hybrid routing primarily optimizes…", "choices": ["Cost/quality by sending easy work to cheaper models", "GPU thermals only", "Tokenizer fertility", "EU AI Act automatically"], "answer": 0, "why": "Route by difficulty/risk to control spend."}, {"q": "Self-hosting open weights usually pays off when…", "choices": ["You need the best frontier model", "Utilization is high and steady", "Traffic is tiny and spiky", "You have no GPU skills"], "answer": 1, "why": "GPU cost is fixed per hour; high utilization drives down cost per token."}, {"q": "A gateway layer gives you…", "choices": ["Faster GPUs", "Free tokens", "Model training", "One API, central keys, budgets and fallbacks across providers"], "answer": 3, "why": "It decouples apps from providers."}], "conceptIds": ["cost-model"]}, {"id": "a-data", "title": "Enterprise Data Platforms for AI", "why": "Most AI projects fail on data access, quality, and rights.", "explainer": "Lakehouse/warehouse, vector and keyword indexes, catalogs, lineage, and quality monitors are the substrate. Rights (training versus inference use), PII/PHI, and freshness SLAs constrain design. Chunking and metadata standards are architectural decisions, not afterthoughts.\n\nCommon mistake: a pilot on a CSV export that cannot be refreshed in production. Another: embeddings of secrets that now live forever in a vector store.\n\nDefine data contracts for each retrieval slice before model selection.", "resources": [{"title": "Databricks ML", "url": "https://www.databricks.com/product/machine-learning"}, {"title": "Designing Machine Learning Systems", "url": "https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/"}, {"title": "Designing Data-Intensive Applications", "url": "https://www.oreilly.com/library/view/designing-data-intensive-applications/9781491903063/"}], "project": "Design a data contract and retrieval slice for one domain including PII handling.", "topics": [{"id": "a-data-plat", "title": "Platform", "subtopics": [{"id": "a-data-plat-s1", "title": "Lakehouse / warehouse"}, {"id": "a-data-plat-s2", "title": "Vector + keyword indexes"}, {"id": "a-data-plat-s3", "title": "Catalog, lineage, quality"}, {"id": "a-data-plat-s4", "title": "Embedding stores"}, {"id": "a-data-plat-s5", "title": "Access patterns"}], "explainer": "AI rides on the data platform. A lakehouse or warehouse holds governed source data. Retrieval needs both vector and keyword indexes, ideally fed from the same pipeline. A catalog with lineage and quality checks tells you where each chunk came from and whether it is fresh. Embedding stores must be versioned with the embedding model, because changing models means re-embedding everything. Think about access patterns early: per-user ACL filtering at query time is far easier if permissions are stored as chunk metadata from day one."}, {"id": "a-data-gov", "title": "Rights and Quality", "subtopics": [{"id": "a-data-gov-s1", "title": "Licensing / training rights"}, {"id": "a-data-gov-s2", "title": "PII/PHI/secrets scanning"}, {"id": "a-data-gov-s3", "title": "Freshness SLAs"}, {"id": "a-data-gov-s4", "title": "Chunking and metadata standards"}, {"id": "a-data-gov-s5", "title": "Retention and deletion"}], "explainer": "Before data feeds a model, know whether you have the right to use it for that purpose, especially for training. Scan for PII, PHI and secrets before indexing. Set freshness SLAs so stale documents do not produce confident wrong answers. Standardize chunking and metadata (source, owner, ACL, timestamp) across teams. Plan deletion end to end: removing a source document must also remove its chunks, embeddings, cache entries and any derived summaries, or you will fail a right-to-erasure request."}], "quiz": [{"q": "Deleting a source document requires…", "choices": ["Also deleting or regenerating derived embeddings/chunks", "Only removing the UI link", "Retraining the foundation model", "Nothing — vectors expire automatically"], "answer": 0, "why": "Derived indexes retain content unless purged."}, {"q": "Switching embedding models requires…", "choices": ["Re-embedding the corpus", "A new tokenizer for users", "Nothing", "Deleting the warehouse"], "answer": 0, "why": "Vectors from different models are not comparable."}, {"q": "Per-user permission filtering in RAG is easiest when…", "choices": ["You disable search", "The prompt says \"respect permissions\"", "ACLs are stored as chunk metadata", "Embeddings are larger"], "answer": 2, "why": "Filter at retrieval time using metadata, not in the prompt."}], "conceptIds": []}, {"id": "a-gateway", "title": "Model Gateways, Semantic Cache & Routing", "why": "The gateway is where cost, policy, and portability meet.", "explainer": "A model gateway centralizes auth, budgets, routing, fallbacks, and observability across providers. Semantic caching (embedding-similar prompt reuse) can slash cost for FAQs but risks stale or cross-tenant leaks if keyed poorly. Structured rate limits and circuit breakers protect both wallet and upstream SLAs.\n\nCommon mistake: caching on raw prompt strings only, missing near-duplicates — or worse, caching across tenants. Another: a gateway that rewrites prompts silently and breaks eval baselines.\n\nTreat the gateway as a product with its own SLOs and audit log.", "resources": [{"title": "LiteLLM", "url": "https://docs.litellm.ai/"}, {"title": "OpenTelemetry", "url": "https://opentelemetry.io/docs/"}, {"title": "AWS Bedrock", "url": "https://docs.aws.amazon.com/bedrock/"}], "project": "Sketch a gateway: routes, cache key design, tenant isolation, and fallback chain.", "topics": [{"id": "a-gw-feat", "title": "Gateway Features", "subtopics": [{"id": "a-gw-feat-s1", "title": "Multi-provider adapters"}, {"id": "a-gw-feat-s2", "title": "Auth and budgets"}, {"id": "a-gw-feat-s3", "title": "Fallbacks and hedges"}, {"id": "a-gw-feat-s4", "title": "Policy hooks"}, {"id": "a-gw-feat-s5", "title": "Unified traces"}], "explainer": "A model gateway sits between apps and model providers. It normalizes APIs so apps call one interface, holds provider keys so apps never see them, and enforces per-team budgets and rate limits. It adds fallbacks (switch provider on errors) and hedging (send a second request if the first is slow). Policy hooks run PII redaction, prompt-injection screening or content filters on the way in and out. Every call emits a unified trace with tokens, cost and latency, which makes it the natural place to measure and govern AI usage."}, {"id": "a-gw-cache", "title": "Semantic Cache", "subtopics": [{"id": "a-gw-cache-s1", "title": "Embedding similarity keys"}, {"id": "a-gw-cache-s2", "title": "TTL and invalidation"}, {"id": "a-gw-cache-s3", "title": "Tenant isolation"}, {"id": "a-gw-cache-s4", "title": "Stale answer risk"}, {"id": "a-gw-cache-s5", "title": "Bypass rules"}], "explainer": "A semantic cache returns a stored answer when a new prompt is close enough in embedding space to an old one. It can cut cost and latency sharply for FAQ-like traffic. The risks are wrong hits and leaks: the similarity threshold must be tuned on real pairs, keys must include tenant, model and prompt version, and TTLs must respect how fast the truth changes. Never share cache entries across tenants or permission levels. Provide bypass rules for personalized, time-sensitive or tool-using requests."}], "quiz": [{"q": "Semantic cache keys should…", "choices": ["Include tenant and policy scope, not only text similarity", "Be a global hash of the prompt alone", "Ignore safety tier", "Store raw secrets for speed"], "answer": 0, "why": "Isolation and policy beat naive similarity."}, {"q": "Hedging in a gateway means…", "choices": ["Sending a backup request if the first is slow", "Buying GPU futures", "Blocking requests", "Caching everything"], "answer": 0, "why": "Hedging trades some extra cost for lower tail latency."}, {"q": "Semantic cache entries must never be shared across…", "choices": ["Models of the same family", "Regions", "Days", "Tenants or permission levels"], "answer": 3, "why": "Cross-tenant hits leak data."}], "conceptIds": ["llm-gateway-routing"]}, {"id": "a-fde", "title": "Forward Deployed Engineering: Discovery to Production", "why": "FDEs turn ambiguous customer problems into running agentic systems inside messy enterprises; it is the fastest-growing AI engineering role in services and labs.", "explainer": "A Forward Deployed Engineer (FDE) embeds with a customer, writes production code in their environment, and owns outcomes such as time-to-value, adoption and reliability, not slideware. 2026 postings from labs, hyperscalers and consultancies describe the same loop: discover the real workflow, scope a narrow high-value use case, prototype in days, harden to production in weeks, hand over to the customer's team, and feed field learnings back to the product.\n\nThe technical stack is the whole atlas in miniature: Python and APIs, RAG and tool calling, MCP servers into legacy systems, evals, identity and security reviews, CI/CD and observability. The differentiator is judgment under ambiguity: choosing the use case where data access, measurable value and risk tolerance line up, and saying no to the rest.\n\nCommon mistakes: building a flashy demo on sample data that dies at the security review; no success metric agreed up front; ignoring the people whose work changes; leaving no runbook so the system rots after you leave.\n\nMental model: an FDE is a startup CTO for one customer problem, with a deadline and someone else's infrastructure.", "resources": [{"title": "a16z: Trading margin for moat — the FDE model", "url": "https://a16z.com/services-led-growth/"}, {"title": "The Mom Test (customer conversations)", "url": "https://www.momtestbook.com/"}, {"title": "Anthropic: Building effective agents", "url": "https://www.anthropic.com/engineering/building-effective-agents"}], "project": "Run a mock engagement: interview a 'customer' (a friend or LLM role-play) about a real workflow, write a one-page scope with success metric and data access plan, build a working prototype on their real-shaped data in 3 days, then a production-readiness checklist (security, evals, monitoring, runbook, handover) and a 10-minute exec readout.", "topics": [{"id": "a-fde-t1", "title": "Discovery and scoping", "explainer": "Start with the workflow, not the model. Shadow the people doing the work, map steps, systems, hand-offs and pain, and quantify volume and cost. Ask about past behavior, not hypothetical wishes. Then score candidate use cases on value, data accessibility, risk and measurability, and choose one narrow slice. Write a scope with a baseline metric, a target, the data and system access needed, the security reviewers, and what is explicitly out of scope. Getting access approved is often the critical path.", "subtopics": [{"id": "a-fde-t1-s1", "title": "Workflow shadowing and mapping"}, {"id": "a-fde-t1-s2", "title": "Quantifying baseline cost and volume"}, {"id": "a-fde-t1-s3", "title": "Use-case scoring: value, data, risk"}, {"id": "a-fde-t1-s4", "title": "Success metrics and baselines"}, {"id": "a-fde-t1-s5", "title": "Access and security review planning"}]}, {"id": "a-fde-t2", "title": "Demo to production", "explainer": "A demo proves possibility; production proves reliability. The path: prototype on real-shaped data, then build an eval set from customer examples, connect to real systems through least-privilege connectors, add tracing, guardrails and human approval for risky actions, pass the customer's security and privacy review, and roll out to a pilot group with feedback capture. Expect integration and data-readiness problems to consume most of the time, not prompting.", "subtopics": [{"id": "a-fde-t2-s1", "title": "Prototype on real-shaped data"}, {"id": "a-fde-t2-s2", "title": "Customer-derived eval sets"}, {"id": "a-fde-t2-s3", "title": "Integrations and identity"}, {"id": "a-fde-t2-s4", "title": "Security and privacy review"}, {"id": "a-fde-t2-s5", "title": "Pilot rollout and feedback"}]}, {"id": "a-fde-t3", "title": "Handover, adoption and field feedback", "explainer": "Success is the customer running it without you. Leave infrastructure as code, runbooks, dashboards, an eval suite and trained owners. Measure adoption and the business metric, not just uptime. Run enablement sessions and identify internal champions. Finally, codify what you learned into reusable patterns, connectors and product feedback, which is how FDE teams scale across many customers rather than rebuilding from scratch each time.", "subtopics": [{"id": "a-fde-t3-s1", "title": "Runbooks and ownership transfer"}, {"id": "a-fde-t3-s2", "title": "Adoption and outcome metrics"}, {"id": "a-fde-t3-s3", "title": "Enablement and champions"}, {"id": "a-fde-t3-s4", "title": "Reusable accelerators"}, {"id": "a-fde-t3-s5", "title": "Product feedback loops"}]}, {"id": "a-fde-x1", "title": "Workshops, exec readouts and enterprise platform integration", "explainer": "FDEs run discovery workshops: map the workflow on a whiteboard with the people who do it, list systems and data, and agree on the metric. Exec readouts are short: problem, result versus baseline, risks, cost and next step. Most enterprise value runs through SAP, Salesforce, ServiceNow, Workday and Microsoft 365, so learn their APIs, event models, permission schemes and the vendor's own agent features before building custom connectors.", "subtopics": [{"id": "a-fde-x1-s1", "title": "Discovery workshop format"}, {"id": "a-fde-x1-s2", "title": "Exec readout structure"}, {"id": "a-fde-x1-s3", "title": "SAP, Salesforce, ServiceNow APIs"}, {"id": "a-fde-x1-s4", "title": "Vendor-native agent features"}, {"id": "a-fde-x1-s5", "title": "Change management with users"}]}], "quiz": [{"q": "What should an FDE agree with the customer before building?", "choices": ["The model brand", "The number of agents", "The UI color", "A baseline and target success metric plus data access plan"], "answer": 3, "why": "Without a metric and access, the project cannot prove value or reach production."}, {"q": "What usually consumes most time between demo and production?", "choices": ["Choosing fonts", "GPU procurement", "Integration, data readiness and security review", "Prompt wording"], "answer": 2, "why": "Enterprise integration and approvals dominate real timelines."}, {"q": "What defines a successful FDE handover?", "choices": ["The FDE stays forever", "The demo video", "The customer team operates it with runbooks, evals and dashboards", "More features"], "answer": 2, "why": "Ownership transfer is the goal."}], "conceptIds": ["fde-lifecycle"]}]}, {"id": "a-l3", "name": "L3 Advanced", "subjects": [{"id": "a-secarch", "title": "Security Architecture & Threat Modeling", "why": "Own the threat model before engineers write the loop.", "explainer": "Assets include models, data, tools, and keys. Attack paths include indirect injection via retrieval, confused-deputy tool abuse, and supply-chain tampering of MCP servers. Map STRIDE-like analysis onto LLM apps; align with OWASP LLM Top 10 and ATLAS techniques.\n\nArchitectural controls: network isolation, sandboxes, tool allowlists, approval gates, vaulted secrets, immutable audits.\n\nCommon mistake: bolting a content filter on outputs while tools can still wire money. Another: shared service accounts for all agents.\n\nThreat models are living documents — update when tools expand.", "resources": [{"title": "OWASP Top 10 for LLM Apps", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}, {"title": "MITRE ATLAS", "url": "https://atlas.mitre.org/"}, {"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}, {"title": "Securing MCP (InfoQ)", "url": "https://www.infoq.com/articles/securing-mcp-production-gateway/"}], "project": "STRIDE-style threat model for an agent with email-read and ticket-write tools.", "topics": [{"id": "a-sec-tm", "title": "Threat Modeling", "subtopics": [{"id": "a-sec-tm-s1", "title": "Assets: models, data, tools, keys"}, {"id": "a-sec-tm-s2", "title": "Indirect injection paths"}, {"id": "a-sec-tm-s3", "title": "Confused deputy / tool abuse"}, {"id": "a-sec-tm-s4", "title": "Supply chain"}, {"id": "a-sec-tm-s5", "title": "Abuse at scale"}], "explainer": "Start by listing assets: model weights, system prompts, training and retrieval data, tool credentials, user data. Then trace how untrusted text reaches the model, including indirect paths through documents, web pages, emails and tool outputs. The confused deputy is the key agent risk: the agent has permissions the attacker lacks and can be talked into using them. Add supply chain (models, packages, MCP servers) and abuse at scale (scraping, cost attacks). STRIDE still works; extend it with MITRE ATLAS and the OWASP LLM Top 10."}, {"id": "a-sec-ctrl", "title": "Controls", "subtopics": [{"id": "a-sec-ctrl-s1", "title": "Network isolation and sandboxes"}, {"id": "a-sec-ctrl-s2", "title": "Tool allowlists / approvals"}, {"id": "a-sec-ctrl-s3", "title": "Secrets vaulting"}, {"id": "a-sec-ctrl-s4", "title": "Immutable audit logs"}, {"id": "a-sec-ctrl-s5", "title": "Red-team cadence"}], "explainer": "Controls that work regardless of model behavior: put tools and code execution in network-isolated sandboxes; use allowlists and human approvals for sensitive actions; keep secrets in a vault and inject short-lived, scoped tokens per call; log every prompt, tool call and approval in immutable storage; and schedule red-team exercises on a cadence, not once. Prefer architectural limits (the agent literally cannot reach the payments API) over prompt instructions (please don't touch payments)."}], "quiz": [{"q": "A confused deputy in agent systems is often…", "choices": ["A powerful tool identity abused via malicious instructions", "A misnamed Kubernetes pod", "A cold GPU", "A tokenizer bug only"], "answer": 0, "why": "Over-privileged tools act on injected instructions."}, {"q": "Which control is architectural rather than prompt-based?", "choices": ["Temperature 0", "\"Never reveal secrets\" in the system prompt", "Network policy that blocks the agent from the payments API", "A polite refusal"], "answer": 2, "why": "Architectural limits hold even when the model is tricked."}, {"q": "Which framework catalogs adversarial tactics against ML systems?", "choices": ["ITIL", "MITRE ATLAS", "TOGAF", "PCI DSS"], "answer": 1, "why": "ATLAS extends ATT&CK-style tactics to AI systems."}], "conceptIds": ["threat-model", "prompt-injection-defense"]}, {"id": "a-gov", "title": "Governance, Risk & Compliance", "why": "Enterprise deals die on GRC, not demos.", "explainer": "EU AI Act risk tiers, NIST AI RMF functions, ISO 42001 AIMS, and sector rules (HIPAA, SOC2, FedRAMP) define the operating theater. Model cards, system cards, DPIAs, and human oversight roles are deliverables, not paperwork theater.\n\nCommon mistake: claiming 'we use OpenAI so we are compliant.' Another: no incident response playbook for model hallucinations that caused customer harm.\n\nArchitects translate legal tiers into technical controls and evidence packs.", "resources": [{"title": "EU AI Act", "url": "https://artificialintelligenceact.eu/"}, {"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}, {"title": "ISO/IEC 42001", "url": "https://www.iso.org/standard/81230.html"}, {"title": "OWASP Top 10 for LLM Apps", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}], "project": "Classify a proposed system under EU AI Act tiers; draft a conformity checklist.", "topics": [{"id": "a-gov-fw", "title": "Frameworks", "subtopics": [{"id": "a-gov-fw-s1", "title": "EU AI Act tiers"}, {"id": "a-gov-fw-s2", "title": "NIST AI RMF"}, {"id": "a-gov-fw-s3", "title": "ISO 42001"}, {"id": "a-gov-fw-s4", "title": "Sector regimes"}, {"id": "a-gov-fw-s5", "title": "Contractual flow-downs"}], "explainer": "The EU AI Act sorts systems into risk tiers, with heavy obligations for high-risk uses and transparency duties for general-purpose models. NIST AI RMF gives a voluntary govern-map-measure-manage structure widely used in the US. ISO/IEC 42001 is a certifiable AI management system standard, similar in spirit to ISO 27001. Sector rules (HIPAA, financial model risk guidance such as SR 11-7, and others) still apply. Contracts flow obligations down to vendors, so your model provider's terms become part of your compliance story."}, {"id": "a-gov-ops", "title": "Operating Model", "subtopics": [{"id": "a-gov-ops-s1", "title": "Model / system cards"}, {"id": "a-gov-ops-s2", "title": "DPIA / AI impact assessments"}, {"id": "a-gov-ops-s3", "title": "Human oversight roles"}, {"id": "a-gov-ops-s4", "title": "Incident response"}, {"id": "a-gov-ops-s5", "title": "Evidence for auditors"}], "explainer": "Governance becomes real through artifacts and roles. Model and system cards document purpose, data, evals and limitations. AI impact assessments (often alongside DPIAs) record risks and mitigations before launch. Name who provides human oversight and what they can override. Extend incident response to cover AI failures such as harmful outputs, data leaks, or agent misbehavior. Keep evidence (eval results, approvals, change logs) organized so an auditor can follow it without a week of archaeology."}], "quiz": [{"q": "ISO 42001 is best described as…", "choices": ["An AI management system standard", "A GPU benchmark", "A tokenizer", "An agent protocol"], "answer": 0, "why": "42001 is AIMS — management system for AI."}, {"q": "The EU AI Act primarily classifies systems by…", "choices": ["Model size", "Risk tier of the use case", "Token price", "Vendor nationality"], "answer": 1, "why": "Obligations scale with risk of the application."}, {"q": "NIST AI RMF's four functions are…", "choices": ["Govern, Map, Measure, Manage", "Train, Tune, Serve, Retire", "Identify, Protect, Detect, Respond", "Plan, Build, Test, Ship"], "answer": 0, "why": "These structure AI risk work across the lifecycle."}], "conceptIds": []}, {"id": "a-cost", "title": "Cost Modeling & AI FinOps", "why": "Unit economics decide whether the architecture is viable.", "explainer": "Model cost as dollars per million tokens in and out, cache hit savings, tool-call overhead, and GPU-hour TCO for self-host. Add egress, storage for indexes, and eval spend. Quotas, routing tiers, and batch versus realtime are architectural levers.\n\nCommon mistake: ignoring output tokens (often more expensive) or tool loops that multiply calls. Another: no chargeback, so every team treats the LLM budget as infinite.\n\nBuild a spreadsheet the CFO can read and the engineer can update.", "resources": [{"title": "FinOps Foundation", "url": "https://www.finops.org/"}, {"title": "AWS Bedrock", "url": "https://docs.aws.amazon.com/bedrock/"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}], "project": "Spreadsheet: tokens in/out, cache hit rate, tool calls, GPU-hour alternative; find break-even.", "topics": [{"id": "a-cost-units", "title": "Unit Economics", "subtopics": [{"id": "a-cost-units-s1", "title": "$/1M tokens in vs out"}, {"id": "a-cost-units-s2", "title": "Cache / prefix savings"}, {"id": "a-cost-units-s3", "title": "GPU-hour TCO"}, {"id": "a-cost-units-s4", "title": "Egress and storage"}, {"id": "a-cost-units-s5", "title": "Eval and human review cost"}], "explainer": "Learn to compute cost per request: input tokens times input price plus output tokens times output price, with output typically 3 to 5 times more expensive. Prompt or prefix caching discounts repeated input heavily. For self-hosting, convert GPU-hour cost and measured throughput into dollars per million tokens. Do not forget egress, storage for l
