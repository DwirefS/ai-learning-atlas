 teaching fresh facts, which RAG handles better. You need clean, representative data, usually hundreds to thousands of examples. Watch for catastrophic forgetting of general skills. Check that the base model's license allows tuning and your use."}, {"id": "e-ft-how", "title": "Methods", "subtopics": [{"id": "e-ft-how-s1", "title": "SFT"}, {"id": "e-ft-how-s2", "title": "LoRA / QLoRA / DoRA family"}, {"id": "e-ft-how-s3", "title": "DPO / ORPO / KTO"}, {"id": "e-ft-how-s4", "title": "Synthetic data with validation"}, {"id": "e-ft-how-s5", "title": "Eval before merge"}], "explainer": "Supervised fine-tuning (SFT) trains on input-output pairs. LoRA freezes the base model and learns small low-rank matrices, cutting memory and producing swappable adapters; QLoRA does this on a 4-bit base. Preference methods such as DPO, ORPO and KTO learn from chosen-versus-rejected pairs without a separate reward model. Synthetic data can bootstrap training but must be filtered and validated. Always compare the tuned model to the base on your eval suite before merging."}, {"id": "e-ft-ops", "title": "Ops", "subtopics": [{"id": "e-ft-ops-s1", "title": "Dataset versioning"}, {"id": "e-ft-ops-s2", "title": "Checkpoint selection"}, {"id": "e-ft-ops-s3", "title": "Regression suites"}, {"id": "e-ft-ops-s4", "title": "Rollback"}, {"id": "e-ft-ops-s5", "title": "Cost of refresh"}], "explainer": "Version datasets alongside checkpoints. Pick checkpoints by eval score, not by the lowest training loss. Run regression suites that include general capabilities, not just the target task. Keep the previous adapter ready for instant rollback. Budget for refreshes: when the base model gets a new release, you may need to retrain, so automate the pipeline. Try it: keep a one-line rollback command in the runbook and rehearse it, so reverting an adapter takes seconds instead of a meeting."}], "quiz": [{"q": "LoRA adapts models by…", "choices": ["Learning low-rank update matrices", "Rewriting all tokenizer rules", "Changing GPU firmware", "Deleting the base weights"], "answer": 0, "why": "Low-rank adapters are the core idea."}, {"q": "Fine-tuning is a poor choice for…", "choices": ["Adjusting tone", "Teaching output format", "Distilling a skill into a smaller model", "Injecting frequently changing facts"], "answer": 3, "why": "RAG handles fresh facts better; tuning bakes in a snapshot."}, {"q": "DPO trains on…", "choices": ["Reward model logits only", "Unlabeled text only", "Images", "Pairs of chosen and rejected responses"], "answer": 3, "why": "It optimizes preferences directly without an RL loop."}], "conceptIds": ["lora"]}, {"id": "e-synth", "title": "Synthetic Data & Distillation", "why": "Teacher models can mint training fuel — carefully.", "explainer": "Distillation and synthetic data expand scarce labels. Risks: mirroring teacher blind spots, leaking eval contamination, and mode collapse. Prefer diverse generators, critique/filter pipelines, and human spot checks. On-policy data from your own agent traces often beats generic synthetic chat.\n\nCommon mistake: training on the same scraped web as the teacher without filters. Another: reporting gains only on synthetic tests.\n\nAlways hold out real user-like gold.", "resources": [{"title": "InstructGPT", "url": "https://arxiv.org/abs/2203.02155"}, {"title": "Hugging Face TRL docs", "url": "https://huggingface.co/docs/trl/index"}, {"title": "Direct Preference Optimization", "url": "https://arxiv.org/abs/2305.18290"}], "project": "Generate synthetic tool-call traces; filter with a critic; train a small student; eval on human gold.", "topics": [{"id": "e-synth-gen", "title": "Generation", "subtopics": [{"id": "e-synth-gen-s1", "title": "Teacher prompting"}, {"id": "e-synth-gen-s2", "title": "Diversity controls"}, {"id": "e-synth-gen-s3", "title": "Critique/filter loops"}, {"id": "e-synth-gen-s4", "title": "On-policy traces"}, {"id": "e-synth-gen-s5", "title": "Contamination checks"}], "explainer": "Synthetic data comes from prompting a strong teacher model to produce examples. Control diversity with varied seeds, personas and topics, or you get thousands of near-duplicates. Filter with critique loops, verifiers, or executable checks such as unit tests. On-policy traces from your own model capture its real mistakes. Check that synthetic items do not overlap your evaluation set, or scores become meaningless."}, {"id": "e-synth-dist", "title": "Distillation", "subtopics": [{"id": "e-synth-dist-s1", "title": "Logit / response distillation"}, {"id": "e-synth-dist-s2", "title": "Task-specific students"}, {"id": "e-synth-dist-s3", "title": "Size/latency targets"}, {"id": "e-synth-dist-s4", "title": "Failure inheritance"}, {"id": "e-synth-dist-s5", "title": "Refresh cadence"}], "explainer": "Distillation trains a smaller student to imitate a larger teacher. Logit distillation matches the teacher's full output distribution, which carries more signal than single answers; response distillation trains on teacher outputs only and works with API teachers. Task-specific students can be ten times cheaper with similar quality on that task. Students inherit teacher errors and biases. Plan a refresh cadence as teachers improve."}], "quiz": [{"q": "Synthetic data is safest when…", "choices": ["Filtered and validated against held-out human gold", "Used as the only test set", "Copied from the eval set", "Unlimited and unreviewed"], "answer": 0, "why": "Human gold keeps you honest."}, {"q": "Diversity controls in synthetic data generation prevent…", "choices": ["Fast generation", "Labeling", "Evaluation", "Thousands of near-duplicate examples"], "answer": 3, "why": "Varied seeds, personas and topics broaden coverage."}, {"q": "Logit distillation carries more signal than response distillation because…", "choices": ["It uses images", "It is cheaper", "It needs no teacher", "The student sees the teacher's full probability distribution"], "answer": 3, "why": "Soft targets show how the teacher ranks alternatives."}], "conceptIds": ["distillation"]}, {"id": "e-docrag", "title": "Multimodal and Document RAG: PDFs, Tables, Charts and Images", "why": "Enterprise answers hide in tables, charts and scanned pages; text-only RAG silently fails on them.", "explainer": "Document RAG extends retrieval to the parts of a document that are not running prose. There are two families of approaches.\n\nParse-then-embed: a layout-aware parser (Docling, Unstructured, Azure Document Intelligence, AWS Textract, LlamaParse) detects headings, tables, figures and reading order. Tables become Markdown or HTML with headers preserved; charts and images get VLM-generated descriptions (and ideally extracted data series); everything is chunked with page and bounding-box references and embedded as text.\n\nEmbed-the-page: visual document retrieval models such as ColPali/ColQwen embed page images directly into multi-vector representations and use late interaction (MaxSim) to match query tokens to image patches. No OCR pipeline, strong on charts and complex layouts, but indexes are larger and answers need a VLM that reads the retrieved page images.\n\nMany production systems are hybrid: text retrieval over parsed content plus visual retrieval over pages, fused and reranked, with a VLM generating the answer and citing page regions.\n\nCommon mistakes: flattening tables into word soup; ignoring figures; losing page references so answers cannot be cited; sending 40 full-resolution page images to a VLM per question.\n\nMental model: a PDF is a picture of information. Either turn the picture into faithful structure, or retrieve the picture itself.", "resources": [{"title": "ColPali paper (arXiv)", "url": "https://arxiv.org/abs/2407.01449"}, {"title": "Docling (IBM) document conversion", "url": "https://github.com/docling-project/docling"}, {"title": "Byaldi (ColPali made easy)", "url": "https://github.com/AnswerDotAI/byaldi"}, {"title": "Azure AI Document Intelligence", "url": "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview"}], "project": "Take 30 annual-report PDFs. Build (a) a parse-then-embed pipeline with Docling plus VLM chart captions and (b) a ColPali/ColQwen page index. Write 40 questions (15 about tables, 15 about charts, 10 prose) and compare recall@5 and answer accuracy per question type, plus index size and cost.", "topics": [{"id": "e-docrag-t1", "title": "Layout parsing and table/chart extraction", "explainer": "Layout models detect regions (title, paragraph, table, figure, caption) and reading order, which matters for multi-column pages. Table structure recognition recovers rows, columns and merged headers; serialize tables to Markdown or HTML and keep the header with every chunk of a long table. For charts, a VLM can produce a caption and often the underlying data series as JSON, which makes numbers searchable. Keep page numbers and bounding boxes so citations can highlight the exact region.", "subtopics": [{"id": "e-docrag-t1-s0", "title": "Parsers compared: Docling, Unstructured, LlamaParse, cloud document AI"}, {"id": "e-docrag-t1-s1", "title": "Region detection and reading order"}, {"id": "e-docrag-t1-s2", "title": "Table structure recognition"}, {"id": "e-docrag-t1-s3", "title": "Serializing tables with headers"}, {"id": "e-docrag-t1-s4", "title": "Chart-to-data with VLMs"}, {"id": "e-docrag-t1-s5", "title": "Page and bounding-box citations"}]}, {"id": "e-docrag-t2", "title": "Visual retrieval with ColPali-style models", "explainer": "ColPali feeds a page image through a vision-language model and keeps one embedding per image patch, about a thousand vectors per page. A query is embedded per token, and the score is the sum, over query tokens, of the best-matching patch (late interaction, MaxSim). This captures layout, fonts, charts and tables without OCR. The cost is storage and compute: multi-vector indexes are much larger than one-vector-per-chunk indexes, so use token pooling, binarization or a first-stage single-vector filter.", "subtopics": [{"id": "e-docrag-t2-s1", "title": "Patch embeddings and late interaction"}, {"id": "e-docrag-t2-s2", "title": "MaxSim scoring"}, {"id": "e-docrag-t2-s3", "title": "Index size and compression"}, {"id": "e-docrag-t2-s4", "title": "Two-stage retrieval"}, {"id": "e-docrag-t2-s5", "title": "When visual retrieval beats parsing"}]}, {"id": "e-docrag-t3", "title": "Multimodal embeddings, fusion and generation", "explainer": "Multimodal embedding models place images and text in one space so a text query can find a photo or diagram. Hybrid systems run text and visual retrieval in parallel, fuse with reciprocal rank fusion, and rerank. Generation uses a VLM that receives the top pages as images plus extracted text, with instructions to cite page and region. Evaluate by question type, because a system that is great on prose can still be poor on charts, and control image count and resolution to manage latency and cost.", "subtopics": [{"id": "e-docrag-t3-s1", "title": "Multimodal embedding models"}, {"id": "e-docrag-t3-s2", "title": "Reciprocal rank fusion"}, {"id": "e-docrag-t3-s3", "title": "VLM answer generation with citations"}, {"id": "e-docrag-t3-s4", "title": "Per-question-type evals"}, {"id": "e-docrag-t3-s5", "title": "Image resolution and token budgets"}]}], "quiz": [{"q": "What does ColPali embed?", "choices": ["Page images as multi-vector patch embeddings", "SQL tables", "Audio", "Only OCR text"], "answer": 0, "why": "It embeds page images directly with one vector per patch and scores with late interaction."}, {"q": "A long table is split across chunks and answers get columns wrong. Best fix?", "choices": ["Use smaller embeddings", "Raise temperature", "Remove the table", "Repeat the table header in every chunk of the table"], "answer": 3, "why": "Headers give each chunk the column meaning."}, {"q": "Main trade-off of multi-vector visual indexes?", "choices": ["Worse on charts", "Much larger storage and scoring cost", "Require OCR", "Cannot be searched"], "answer": 1, "why": "Hundreds to thousands of vectors per page increase index size; compress or use two stages."}], "conceptIds": ["docrag-pipeline"]}, {"id": "e-vision", "title": "Vision and Document AI: OCR vs VLM Extraction to Structured Data", "why": "Receipts, invoices, IDs and forms drive real workflows; agents need their data as validated JSON, not as a picture.", "explainer": "Document AI turns images and scans into structured records. Classic pipelines run OCR (Tesseract, PaddleOCR, cloud OCR) to get text with coordinates, then rules or a small model map text to fields. Specialized processors (AWS Textract AnalyzeExpense, Azure prebuilt receipt/invoice, Google Document AI) return typed fields with confidence scores.\n\nVision-language models (GPT-class, Claude, Gemini, Qwen-VL) can read an image and emit JSON directly against a schema using structured outputs. They handle messy layouts and handwriting better than rules, but can hallucinate a plausible total. The robust pattern combines them: VLM or processor extraction into a strict schema, then deterministic validation (line items sum to subtotal, subtotal plus tax equals total, dates parse, currency is known, vendor matches a known list), confidence thresholds, and a human review queue for failures.\n\nCommon mistakes: trusting a single extraction without arithmetic checks; storing floats for money; ignoring image quality (blur, rotation, glare); no ground-truth set to measure field accuracy.\n\nMental model: extraction is a guess; validation turns it into data.", "resources": [{"title": "AWS Textract AnalyzeExpense", "url": "https://docs.aws.amazon.com/textract/latest/dg/analyzing-document-expense.html"}, {"title": "PaddleOCR", "url": "https://github.com/PaddlePaddle/PaddleOCR"}, {"title": "OpenAI structured outputs", "url": "https://platform.openai.com/docs/guides/structured-outputs"}, {"title": "Google Document AI", "url": "https://cloud.google.com/document-ai/docs/overview"}], "project": "Build a receipt reader: photo in, validated JSON out (vendor, date, currency, line items, tax, total) logged to a SQLite expenses table. Compare a VLM with structured output against OCR + rules on 50 hand-labeled receipts; report per-field accuracy, validation catch rate and cost per receipt.", "topics": [{"id": "e-vision-t1", "title": "OCR pipelines and specialized processors", "explainer": "OCR detects text regions and recognizes characters, returning words with bounding boxes and confidence. Preprocessing (deskew, denoise, contrast, crop) matters as much as the engine for phone photos. Specialized cloud processors add document understanding on top: they know where totals and tax usually sit and return normalized fields. They are fast, cheap per page and give confidence scores, but only for supported document types and languages.", "subtopics": [{"id": "e-vision-t1-s1", "title": "Text detection and recognition"}, {"id": "e-vision-t1-s2", "title": "Image preprocessing"}, {"id": "e-vision-t1-s3", "title": "Word boxes and confidence"}, {"id": "e-vision-t1-s4", "title": "Prebuilt receipt and invoice processors"}, {"id": "e-vision-t1-s5", "title": "Language and layout coverage"}]}, {"id": "e-vision-t2", "title": "VLM extraction with structured outputs", "explainer": "Give the VLM the image, a JSON schema and field definitions, and use structured-output mode so the response always parses. Ask for null rather than guesses when a field is unreadable, and for the source text of each value to aid review. Downscale images to the smallest resolution that preserves legibility to control tokens. VLMs generalize to new layouts without templates, which makes them the fastest way to cover long-tail documents.", "subtopics": [{"id": "e-vision-t2-s1", "title": "Schema-constrained JSON"}, {"id": "e-vision-t2-s2", "title": "Null instead of guessing"}, {"id": "e-vision-t2-s3", "title": "Field-level evidence"}, {"id": "e-vision-t2-s4", "title": "Resolution and token cost"}, {"id": "e-vision-t2-s5", "title": "Long-tail document coverage"}]}, {"id": "e-vision-t3", "title": "Validation, confidence and human review", "explainer": "Validate every record deterministically: arithmetic (line items sum to subtotal, subtotal plus tax equals total), formats (dates, currency codes), ranges and reference data (known vendors, tax rates). Store money as integer cents or decimals, never floats. Route records that fail validation or have low confidence to a review queue, and feed corrections back into the eval set. Measure field-level accuracy and straight-through processing rate, the share of documents needing no human touch.", "subtopics": [{"id": "e-vision-t3-s1", "title": "Arithmetic and format checks"}, {"id": "e-vision-t3-s2", "title": "Decimal money handling"}, {"id": "e-vision-t3-s3", "title": "Confidence thresholds"}, {"id": "e-vision-t3-s4", "title": "Human review queues"}, {"id": "e-vision-t3-s5", "title": "Straight-through processing rate"}]}], "quiz": [{"q": "A VLM returns a receipt total that does not equal its line items plus tax. Which check catches this?", "choices": ["Higher temperature", "Spell check", "Subtotal + tax = total arithmetic validation", "Image resize"], "answer": 2, "why": "Deterministic arithmetic checks catch inconsistent extractions."}, {"q": "How should money be stored?", "choices": ["Integer cents or decimal type", "float", "String with $", "Embedding"], "answer": 0, "why": "Floats introduce rounding errors."}, {"q": "What does straight-through processing rate measure?", "choices": ["OCR font size", "Share of documents processed with no human review", "GPU speed", "Token count"], "answer": 1, "why": "It is the key automation metric for document AI."}], "conceptIds": ["docrag-pipeline"]}]}, {"id": "e-l4", "name": "L4 Expert", "subjects": [{"id": "e-multi", "title": "Multi-Model Routing & Ensembles", "why": "Route cheap to expensive; specialize by task.", "explainer": "Heuristic or learned routers, confidence/entropy signals, cascades, and verifiers reduce spend. Best-of-N and critique patterns trade cost for quality. Keep A/B assignment honest.\n\nCommon mistake: a router trained on demos that never sees production dialects. Another: cascades without a hard cost ceiling.\n\nMeasure dollars and quality together on the same slices.", "resources": [{"title": "LiteLLM", "url": "https://docs.litellm.ai/"}, {"title": "Stanford HELM", "url": "https://crfm.stanford.edu/helm/"}, {"title": "Judging LLM-as-a-Judge", "url": "https://arxiv.org/abs/2306.05685"}], "project": "Build a difficulty router: easy to small model, hard to frontier; report $ and quality.", "topics": [{"id": "e-multi-route", "title": "Routing", "subtopics": [{"id": "e-multi-route-s1", "title": "Heuristic vs learned"}, {"id": "e-multi-route-s2", "title": "Confidence / entropy"}, {"id": "e-multi-route-s3", "title": "Cascade and deferral"}, {"id": "e-multi-route-s4", "title": "A/B assignment"}, {"id": "e-multi-route-s5", "title": "Feature signals"}], "explainer": "Routing sends each request to the cheapest model likely to handle it. Heuristic routers use rules (length, keywords, user tier); learned routers predict difficulty from features. Confidence signals such as logprob entropy or a verifier score can trigger escalation. Cascades try a small model first and defer to a larger one when unsure. Run A/B assignment to measure the quality and cost effect of every routing change."}, {"id": "e-multi-ens", "title": "Ensembles", "subtopics": [{"id": "e-multi-ens-s1", "title": "Best-of-N"}, {"id": "e-multi-ens-s2", "title": "Verifier models"}, {"id": "e-multi-ens-s3", "title": "Debate / critique"}, {"id": "e-multi-ens-s4", "title": "Cost caps"}, {"id": "e-multi-ens-s5", "title": "Latency SLOs"}], "explainer": "Ensembles spend more compute for quality. Best-of-N samples several answers and picks the best with a scorer. Verifier models check answers, which works especially well when correctness is checkable (code, math). Debate and critique loops have models review each other. Cap cost per request and keep latency inside the SLO, because ensembles multiply both quickly. Try it: on 100 hard cases, compare single-shot accuracy with best-of-5 plus a verifier, and compute the cost per extra correct answer."}], "quiz": [{"q": "A cascade should…", "choices": ["Stop at the first model that meets a confidence policy", "Always call every model", "Ignore latency", "Disable logging"], "answer": 0, "why": "Early exit is the point."}, {"q": "A cascade router escalates to a larger model when…", "choices": ["Always", "The small model is uncertain or fails a check", "At night", "Never"], "answer": 1, "why": "Confidence signals or verifiers trigger deferral."}, {"q": "Best-of-N works best when…", "choices": ["A reliable scorer or verifier exists", "Outputs cannot be scored", "N=1", "Latency budget is tiny"], "answer": 0, "why": "Picking the best needs a way to recognize it."}], "conceptIds": ["llm-gateway-routing"]}, {"id": "e-datafly", "title": "Data Flywheels", "why": "Production traffic is training fuel if you instrument it.", "explainer": "Capture consenting, redacted traces; mine failures; queue active learning. Feed eval expansion, SFT, and preference pairs. Close the loop weekly.\n\nCommon mistake: storing everything forever without redaction. Another: never promoting production failures into the golden set.\n\nFlywheels need product and legal buy-in, not only ML enthusiasm.", "resources": [{"title": "Hugging Face TRL docs", "url": "https://huggingface.co/docs/trl/index"}, {"title": "OpenAI Evals", "url": "https://github.com/openai/evals"}, {"title": "Designing Machine Learning Systems", "url": "https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/"}], "project": "Thumbs and tool-success signals → weekly curated fine-tune and eval delta sets.", "topics": [{"id": "e-fly-cap", "title": "Capture", "subtopics": [{"id": "e-fly-cap-s1", "title": "Consent and redaction"}, {"id": "e-fly-cap-s2", "title": "Session traces"}, {"id": "e-fly-cap-s3", "title": "Failure mining"}, {"id": "e-fly-cap-s4", "title": "Active learning queues"}, {"id": "e-fly-cap-s5", "title": "Sampling bias"}], "explainer": "A data flywheel turns usage into improvement. Capture traces only with consent and redaction in place. Mine failures from explicit feedback, user edits, retries and escalations. Use active learning to queue the most informative examples for labeling. Watch sampling bias: users who give feedback are not representative, and you will over-fit to them if you are careless. Try it: list every signal your app already emits (edits, retries, copies, thumbs) and rank them by how strongly they indicate failure."}, {"id": "e-fly-use", "title": "Use", "subtopics": [{"id": "e-fly-use-s1", "title": "Eval expansion"}, {"id": "e-fly-use-s2", "title": "SFT / preference pairs"}, {"id": "e-fly-use-s3", "title": "Reward signals"}, {"id": "e-fly-use-s4", "title": "Prompt regressions"}, {"id": "e-fly-use-s5", "title": "Quality reports"}], "explainer": "Captured data feeds several loops: new eval cases, SFT examples, preference pairs from edited or rejected answers, reward signals for RL, and regression tests for prompts. Publish a regular quality report that shows how the flywheel moved key metrics. A flywheel that only collects data without changing the product is just storage cost. Try it: every week, turn the top five new failure clusters into eval cases before anyone changes a prompt. This keeps fixes honest."}], "quiz": [{"q": "A flywheel without redaction…", "choices": ["Creates privacy and compliance risk", "Speeds compliance", "Removes injection", "Fixes MoE load balance"], "answer": 0, "why": "Traces often contain secrets and PII."}, {"q": "User edits to a draft are valuable because they…", "choices": ["Remove the need for evals", "Speed up GPUs", "Cost nothing to store", "Provide natural preference pairs"], "answer": 3, "why": "Original vs edited is a chosen/rejected pair."}, {"q": "The main sampling risk in feedback data is…", "choices": ["Compression", "Too many tokens", "Feedback-givers are not representative", "JSON formatting"], "answer": 2, "why": "Bias toward vocal users skews training and evals."}], "conceptIds": []}, {"id": "e-edge", "title": "On-Device & Edge Apps", "why": "Local models change latency, privacy, and UX.", "explainer": "GGUF/llama.cpp, MLX, ExecuTorch, NPUs, and hybrid local+cloud patterns matter. Cold start, memory budgets, update channels, and honest privacy UX copy are product work.\n\nCommon mistake: promising fully offline while still shipping telemetry that needs network. Another: a 7B model that jetsams the OS on mid phones.\n\nBenchmark on target devices, not only your MacBook.", "resources": [{"title": "llama.cpp", "url": "https://github.com/ggml-org/llama.cpp"}, {"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}, {"title": "PyTorch tutorials", "url": "https://docs.pytorch.org/tutorials/"}], "project": "Local RAG demo with llama.cpp or similar; compare quality/latency to cloud on 20 queries.", "topics": [{"id": "e-edge-stack", "title": "Stack", "subtopics": [{"id": "e-edge-stack-s1", "title": "GGUF / quantized runtimes"}, {"id": "e-edge-stack-s2", "title": "NPU/GPU/CPU backends"}, {"id": "e-edge-stack-s3", "title": "Memory budgets"}, {"id": "e-edge-stack-s4", "title": "Hybrid local+cloud"}, {"id": "e-edge-stack-s5", "title": "Update channels"}], "explainer": "Edge apps run quantized models (GGUF via llama.cpp, MLX, ONNX Runtime, Core ML, or vendor NPU runtimes) on CPUs, GPUs or NPUs. Memory is the binding constraint: a 7B model at 4-bit is about 4 GB, before KV cache. Hybrid designs keep simple or private tasks local and send hard ones to the cloud. Plan model update channels with signatures and delta downloads, since models are large."}, {"id": "e-edge-ux", "title": "UX", "subtopics": [{"id": "e-edge-ux-s1", "title": "Cold start"}, {"id": "e-edge-ux-s2", "title": "Partial offline"}, {"id": "e-edge-ux-s3", "title": "Privacy copy"}, {"id": "e-edge-ux-s4", "title": "Degraded modes"}, {"id": "e-edge-ux-s5", "title": "Battery impact"}], "explainer": "On-device AI has UX costs. The first load of a model can take seconds. Offline mode should degrade gracefully rather than fail. Tell users plainly what stays on device and what goes to the cloud. Provide degraded modes on low battery or thermal throttling. Measure battery impact; a feature that drains the phone gets uninstalled. Try it: measure cold-start time and battery drain for ten minutes of use on a mid-range phone, not just a flagship."}], "quiz": [{"q": "Edge deployments most improve…", "choices": ["Privacy and latency for suitable workloads", "Unlimited frontier reasoning always", "Cluster NCCL bandwidth", "EU AI Act auto-certification"], "answer": 0, "why": "Fit the workload to the device."}, {"q": "A 7B model quantized to 4 bits needs roughly how much memory for weights?", "choices": ["0.5 GB", "14 GB", "28 GB", "3.5-4 GB"], "answer": 3, "why": "7B × 0.5 bytes ≈ 3.5 GB plus some overhead."}, {"q": "Hybrid edge designs typically…", "choices": ["Never update models", "Disable offline mode", "Send everything to the cloud", "Keep simple or private tasks local and escalate hard ones"], "answer": 3, "why": "They balance privacy, latency and capability."}], "conceptIds": []}, {"id": "e-llmops", "title": "AI Platform and LLMOps for Agents", "why": "Without a shared platform every team rebuilds gateways, prompt management, evals and tracing; the platform team makes the right way the easy way.", "explainer": "An AI Platform / LLMOps Engineer builds the paved road for agent teams: an LLM gateway (routing, keys, budgets, fallbacks, caching), registries for prompts, models, tools and agents, an eval service wired into CI/CD, tracing and cost attribution, guardrail services, secrets and identity integration, and templates that bootstrap a compliant agent in minutes.\n\nLLMOps differs from classic MLOps: most teams consume models rather than train them, so the versioned artifacts are prompts, tool definitions, retrieval configs and agent graphs, and the release process is driven by evals rather than training metrics. Releases should be declarative: a manifest pins model alias, prompt version, tool versions and policies, promoted through environments with canaries.\n\nCommon mistakes: platform built before any product needs it; mandating one framework for everything; no self-service, so the platform team becomes a ticket queue; prompts edited live in a UI with no versioning or review.\n\nMental model: the platform is a product whose customers are agent teams; measure it by their time-to-production and incident rate.", "resources": [{"title": "LiteLLM proxy docs", "url": "https://docs.litellm.ai/docs/simple_proxy"}, {"title": "MLflow GenAI docs", "url": "https://mlflow.org/docs/latest/genai/"}, {"title": "Backstage (developer portal)", "url": "https://backstage.io/docs/overview/what-is-backstage"}, {"title": "Google: Practitioners guide to MLOps", "url": "https://cloud.google.com/resources/mlops-whitepaper"}], "project": "Stand up a mini platform: LiteLLM gateway with per-team keys and budgets, a Git-based prompt and agent manifest registry, a CI pipeline that runs evals and blocks regressions, OpenTelemetry tracing with cost attribution, and a cookiecutter/Backstage template that creates a new compliant agent repo. Time how long a new agent takes to reach staging.", "topics": [{"id": "e-llmops-t1", "title": "Gateways and registries", "explainer": "The gateway centralizes model access: one API for many providers, per-team keys, budgets and rate limits, fallbacks, caching, logging and policy hooks. Registries track versioned artifacts: prompts with templates and variables, model aliases mapped to concrete versions, tool definitions and MCP servers, and agent manifests. Keep registries Git-backed or API-backed with review, so every production behavior traces to a reviewed version.", "subtopics": [{"id": "e-llmops-t1-s1", "title": "LLM gateway capabilities"}, {"id": "e-llmops-t1-s2", "title": "Model aliases and pinning"}, {"id": "e-llmops-t1-s3", "title": "Prompt registry and review"}, {"id": "e-llmops-t1-s4", "title": "Tool and MCP registry"}, {"id": "e-llmops-t1-s5", "title": "Agent manifests"}]}, {"id": "e-llmops-t2", "title": "CI/CD driven by evals", "explainer": "An agent release is a manifest change. CI runs unit tests, policy checks and the eval suite, comparing against the current production baseline with significance thresholds. CD promotes through environments, canaries a small traffic share with online evals and SLO monitoring, and rolls back automatically on regression. Store eval results with the release so audits and incident reviews can see exactly what was known at release time.", "subtopics": [{"id": "e-llmops-t2-s1", "title": "Manifest-based releases"}, {"id": "e-llmops-t2-s2", "title": "Eval gates with baselines"}, {"id": "e-llmops-t2-s3", "title": "Canary with online evals"}, {"id": "e-llmops-t2-s4", "title": "Automatic rollback"}, {"id": "e-llmops-t2-s5", "title": "Release evidence storage"}]}, {"id": "e-llmops-t3", "title": "Self-service and developer experience", "explainer": "Platform success is measured by adoption. Provide templates that generate a repo with tracing, evals, policy config and deployment already wired; a portal listing models, tools, data products and their docs; and clear golden paths for common patterns. Track time-to-first-staging, eval coverage and incident rates per team. Offer escape hatches for advanced teams while keeping security and cost controls mandatory.", "subtopics": [{"id": "e-llmops-t3-s1", "title": "Project templates"}, {"id": "e-llmops-t3-s2", "title": "Developer portal"}, {"id": "e-llmops-t3-s3", "title": "Golden paths"}, {"id": "e-llmops-t3-s4", "title": "Platform metrics"}, {"id": "e-llmops-t3-s5", "title": "Mandatory vs optional controls"}]}], "quiz": [{"q": "In LLMOps, what is typically the versioned release artifact?", "choices": ["A Jira ticket", "Only model weights", "A Docker tag only", "A manifest of model alias, prompt, tools and policies"], "answer": 3, "why": "Agent behavior depends on several versioned components pinned together."}, {"q": "What should gate promotion of an agent release?", "choices": ["Manager approval only", "Eval results versus baseline plus policy checks", "Time of day", "Lines of code"], "answer": 1, "why": "Evals are the release criteria for AI behavior."}, {"q": "How is a platform team best measured?", "choices": ["Agent teams' time-to-production and incident rates", "Number of frameworks", "Size of the team", "Number of tickets closed"], "answer": 0, "why": "Platform value shows in its customers' outcomes."}], "conceptIds": ["eval-pipeline", "agentops-loop", "model-router"]}, {"id": "e-voice", "title": "Real-Time Voice Agents: STT, TTS, Turn-Taking and Telephony", "why": "Voice is the most natural agent interface and the least forgiving: a second of silence feels broken.", "explainer": "A voice agent listens, decides and speaks in real time. Two architectures dominate.\n\nCascaded: streaming speech-to-text (Deepgram, AssemblyAI, Whisper variants) → LLM with tools → streaming text-to-speech (ElevenLabs, Cartesia, others). Each stage is swappable and inspectable, and you can use any LLM and tool stack.\n\nSpeech-to-speech: a single realtime model (OpenAI Realtime API, Gemini Live and similar) takes audio in and produces audio out, preserving tone and cutting latency, with less control over each stage.\n\nEither way the hard parts are conversational: voice activity detection (VAD) and turn detection decide when the user has finished; barge-in lets the user interrupt and must stop TTS instantly and truncate the agent's context to what was actually spoken; backchannels and fillers mask tool latency. Everything streams: partial transcripts, token streaming into TTS sentence by sentence, audio chunks over WebRTC or WebSockets.\n\nTelephony adds SIP trunks or providers like Twilio, 8 kHz audio, DTMF, call transfer to humans, and recording consent. Frameworks such as LiveKit Agents and Pipecat handle the plumbing.\n\nCommon mistakes: waiting for full LLM output before speaking; fixed silence timeouts that cut people off; no barge-in; tools that take 4 seconds with no filler.\n\nMental model: a voice agent is a latency budget with a personality.", "resources": [{"title": "LiveKit Agents docs", "url": "https://docs.livekit.io/agents/"}, {"title": "Pipecat (open-source voice agent framework)", "url": "https://github.com/pipecat-ai/pipecat"}, {"title": "OpenAI Realtime API guide", "url": "https://platform.openai.com/docs/guides/realtime"}, {"title": "Twilio Media Streams", "url": "https://www.twilio.com/docs/voice/media-streams"}], "project": "Build a phone receptionist for a local business (hours, booking, FAQs, transfer to a human) with LiveKit Agents or Pipecat and a Twilio number. Measure voice-to-voice latency p50/p95, barge-in stop time and task success on 20 scripted calls; compare cascaded vs speech-to-speech.", "topics": [{"id": "e-voice-t1", "title": "Cascaded vs speech-to-speech", "explainer": "Cascaded pipelines give control: best-in-class STT for accents, any LLM with tools and guardrails, a branded TTS voice, and text transcripts for evals and audits. The cost is latency stacking across three services. Speech-to-speech models collapse the pipeline, respond faster and carry prosody and emotion, but limit model choice and make text-level guardrails and logging harder. Many teams start cascaded for control, then move latency-critical flows to realtime models.", "subtopics": [{"id": "e-voice-t1-s1", "title": "Cascaded STT → LLM → TTS"}, {"id": "e-voice-t1-s2", "title": "Speech-to-speech realtime models"}, {"id": "e-voice-t1-s3", "title": "Control vs latency trade-off"}, {"id": "e-voice-t1-s4", "title": "Transcripts for evals and audit"}, {"id": "e-voice-t1-s5", "title": "Hybrid designs"}]}, {"id": "e-voice-t2", "title": "Turn-taking, VAD and barge-in", "explainer": "VAD classifies audio frames as speech or silence; turn detection decides whether a pause means the user is done, increasingly using small semantic models on the partial transcript instead of fixed silence timers. Barge-in: when the user starts speaking during agent speech, stop TTS within about 200 ms, cancel pending generation, and record only the words actually played into context so the agent does not believe it said things the user never heard. Echo cancellation prevents the agent hearing itself.", "subtopics": [{"id": "e-voice-t2-s1", "title": "Voice activity detection"}, {"id": "e-voice-t2-s2", "title": "Semantic end-of-turn detection"}, {"id": "e-voice-t2-s3", "title": "Barge-in and cancellation"}, {"id": "e-voice-t2-s4", "title": "Truncating context to spoken words"}, {"id": "e-voice-t2-s5", "title": "Echo cancellation"}]}, {"id": "e-voice-t3", "title": "Streaming, latency budget and telephony", "explainer": "Target roughly 800 ms or less from end of user speech to first agent audio. Budget each hop: end-of-turn detection, final transcript, LLM time to first token, first TTS audio, and network. Stream everything and start TTS on the first sentence. Mask slow tools with short fillers. For phone calls, connect via SIP trunk or Twilio Media Streams, handle 8 kHz mu-law audio, DTMF input, warm transfer to humans, recording disclosures and call-level analytics.", "subtopics": [{"id": "e-voice-t3-s1", "title": "Voice-to-voice latency budget"}, {"id": "e-voice-t3-s2", "title": "Sentence-level streaming to TTS"}, {"id": "e-voice-t3-s3", "title": "Fillers for tool latency"}, {"id": "e-voice-t3-s4", "title": "SIP, Twilio and 8 kHz audio"}, {"id": "e-voice-t3-s5", "title": "Transfers, DTMF and consent"}]}], "quiz": [{"q": "The user interrupts the agent mid-sentence. What must happen to the agent's context?", "choices": ["Keep the full planned reply", "Nothing", "Clear all history", "Truncate to the words actually spoken before the interruption"], "answer": 3, "why": "Otherwise the agent believes the user heard things they did not."}, {"q": "Biggest latency win in a cascaded pipeline?", "choices": ["Longer silence timeout", "Higher sample rate", "Bigger model", "Streaming LLM tokens into TTS sentence by sentence"], "answer": 3, "why": "Starting TTS on the first sentence avoids waiting for the full reply."}, {"q": "Why use semantic end-of-turn detection instead of a fixed silence timer?", "choices": ["It removes STT", "It avoids cutting off users who pause mid-thought while staying responsive", "It is cheaper", "Required by SIP"], "answer": 1, "why": "Pauses do not always mean the turn is over."}], "conceptIds": ["voice-latency"]}]}, {"id": "e-l5", "name": "L5 Frontier", "subjects": [{"id": "e-post", "title": "Post-Training Collaboration", "why": "Speak research-engineer when prompting is not enough.", "explainer": "Map SFT to preference to RL (RLHF/RLAIF, DPO, GRPO, env-based RL). Understand harness overfitting, reward hacking, and contamination. Know when to request a training run versus change the product.\n\nCommon mistake: asking for RL to fix a tool schema bug. Another: optimizing a proxy reward that the agent games.\n\nBring clean env definitions and evals to the training conversation.", "resources": [{"title": "InstructGPT", "url": "https://arxiv.org/abs/2203.02155"}, {"title": "Direct Preference Optimization", "url": "https://arxiv.org/abs/2305.18290"}, {"title": "DeepSeekMath / GRPO", "url": "https://arxiv.org/abs/2402.03300"}, {"title": "Hugging Face TRL docs", "url": "https://huggingface.co/docs/trl/index"}, {"title": "OpenEnv", "url": "https://github.com/meta-pytorch/openenv"}], "project": "Read a GRPO/DPO report; write a one-pager on product signals that would improve reward.", "topics": [{"id": "e-post-map", "title": "Methods Map", "subtopics": [{"id": "e-post-map-s1", "title": "SFT to preference to RL"}, {"id": "e-post-map-s2", "title": "RLHF / RLAIF"}, {"id": "e-post-map-s3", "title": "DPO / ORPO / KTO"}, {"id": "e-post-map-s4", "title": "GRPO and env RL"}, {"id": "e-post-map-s5", "title": "Distillation vs RL"}], "explainer": "Post-training turns a base model into an assistant. SFT teaches format and behavior from demonstrations. Preference learning, via RLHF with a reward model or RLAIF with AI feedback, teaches which answers people prefer. DPO, ORPO and KTO do preference learning directly from pairs without the RL loop. GRPO and environment-based RL reward verifiable success, such as passing tests. Distillation copies a stronger model's behavior, often cheaper than RL for narrow goals."}, {"id": "e-post-risk", "title": "Risks", "subtopics": [{"id": "e-post-risk-s1", "title": "Harness overfitting"}, {"id": "e-post-risk-s2", "title": "Reward hacking"}, {"id": "e-post-risk-s3", "title": "Entropy collapse"}, {"id": "e-post-risk-s4", "title": "Eval contamination"}, {"id": "e-post-risk-s5", "title": "When not to train"}], "explainer": "Training can make things worse. Models over-fit to the harness or eval used in training. Reward hacking finds loopholes, such as editing tests instead of fixing code. Entropy collapse makes outputs repetitive and kills exploration. Contaminated evals hide all of this. Often the right call is not to train at all and instead improve prompts, retrieval or tools. Try it: before approving a training run, write down which prompt, retrieval or tool change you tried first and why it was not enough."}, {"id": "e-post-x1", "title": "Post-training pipeline end to end", "explainer": "A typical post-training pipeline runs supervised fine-tuning on curated demonstrations, then preference optimization (DPO or RLHF with a reward model), then reinforcement learning with verifiable rewards for reasoning and tool use, often with GRPO. Each stage needs held-out evals for capability and safety regressions. Pretraining checkpoints set the ceiling; post-training shapes behavior. Track data provenance throughout, and compare every stage against the previous checkpoint and a prompting baseline.", "subtopics": [{"id": "e-post-x1-s1", "title": "SFT on demonstrations"}, {"id": "e-post-x1-s2", "title": "Preference optimization: DPO and RLHF"}, {"id": "e-post-x1-s3", "title": "RL with verifiable rewards"}, {"id": "e-post-x1-s4", "title": "Safety and capability regression evals"}, {"id": "e-post-x1-s5", "title": "Data provenance across stages"}]}], "quiz": [{"q": "Reward hacking means…", "choices": ["Optimizing the proxy without true task success", "A GPU ECC error", "Tokenizer fertility", "A 404 on docs"], "answer": 0, "why": "The agent games the metric."}, {"q": "GRPO-style RL is especially effective when…", "choices": ["Data is unlabeled images", "The model is frozen", "Rewards are verifiable, like passing tests", "No reward exists"], "answer": 2, "why": "Verifiable rewards give clean training signals."}, {"q": "Entropy collapse in RL shows up as…", "choices": ["Larger vocabularies", "Repetitive outputs and lost exploration", "More creative outputs", "Faster tokenization"], "answer": 1, "why": "The policy over-concentrates on a few behaviors."}], "conceptIds": ["rlhf-dpo-grpo", "distillation"]}, {"id": "e-multimodal-app", "title": "Multimodal Product Engineering", "why": "Images, PDFs, and audio change the application contract.", "explainer": "Document AI, screenshot agents, and voice wraps need parsers, size limits, malware scanning, and modality-specific evals. Do not send binaries to a VLM when text extraction suffices.\n\nCommon mistake: no max upload or MIME allowlist. Another: evaluating only on clean digital PDFs when users send photos of pages.\n\nDesign modality gates in the API, not only in the prompt.", "resources": [{"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}, {"title": "OWASP Top 10 for LLM Apps", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}, {"title": "Anthropic Building Effective Agents", "url": "https://www.anthropic.com/engineering/building-effective-agents"}], "project": "Build an upload path: MIME allowlist, size cap, text-first extraction, VLM fallback, eval set with photos.", "topics": [{"id": "e-mm-pipe", "title": "Pipelines", "subtopics": [{"id": "e-mm-pipe-s1", "title": "PDF/OCR first"}, {"id": "e-mm-pipe-s2", "title": "VLM fallback"}, {"id": "e-mm-pipe-s3", "title": "Audio STT"}, {"id": "e-mm-pipe-s4", "title": "Screenshot understanding"}, {"id": "e-mm-pipe-s5", "title": "Size and MIME gates"}], "explainer": "Multimodal pipelines should use the cheapest reliable path first: extract text from PDFs and run OCR, and send page images to a VLM only for charts, handwriting or layout-heavy pages. Speech goes through STT before an LLM unless latency demands a native audio model. Screenshots power UI understanding and computer-use agents. Gate inputs by size and MIME type to control cost and attack surface."}, {"id": "e-mm-eval", "title": "Eval and Safety", "subtopics": [{"id": "e-mm-eval-s1", "title": "Modality-specific gold"}, {"id": "e-mm-eval-s2", "title": "Adversarial images"}, {"id": "e-mm-eval-s3", "title": "Prompt injection in pixels"}, {"id": "e-mm-eval-s4", "title": "Malware scanning"}, {"id": "e-mm-eval-s5", "title": "Accessibility"}], "explainer": "Each modality needs its own gold data: scanned forms, charts, accents, noisy audio. Test adversarial images, including text hidden in pixels that tries to inject instructions. Scan uploaded files for malware before processing. Accessibility matters too: generated alt text and transcripts should be checked for accuracy, since users may rely on them. Try it: build 20 test images that contain hidden text instructions, and check whether your pipeline obeys any of them."}], "quiz": [{"q": "Prefer text extraction before VLM when…", "choices": ["Digital text PDFs are available and reliable", "Every input is a photo of a whiteboard", "You want maximum cost", "You lack an allowlist"], "answer": 0, "why": "Cheaper and often more accurate."}, {"q": "A cost-aware document pipeline usually starts with…", "choices": ["Audio transcription", "Sending every page as an image", "Manual typing", "Text extraction and OCR, with VLM fallback"], "answer": 3, "why": "Text paths are cheaper and often more accurate."}, {"q": "\"Prompt injection in pixels\" refers to…", "choices": ["Image compression", "Instructions hidden in images that a VLM may follow", "Low-resolution images", "Color profiles"], "answer": 1, "why": "Vision inputs are another untrusted channel."}], "conceptIds": ["docrag-pipeline", "voice-latency"]}, {"id": "e-rlenv", "title": "RL Environments, Reward Design and Prompt Optimization", "why": "Post-training for agents is now mostly environment and reward engineering; the quality of the environment decides what the model learns.", "explainer": "Reinforcement learning for LLM agents needs three things: an environment (tasks plus sandboxed tools such as code execution, a browser or a simulated company), a reward (verifiable checks like tests passing or a correct database state, or graders and reward models), and an RL algorithm (PPO, GRPO and variants) run by a framework such as verl, OpenRLHF or TRL with fast rollouts on vLLM.\n\nEnvironment design is the hard part: tasks must be diverse, realistic, solvable and verifiable, at the right difficulty for the current model. Reward hacking is the central failure: the policy finds ways to score without solving the task, such as editing tests, special-casing graders or exploiting simulator bugs. Defenses include hidden tests, multiple independent graders, monitoring trajectories and held-out evals.\n\nBefore spending GPUs on RL, prompt and program optimization can capture much of the gain: DSPy compiles prompts and few-shot examples against a metric, and GEPA evolves prompts using reflective feedback on trajectories. Model merging (for example with mergekit) combines fine-tuned checkpoints without further training.\n\nCommon mistakes: rewards that can be gamed; environments far easier than production; no held-out evaluation; training on contaminated benchmark data.\n\nMental model: the model optimizes exactly what you reward, in the world you built for it.", "resources": [{"title": "verl (Volcano Engine RL for LLMs)", "url": "https://github.com/volcengine/verl"}, {"title": "DeepSeekMath (GRPO) paper (arXiv)", "url": "https://arxiv.org/abs/2402.03300"}, {"title": "DSPy", "url": "https://dspy.ai/"}, {"title": "GEPA: Reflective prompt evolution (arXiv)", "url": "https://arxiv.org/abs/2507.19457"}, {"title": "mergekit", "url": "https://github.com/arcee-ai/mergekit"}], "project": "Build a sandboxed tool-use environment with 200 verifiable tasks. First optimize the prompt with DSPy or GEPA and record the gain. Then run GRPO on a small open model with verl or TRL, add one deliberate reward loophole, detect the reward hacking from trajectories, close it, and compare held-out results.", "topics": [{"id": "e-rlenv-t1", "title": "Environments and verifiable rewards", "explainer": "An RL environment for agents exposes a task, tools and a final check. Verifiable rewards come from deterministic checks: unit tests, exact answers, database end states, or a compiler. Gym-style interfaces (reset, step, reward) make environments reusable. Sandboxed execution in containers keeps rollouts safe and reproducible at scale. Tune difficulty so the model succeeds sometimes; tasks that are always solved or never solved give no learning signal under group-relative methods like GRPO.", "subtopics": [{"id": "e-rlenv-t1-s1", "title": "Gym-style reset/step/reward"}, {"id": "e-rlenv-t1-s2", "title": "Verifiable checks and graders"}, {"id": "e-rlenv-t1-s3", "title": "Sandboxed rollouts at scale"}, {"id": "e-rlenv-t1-s4", "title": "Difficulty calibration"}, {"id": "e-rlenv-t1-s5", "title": "Task diversity and realism"}]}, {"id": "e-rlenv-t2", "title": "Reward hacking and environment quality", "explainer": "Reward hacking happens when the policy maximizes the reward signal without achieving the intended goal, for example deleting failing tests, hard-coding expected outputs or exploiting a lenient judge. Detect it by sampling and reading trajectories, comparing reward with held-out evaluation, and watching for sudden reward jumps. Prevent it with hidden or regenerated tests, read-only graders, multiple reward sources, penalties for forbidden actions, and environment red-teaming before training starts.", "subtopics": [{"id": "e-rlenv-t2-s1", "title": "Common reward hacks"}, {"id": "e-rlenv-t2-s2", "title": "Trajectory auditing"}, {"id": "e-rlenv-t2-s3", "title": "Hidden tests and read-only graders"}, {"id": "e-rlenv-t2-s4", "title": "Reward vs held-out divergence"}, {"id": "e-rlenv-t2-s5", "title": "Environment red-teaming"}]}, {"id": "e-rlenv-t3", "title": "Prompt optimization, RL frameworks and merging", "explainer": "Prompt and program optimizers search over instructions and examples against your metric: DSPy compiles modular programs; GEPA uses reflection on failed trajectories to evolve prompts and often rivals RL at a fraction of the cost. When weights must change, frameworks such as verl, OpenRLHF and TRL orchestrate rollouts, reward computation and PPO or GRPO updates. Model merging averages or combines fine-tuned weights to blend skills cheaply; always re-evaluate merged models.", "subtopics": [{"id": "e-rlenv-t3-s1", "title": "DSPy optimizers"}, {"id": "e-rlenv-t3-s2", "title": "GEPA reflective evolution"}, {"id": "e-rlenv-t3-s3", "title": "verl, OpenRLHF, TRL"}, {"id": "e-rlenv-t3-s4", "title": "Rollout throughput with vLLM"}, {"id": "e-rlenv-t3-s5", "title": "Model merging with mergekit"}]}], "quiz": [{"q": "Why are tasks the model always solves useless for GRPO?", "choices": ["They are too long", "All samples get the same reward, so group-relative advantages are zero", "They use too many tokens", "They are not verifiable"], "answer": 1, "why": "GRPO learns from reward differences within a group; identical rewards give no signal."}, {"q": "Training reward rises sharply but held-out success is flat. Most likely?", "choices": ["Reward hacking", "Tokenizer bug", "Better learning", "GPU failure"], "answer": 0, "why": "Divergence between reward and held-out evals signals the policy is gaming the reward."}, {"q": "What should you try before spending GPUs on RL?", "choices": ["Bigger context", "Prompt/program optimization (DSPy, GEPA) against the same metric", "Nothing", "More temperature"], "answer": 1, "why": "Prompt optimization often captures much of the gain cheaply."}], "conceptIds": ["rlhf-dpo-grpo"]}, {"id": "e-genmedia", "title": "Image and Video Generation: Diffusion Models in Products", "why": "Generative media is part of many agent workflows (marketing, design, product content), and it brings its own cost, safety and IP questions.", "explainer": "Diffusion models generate images by learning to reverse a noising process: starting from random noise, a network repeatedly predicts and removes noise, guided by a text prompt. Latent diffusion (Stable Diffusion) runs this in a compressed latent space for speed; diffusion transformers (DiT) replaced the U-Net backbone in many recent models; flow matching is a closely related training objective. Video models extend this across time. Control methods (ControlNet, image-to-image, inpainting) and fine-tuning (LoRA, DreamBooth) shape outputs to a brand or subject.\n\nIn agentic products, an agent might write a brief, call an image or video generation API, check the output with a vision model, and iterate. Production concerns: cost per image or second of video, latency, content safety filters, provenance marking (C2PA, and EU AI Act Article 50 duties to mark synthetic content), likeness and IP rights, and human review for public assets.\n\nCommon mistakes: no safety filter on prompts and outputs; no record of model and prompt for provenance; ignoring licensing of training data and outputs.\n\nMental model: generation is cheap to try and expensive to trust; build the review loop first.", "resources": [{"title": "Denoising Diffusion Probabilistic Models (arXiv)", "url": "https://arxiv.org/abs/2006.11239"}, {"title": "Hugging Face Diffusers docs", "url": "https://huggingface.co/docs/diffusers/index"}, {"title": "C2PA content provenance", "url": "https://c2pa.org/"}, {"title": "Scalable Diffusion Models with Transformers (DiT, arXiv)", "url": "https://arxiv.org/abs/2212.09748"}], "project": "Build an agent that turns a product description into three ad images: it writes prompts, calls a diffusion model (local Diffusers or an API), checks each image with a VLM against a brand checklist, regenerates failures, and attaches C2PA provenance. Report cost per approved image and the rejection rate.", "topics": [{"id": "e-genmedia-t1", "title": "How diffusion models work", "explainer": "Training adds Gaussian noise to images over many steps and teaches a network to predict that noise given the noisy image, the step and a text embedding. Generation starts from pure noise and denoises step by step. Latent diffusion compresses images with an autoencoder so denoising runs on small latents. Classifier-free guidance strengthens prompt adherence by mixing conditional and unconditional predictions. Fewer sampling steps via better samplers or distillation cut latency at some quality cost.", "subtopics": [{"id": "e-genmedia-t1-s1", "title": "Forward noising and reverse denoising"}, {"id": "e-genmedia-t1-s2", "title": "Latent diffusion and autoencoders"}, {"id": "e-genmedia-t1-s3", "title": "U-Net vs diffusion transformers"}, {"id": "e-genmedia-t1-s4", "title": "Classifier-free guidance"}, {"id": "e-genmedia-t1-s5", "title": "Samplers and step distillation"}]}, {"id": "e-genmedia-t2", "title": "Control, customization and video", "explainer": "Image-to-image, inpainting and outpainting edit existing images. ControlNet and similar adapters condition on edges, poses or depth for layout control. LoRA and DreamBooth fine-tune a model on a few images of a product, style or person. Video diffusion models add temporal layers or operate on spatio-temporal latents, with cost scaling with resolution and duration. Agents can orchestrate these steps, but each one needs automated checks.", "subtopics": [{"id": "e-genmedia-t2-s1", "title": "Inpainting and outpainting"}, {"id": "e-genmedia-t2-s2", "title": "ControlNet conditioning"}, {"id": "e-genmedia-t2-s3", "title": "LoRA and DreamBooth customization"}, {"id": "e-genmedia-t2-s4", "title": "Video diffusion"}, {"id": "e-genmedia-t2-s5", "title": "Agent-orchestrated pipelines"}]}, {"id": "e-genmedia-t3", "title": "Safety, provenance and cost in production", "explainer": "Filter prompts and outputs for disallowed content, and block likeness of real people without consent. Mark outputs as AI-generated with C2PA manifests or watermarks, which supports EU AI Act Article 50 transparency obligations for synthetic content. Log the model, prompt, seed and reviewer for each published asset. Track cost per approved asset, not per generation, since rejected attempts add up. Clarify licensing and IP terms of the model and outputs before commercial use.", "subtopics": [{"id": "e-genmedia-t3-s1", "title": "Prompt and output safety filters"}, {"id": "e-genmedia-t3-s2", "title": "Likeness and consent"}, {"id": "e-genmedia-t3-s3", "title": "C2PA provenance and watermarking"}, {"id": "e-genmedia-t3-s4", "title": "Audit logging of generations"}, {"id": "e-genmedia-t3-s5", "title": "Cost per approved asset"}]}], "quiz": [{"q": "What does a diffusion model learn during training?", "choices": ["To rank documents", "To predict the noise added to an image at a given step", "To compress text", "To classify images"], "answer": 1, "why": "It learns to denoise; generation runs that in reverse from noise."}, {"q": "Why does latent diffusion run faster?", "choices": ["It generates text first", "It uses no GPU", "It skips the prompt", "Denoising happens in a compressed latent space"], "answer": 3, "why": "Smaller latents make each denoising step cheaper."}, {"q": "Which practice supports transparency duties for synthetic images?", "choices": ["Higher resolution", "Removing metadata", "C2PA provenance or watermark marking", "More sampling steps"], "answer": 2, "why": "Provenance marking identifies content as AI-generated."}], "conceptIds": []}]}]}, {"id": "inference", "name": "AI Inference Engineer", "icon": "bolt", "role": "Owns tokens/sec, latency SLOs, $/1M tokens. Day to day: engines, KV, batching, speculation, P/D disagg, CUDA profiles. Differs from Infra (clusters) and AI Engineer (apps).", "levels": [{"id": "i-l1", "name": "L1 Foundations", "subjects": [{"id": "i-life", "title": "Inference Request Lifecycle", "why": "Name stages: tokenize, prefill, decode, detokenize.", "explainer": "Prefill is compute-bound over the full prompt; decode is memory-bound while reading KV. TTFT, ITL/TBT, tokens/s, goodput, queue time, and KV utilization are the dashboard language. Streaming improves perceived latency. Chat templates and tool parsers sit on the critical path — moving render/derender off GPU nodes is an emerging pattern.\n\nCommon mistake: maximizing throughput while missing TTFT SLOs. Another: ignoring tokenizer CPU cost on huge batches.\n\nInstrument before you tune.", "resources": [{"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "PagedAttention / Efficient LLM Serving", "url": "https://arxiv.org/abs/2309.06180"}, {"title": "PagedAttention paper (HTML)", "url": "https://arxiv.org/html/2309.06180"}, {"title": "SGLang documentation", "url": "https://docs.sglang.io/"}], "project": "Local vLLM: log TTFT, ITL, tokens/s, KV utilization for 3 prompt lengths.", "topics": [{"id": "i-life-stages", "title": "Stages", "subtopics": [{"id": "i-life-stages-s1", "title": "Tokenize / chat template"}, {"id": "i-life-stages-s2", "title": "Prefill compute-bound"}, {"id": "i-life-stages-s3", "title": "Decode memory-bound"}, {"id": "i-life-stages-s4", "title": "Detokenize and tool parse"}, {"id": "i-life-stages-s5", "title": "Streaming vs buffered"}], "explainer": "An inference request passes through clear stages. The server applies the chat template and tokenizes. Prefill processes the whole prompt in parallel; it is compute-bound and sets time to first token. Decode generates one token per step for every sequence in the batch; it is memory-bandwidth-bound because each step re-reads all weights and the KV cache. Detokenization and tool-call parsing turn ids back into text and structure. Streaming returns tokens as they come; buffering waits for the full output."}, {"id": "i-life-metrics", "title": "Metrics", "subtopics": [{"id": "i-life-metrics-s1", "title": "TTFT / TBT / ITL"}, {"id": "i-life-metrics-s2", "title": "Tokens/s per GPU"}, {"id": "i-life-metrics-s3", "title": "Goodput vs throughput"}, {"id": "i-life-metrics-s4", "title": "KV hit rate"}, {"id": "i-life-metrics-s5", "title": "Queue time"}], "explainer": "TTFT (time to first token) measures prefill plus queueing. TBT or ITL (time between tokens) measures decode speed per user. Throughput is tokens per second per GPU across all users. Goodput counts only requests that met their SLOs, which is what actually matters. KV cache hit rate shows how much prefix reuse you get. Queue time reveals under-provisioning before latency explodes. Always report percentiles (p50, p95, p99), not averages."}], "quiz": [{"q": "Prefill is typically…", "choices": ["Compute-bound", "Only memory-bound", "Independent of prompt length", "Free"], "answer": 0, "why": "Full-prompt matmuls dominate."}, {"q": "Decode is usually limited by…", "choices": ["Network DNS", "Disk size", "CPU clock", "Memory bandwidth"], "answer": 3, "why": "Every step re-reads weights and KV for little compute."}, {"q": "Goodput counts…", "choices": ["Only requests that met their latency SLOs", "All tokens generated", "Failed requests", "GPU hours"], "answer": 0, "why": "Throughput that violates SLOs is not useful work."}], "conceptIds": ["prefill-decode"]}, {"id": "i-engines", "title": "Serving Engines Landscape", "why": "Pick engine for workload, not blog charts.", "explainer": "vLLM (PagedAttention, broad HW), SGLang (RadixAttention, structured out), TensorRT-LLM (NVIDIA peak), TGI, llama.cpp for edge. Features differ: prefix cache, speculation, LoRA multiplexing, multimodal.\n\nCommon mistake: TRT-LLM without NVIDIA specialization on the team. Another: ignoring observability maturity.\n\nBake off on YOUR ISL/OSL/concurrency.", "resources": [{"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "SGLang documentation", "url": "https://docs.sglang.io/"}, {"title": "SGLang GitHub", "url": "https://github.com/sgl-project/sglang"}, {"title": "TensorRT-LLM docs", "url": "https://nvidia.github.io/TensorRT-LLM/"}, {"title": "TensorRT-LLM GitHub", "url": "https://github.com/NVIDIA/TensorRT-LLM"}, {"title": "llama.cpp", "url": "https://github.com/ggml-org/llama.cpp"}], "project": "Same 7B on vLLM and llama.cpp; compare setup, throughput, features.", "topics": [{"id": "i-eng-open", "title": "Open Engines", "subtopics": [{"id": "i-eng-open-s1", "title": "vLLM"}, {"id": "i-eng-open-s2", "title": "SGLang"}, {"id": "i-eng-open-s3", "title": "TGI"}, {"id": "i-eng-open-s4", "title": "llama.cpp / Ollama"}, {"id": "i-eng-open-s5", "title": "Feature matrix"}], "explainer": "vLLM popularized PagedAttention and continuous batching and supports most models and hardware. SGLang adds RadixAttention for automatic prefix reuse and is strong for structured and agentic workloads. TGI is Hugging Face's server. llama.cpp and Ollama run quantized models on CPUs, Macs and small GPUs. Compare on features you need (quantization formats, speculative decoding, LoRA, structured output, disaggregation) and benchmark on your own traffic shape."}, {"id": "i-eng-nv", "title": "NVIDIA Stack", "subtopics": [{"id": "i-eng-nv-s1", "title": "TensorRT-LLM"}, {"id": "i-eng-nv-s2", "title": "Triton Inference Server"}, {"id": "i-eng-nv-s3", "title": "Dynamo / disagg pieces"}, {"id": "i-eng-nv-s4", "title": "NIM"}, {"id": "i-eng-nv-s5", "title": "Migration costs"}], "explainer": "TensorRT-LLM compiles models into optimized engines for NVIDIA GPUs, often the fastest option at the cost of build steps. Triton Inference Server hosts many model types behind one API. NVIDIA Dynamo orchestrates distributed and disaggregated serving with KV-aware routing. NIM packages models as ready-to-run containers. Migrating between stacks costs engineering time, so weigh peak speed against operability. Try it: serve the same model with vLLM and TensorRT-LLM on one GPU and compare tokens per second at concurrency 1, 16 and 64."}], "quiz": [{"q": "RadixAttention shines when…", "choices": ["Requests share prefixes", "All prompts unique and short", "CPU-only", "Caching disabled"], "answer": 0, "why": "Prefix reuse wins."}, {"q": "llama.cpp and Ollama are best known for…", "choices": ["Kubernetes scheduling", "Running quantized models on CPUs, Macs and small GPUs", "Vector search", "Multi-node training"], "answer": 1, "why": "They target local and edge inference."}, {"q": "TensorRT-LLM's main trade-off is…", "choices": ["Lower speed for simplicity", "Peak NVIDIA performance at the cost of build/compile steps", "No quantization", "CPU only"], "answer": 1, "why": "Compiled engines are fast but add pipeline work."}], "conceptIds": []}, {"id": "i-mem", "title": "GPU Memory Model for Inference", "why": "Weights + KV + activations must fit.", "explainer": "Sizing: parameters times bytes/param plus KV scaling with layers, heads, sequence, batch, precision. PagedAttention treats KV like virtual memory to fight fragmentation.\n\nCommon mistake: forgetting KV when estimating 70B fit. Another: huge max_model_len wasting reserved pages.\n\nBack-of-envelope before buying.", "resources": [{"title": "PagedAttention / Efficient LLM Serving", "url": "https://arxiv.org/abs/2309.06180"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}], "project": "Estimate KV bytes for 32B GQA at 8k ctx batch 16; compare to vLLM stats.", "topics": [{"id": "i-mem-fit", "title": "Fitting", "subtopics": [{"id": "i-mem-fit-s1", "title": "Weight footprint"}, {"id": "i-mem-fit-s2", "title": "KV scaling formula"}, {"id": "i-mem-fit-s3", "title": "Activation peaks"}, {"id": "i-mem-fit-s4", "title": "Fragmentation"}, {"id": "i-mem-fit-s5", "title": "Reservation vs utilization"}], "explainer": "GPU memory holds weights, KV cache and activations. Weights are parameters times bytes per parameter: 70B at FP16 is 140 GB. KV per token is 2 × layers × KV heads × head dim × bytes. Activation peaks happen in prefill of long prompts. Fragmentation wastes memory unless the engine pages it. Engines reserve a fraction of memory up front (for example gpu_memory_utilization 0.9), so nvidia-smi shows \"full\" even when idle."}, {"id": "i-mem-tech", "title": "Techniques", "subtopics": [{"id": "i-mem-tech-s1", "title": "PagedAttention blocks"}, {"id": "i-mem-tech-s2", "title": "KV quantization"}, {"id": "i-mem-tech-s3", "title": "CPU/NVMe offload"}, {"id": "i-mem-tech-s4", "title": "Prefix sharing"}, {"id": "i-mem-tech-s5", "title": "Max length policies"}], "explainer": "PagedAttention stores KV in fixed blocks like virtual memory pages, so there is almost no fragmentation and sequences can share prefix blocks. Quantizing KV to FP8 halves its size. Offloading cold KV to CPU memory or NVMe extends effective capacity at a latency cost. Prefix sharing lets requests with the same system prompt reuse KV. Capping max sequence length per tier is a simple and effective policy for protecting memory."}], "quiz": [{"q": "KV scales primarily with…", "choices": ["Seq length × batch × layers/heads", "CPU core count only", "Disk RPM", "TLS version"], "answer": 0, "why": "KV grows with context and concurrency."}, {"q": "Weights of a 70B model in FP16 take about…", "choices": ["140 GB", "35 GB", "280 GB", "70 GB"], "answer": 0, "why": "70B × 2 bytes = 140 GB."}, {"q": "nvidia-smi shows a vLLM GPU \"full\" at idle because…", "choices": ["Logging", "The driver is old", "The engine pre-reserves memory for KV cache", "A memory leak"], "answer": 2, "why": "gpu_memory_utilization reserves space up front."}], "conceptIds": ["kv-cache", "paged-attention"]}]}, {"id": "i-l2", "name": "L2 Practitioner", "subjects": [{"id": "i-batch", "title": "Batching, Scheduling & KV Cache", "why": "Continuous batching + paged KV = production.", "explainer": "Static batching waits for the slowest. Continuous/in-flight batching lets finished sequences leave. Chunked prefill reduces TTFT interference. Prefix caching and RadixAttention trees, eviction, quantized KV are levers.\n\nCommon mistake: maximizing batch until TBT dies. Another: disabling prefix cache on agent workloads.\n\nPlot throughput-latency Pareto curves.", "resources": [{"title": "PagedAttention / Efficient LLM Serving", "url": "https://arxiv.org/abs/2309.06180"}, {"title": "Orca continuous batching (USENIX OSDI)", "url": "https://www.usenix.org/conference/osdi22/presentation/yu"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "SGLang documentation", "url": "https://docs.sglang.io/"}], "project": "Saturate GPU; ablate max_num_seqs and max_model_len; plot throughput vs latency.", "topics": [{"id": "i-batch-types", "title": "Batching", "subtopics": [{"id": "i-batch-types-s1", "title": "Static vs continuous"}, {"id": "i-batch-types-s2", "title": "Chunked prefill"}, {"id": "i-batch-types-s3", "title": "Preemption and priorities"}, {"id": "i-batch-types-s4", "title": "Fairness"}, {"id": "i-batch-types-s5", "title": "Scheduler knobs"}], "explainer": "Static batching waits for a full batch and holds GPUs until the longest sequence finishes. Continuous batching adds and removes sequences every step, keeping the GPU busy. Chunked prefill splits long prompts into pieces mixed with decode steps so a big prompt does not freeze everyone's token stream. Schedulers can preempt low-priority requests and enforce fairness between tenants. Knobs such as max batched tokens and max sequences trade latency against throughput."}, {"id": "i-kv", "title": "KV Cache", "subtopics": [{"id": "i-kv-s1", "title": "Paged blocks"}, {"id": "i-kv-s2", "title": "Prefix caching"}, {"id": "i-kv-s3", "title": "RadixAttention"}, {"id": "i-kv-s4", "title": "Eviction"}, {"id": "i-kv-s5", "title": "KV FP8/INT8"}], "explainer": "The KV cache stores keys and values for past tokens so decode does not recompute them. Paged blocks manage it efficiently. Prefix caching reuses KV for identical prompt prefixes across requests; RadixAttention organizes cached prefixes as a tree for automatic matching. When memory fills, the engine evicts least-recently-used blocks or preempts sequences. FP8 or INT8 KV roughly doubles capacity with small quality cost on most models."}], "quiz": [{"q": "Continuous batching helps because…", "choices": ["Finished leave and new join without waiting for whole batch", "Trains faster", "Deletes tokenizer", "Removes attention"], "answer": 0, "why": "In-flight membership raises utilization."}, {"q": "Chunked prefill prevents…", "choices": ["Tokenization", "Long prompts from stalling other users' token streams", "Quantization", "Prefix caching"], "answer": 1, "why": "Splitting prefill lets decode steps interleave."}, {"q": "Prefix caching benefits most when…", "choices": ["Batch size is 1", "Every prompt is unique", "Many requests share a long system prompt or document", "Outputs are long"], "answer": 2, "why": "Shared prefixes reuse KV blocks."}], "conceptIds": ["batching", "paged-attention"]}, {"id": "i-quant", "title": "Quantization for Serving", "why": "Bits → memory → batch → money.", "explainer": "Weight quant (INT8/4, GPTQ, AWQ, GGUF), FP8, activation smoothing, KV quant trade quality for capacity. Calibration sets matter. Know when quality collapses on YOUR eval.\n\nCommon mistake: INT4 on safety classifiers. Another: English-only quality checks.\n\nA/B on task gold.", "resources": [{"title": "GPTQ", "url": "https://arxiv.org/abs/2210.17323"}, {"title": "AWQ", "url": "https://arxiv.org/abs/2306.00978"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "llama.cpp", "url": "https://github.com/ggml-org/llama.cpp"}], "project": "Serve large model AWQ/FP8; compare quality on 50 prompts vs higher precision.", "topics": [{"id": "i-quant-w", "title": "Weight Quant", "subtopics": [{"id": "i-quant-w-s1", "title": "INT8/4 GPTQ/AWQ/GGUF"}, {"id": "i-quant-w-s2", "title": "FP8"}, {"id": "i-quant-w-s3", "title": "Calibration"}, {"id": "i-quant-w-s4", "title": "Accuracy recovery"}, {"id": "i-quant-w-s5", "title": "Per-channel issues"}], "explainer": "Weight quantization stores weights in fewer bits. GPTQ and AWQ produce INT4 weights with small accuracy loss using a calibration set; GGUF is llama.cpp's format with many variants. FP8 on Hopper and newer GPUs keeps quality very close to BF16 with hardware support. Calibrate on data like your traffic. Per-channel or group scales handle outlier columns. Always re-run your evals after quantizing, because averages can hide broken edge cases."}, {"id": "i-quant-kv", "title": "Activations & KV", "subtopics": [{"id": "i-quant-kv-s1", "title": "SmoothQuant ideas"}, {"id": "i-quant-kv-s2", "title": "KV FP8"}, {"id": "i-quant-kv-s3", "title": "Outliers"}, {"id": "i-quant-kv-s4", "title": "Collapse symptoms"}, {"id": "i-quant-kv-s5", "title": "Mixed schemes"}], "explainer": "Activations and KV are harder to quantize than weights because of outliers, a few huge values in certain channels. SmoothQuant shifts that difficulty from activations into weights. KV FP8 is widely supported and usually safe. Symptoms of quantization collapse include repetition, broken formatting and wrong math. Mixed schemes keep sensitive layers in higher precision while quantizing the rest. Try it: enable FP8 KV cache, rerun your eval, and compare both quality and the maximum concurrent sequences the engine reports."}], "quiz": [{"q": "Main serving win from quant is usually…", "choices": ["Higher effective batch from lower memory", "Perfect accuracy always", "No evals needed", "Free networking"], "answer": 0, "why": "Memory→batch→throughput/$."}, {"q": "FP8 serving requires…", "choices": ["No calibration ever", "Any GPU", "CPUs only", "Hardware support such as Hopper or newer"], "answer": 3, "why": "Native FP8 Tensor Core support makes it fast."}, {"q": "After quantizing a model you must…", "choices": ["Disable batching", "Re-run your evals", "Retrain from scratch", "Delete the original"], "answer": 1, "why": "Averages can hide broken edge cases."}], "conceptIds": ["quantization"]}, {"id": "i-spec", "title": "Speculative Decoding", "why": "Memory-bound decode; speculation helps at small batch.", "explainer": "Draft models, EAGLE/Medusa, n-gram, MTP, tree verification raise tokens per expensive forward when acceptance is high. Gains shrink at high batch. Measure acceptance by position.\n\nCommon mistake: expecting miracles on saturated high-batch servers. Another: ignoring draft quality drift.\n\nBenchmark batch 1/8/32.", "resources": [{"title": "Speculative Decoding (Leviathan et al.)", "url": "https://arxiv.org/abs/2211.17192"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "SGLang documentation", "url": "https://docs.sglang.io/"}], "project": "Enable EAGLE or draft speculation; measure speedup at batch 1/8/32.", "topics": [{"id": "i-spec-m", "title": "Methods", "subtopics": [{"id": "i-spec-m-s1", "title": "Draft model"}, {"id": "i-spec-m-s2", "title": "EAGLE / Medusa"}, {"id": "i-spec-m-s3", "title": "N-gram lookup"}, {"id": "i-spec-m-s4", "title": "MTP"}, {"id": "i-spec-m-s5", "title": "Tree verification"}], "explainer": "Speculative decoding guesses several tokens cheaply and verifies them in one pass of the big model. A small draft model can propose tokens. EAGLE and Medusa add lightweight heads to the target model. N-gram lookup copies spans from the prompt, great for editing and RAG. Multi-token prediction (MTP) trains the model to predict ahead. Tree verification checks several candidate branches at once. Output distribution stays the same as the target model when done correctly."}, {"id": "i-spec-lim", "title": "Limits", "subtopics": [{"id": "i-spec-lim-s1", "title": "Acceptance drivers"}, {"id": "i-spec-lim-s2", "title": "Batch collapse"}, {"id": "i-spec-lim-s3", "title": "Verifier cost"}, {"id": "i-spec-lim-s4", "title": "Quality parity"}, {"id": "i-spec-lim-s5", "title": "Tuning"}], "explainer": "Speedup depends on acceptance rate: how often the target agrees with the draft. Predictable text (code, templated output) accepts well; creative text less so. At large batch sizes the GPU is already busy, so verification overhead can erase the gain. The draft model costs memory and compute too. Benchmark at your real concurrency and tune the number of speculated tokens."}], "quiz": [{"q": "Speculation helps most when…", "choices": ["Small/medium batch and high acceptance", "Huge compute-saturated batch", "Target model disabled", "CPU only"], "answer": 0, "why": "Memory-bound decode + accepts = wins."}, {"q": "Speculative decoding preserves output quality because…", "choices": ["It uses higher temperature", "The target model verifies every accepted token", "It shortens outputs", "It skips verification"], "answer": 1, "why": "Rejection sampling keeps the target distribution."}, {"q": "N-gram lookup speculation works especially well for…", "choices": ["Editing and RAG where outputs copy prompt spans", "Creative poetry", "Training", "Image generation"], "answer": 0, "why": "Copied spans are easy to predict from the prompt."}], "conceptIds": ["speculative"]}, {"id": "i-struct", "title": "Structured Output & Constrained Decode", "why": "JSON mode has perf tradeoffs.", "explainer": "FSM/grammar masking, tool-call parsers, token healing keep outputs valid. Grammar compile cost and cache interactions matter.\n\nCommon mistake: regex on unconstrained dumps. Another: recompiling grammars per request.\n\nValidity rate is an SLO.", "resources": [{"title": "SGLang documentation", "url": "https://docs.sglang.io/"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "OpenAI prompt engineering", "url": "https://developers.openai.com/api/docs/guides/prompt-engineering"}], "project": "Benchmark unconstrained vs grammar JSON; measure tokens/s and validity.", "topics": [{"id": "i-struct-tech", "title": "Techniques", "subtopics": [{"id": "i-struct-tech-s1", "title": "FSM / grammar masking"}, {"id": "i-struct-tech-s2", "title": "Token healing"}, {"id": "i-struct-tech-s3", "title": "Partial JSON repair"}, {"id": "i-struct-tech-s4", "title": "Tool-call parsers"}, {"id": "i-struct-tech-s5", "title": "Schema versioning"}], "explainer": "Constrained decoding compiles a JSON schema or grammar into a state machine and masks invalid tokens at each step, so output always parses. Token healing fixes boundary issues where the prompt ends mid-token. Partial JSON repair helps clients that parse streams. Tool-call parsers extract function calls from model-specific formats. Version schemas, since changing a schema can change model behavior. Try it: generate 1,000 outputs with and without schema constraints and count parse failures. The difference is usually dramatic."}, {"id": "i-struct-ops", "title": "Ops", "subtopics": [{"id": "i-struct-ops-s1", "title": "Compile cost"}, {"id": "i-struct-ops-s2", "title": "Cache interactions"}, {"id": "i-struct-ops-s3", "title": "Failure modes"}, {"i
