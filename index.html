ogs and indexes, eval runs, and human review time, which can exceed model spend. The useful metric is cost per successful task, not cost per call."}, {"id": "a-cost-ctrl", "title": "Controls", "subtopics": [{"id": "a-cost-ctrl-s1", "title": "Per-tenant budgets"}, {"id": "a-cost-ctrl-s2", "title": "Model routing tiers"}, {"id": "a-cost-ctrl-s3", "title": "Batch vs realtime"}, {"id": "a-cost-ctrl-s4", "title": "Chargeback / showback"}, {"id": "a-cost-ctrl-s5", "title": "Anomaly alerts"}], "explainer": "Cost control is mostly architecture. Set per-tenant and per-feature budgets enforced at the gateway. Route easy queries to small models and escalate only when needed. Move anything that is not interactive to batch APIs, often half price. Show teams their spend (showback) or charge it back so incentives line up. Alert on anomalies such as a sudden jump in tokens per request, which usually means a prompt bug, a loop, or abuse."}], "quiz": [{"q": "Prefix caching helps most when…", "choices": ["Many requests share a long stable prompt prefix", "Every prompt is unique", "You only use CPU", "You disable TLS"], "answer": 0, "why": "Shared prefixes make KV reuse pay off."}, {"q": "1,000 input tokens at $3/M plus 500 output tokens at $15/M costs…", "choices": ["$0.018", "$1.05", "$0.0105", "$0.105"], "answer": 2, "why": "0.001M×$3 = $0.003; 0.0005M×$15 = $0.0075; total $0.0105."}, {"q": "The best unit metric for AI cost is usually…", "choices": ["Total monthly bill", "Cost per successful task", "GPU count", "Cost per API call"], "answer": 1, "why": "Failed or retried tasks hide in per-call numbers."}], "conceptIds": ["cost-model", "cost-per-token"]}, {"id": "a-privacy", "title": "Privacy, PII & Data Minimization", "why": "Privacy failures end deals and careers.", "explainer": "Minimize what enters prompts and logs. Redact PII before tracing vendors. Prefer retrieval filters and field-level encryption over stuffing whole records. Understand training-use opt-outs on APIs versus self-host. Retention and right-to-be-forgotten must include vector indexes.\n\nCommon mistake: pasting production rows into a consumer ChatGPT account during debugging. Another: indefinite retention of session transcripts 'for quality.'\n\nPrivacy is an architecture constraint equal to latency.", "resources": [{"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}, {"title": "EU AI Act", "url": "https://artificialintelligenceact.eu/"}, {"title": "OWASP Top 10 for LLM Apps", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}], "project": "Design a PII redaction path for prompts, tools, logs, and embeddings with deletion workflow.", "topics": [{"id": "a-priv-min", "title": "Minimization", "subtopics": [{"id": "a-priv-min-s1", "title": "Prompt data minimization"}, {"id": "a-priv-min-s2", "title": "Log redaction"}, {"id": "a-priv-min-s3", "title": "Field-level controls"}, {"id": "a-priv-min-s4", "title": "Vendor DPA review"}, {"id": "a-priv-min-s5", "title": "Training-use opt-out"}], "explainer": "The cheapest data to protect is data you never send. Strip or mask identifiers before prompts leave your boundary. Redact logs and traces by default. Apply field-level controls so the model sees only fields needed for the task. Review vendor data processing agreements for retention, training use and subprocessors, and turn off training-on-your-data where offered. Minimization reduces breach impact, regulatory scope and vendor risk all at once."}, {"id": "a-priv-ops", "title": "Operations", "subtopics": [{"id": "a-priv-ops-s1", "title": "Retention schedules"}, {"id": "a-priv-ops-s2", "title": "Index purge on delete"}, {"id": "a-priv-ops-s3", "title": "Access reviews"}, {"id": "a-priv-ops-s4", "title": "Breach playbooks"}, {"id": "a-priv-ops-s5", "title": "Regional processing"}], "explainer": "Privacy is an ongoing operation. Set retention schedules for prompts, outputs and traces. When a user or document is deleted, purge it from indexes, caches and memories too. Review who can read raw logs and traces. Have a breach playbook that covers AI-specific leaks such as a model repeating another user's data. Respect data residency by pinning processing regions, including for embeddings and evals, not just the main model call."}], "quiz": [{"q": "Right-to-be-forgotten for RAG requires…", "choices": ["Purging derived chunks/embeddings, not only the source row", "Deleting the foundation model", "Turning off GPUs", "Clearing browser cookies only"], "answer": 0, "why": "Derived artifacts retain personal data."}, {"q": "Data minimization reduces…", "choices": ["Only latency", "Model accuracy always", "GPU heat", "Breach impact, regulatory scope and vendor risk"], "answer": 3, "why": "Data never sent cannot leak."}, {"q": "Residency compliance must include…", "choices": ["Only the UI", "Embeddings, logs and evals as well", "Only backups", "Only the main model call"], "answer": 1, "why": "Any processing step can move data out of region."}], "conceptIds": []}, {"id": "a-solarch", "title": "AI Solutions Architecture: Sizing, Proposals and Build-vs-Buy", "why": "Solutions architects win and shape AI deals; credibility comes from realistic architectures, honest sizing and clear risk trade-offs.", "explainer": "An AI Solutions Architect (pre-sales or delivery) translates a customer's goals into an agentic architecture, estimates cost and effort, and de-risks the decision. The work spans requirements and non-functional requirements, reference architectures (gateway, RAG, agents, data products, evals, guardrails, observability), platform choices (managed agent platforms vs frameworks vs custom), sizing (tokens per task × tasks per month × price; or GPUs for self-hosting), and a phased roadmap.\n\nStrong architects make trade-offs explicit: managed APIs vs open-weight models for data residency; build vs buy for evals and observability; how much autonomy is acceptable at each phase. They write proposals that state assumptions, risks and success criteria, and they run proofs of value with eval-based exit criteria instead of vibes.\n\nCommon mistakes: costing only model tokens and forgetting retrieval, data engineering, evals and people; promising autonomy that the customer's risk appetite will not accept; vendor-locked designs with no exit path.\n\nMental model: a proposal is a hypothesis with a budget. Make the hypothesis testable.", "resources": [{"title": "AWS Well-Architected Generative AI Lens", "url": "https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html"}, {"title": "Azure AI architecture center", "url": "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/"}, {"title": "Google Cloud architecture: generative AI", "url": "https://cloud.google.com/architecture/ai-ml"}], "project": "For a mock RFP (e.g. insurer claims intake), produce a solution proposal: requirements and NFRs, reference architecture diagram, build-vs-buy table, monthly cost model at three volumes, phased roadmap with autonomy levels, risks and a proof-of-value plan with eval exit criteria.", "topics": [{"id": "a-solarch-t1", "title": "Requirements and reference architecture", "explainer": "Capture functional goals and non-functional requirements early: latency, availability, data residency, privacy, auditability, languages, integration points and scale. Map them onto a reference architecture: channels, gateway, orchestration and agents, tools and MCP servers, data products and retrieval, eval and observability, policy and identity. Show where human oversight sits. Keep the diagram vendor-neutral first, then map components to the customer's cloud and existing tools.", "subtopics": [{"id": "a-solarch-t1-s1", "title": "Functional and non-functional requirements"}, {"id": "a-solarch-t1-s2", "title": "Vendor-neutral reference architecture"}, {"id": "a-solarch-t1-s3", "title": "Human oversight placement"}, {"id": "a-solarch-t1-s4", "title": "Mapping to customer cloud"}, {"id": "a-solarch-t1-s5", "title": "Architecture decision records"}]}, {"id": "a-solarch-t2", "title": "Sizing and cost modeling", "explainer": "Estimate tokens per task by stage (input context, outputs, tool loops), multiply by task volume and price per million tokens, and add retrieval, storage, data pipelines, observability, evals and human review. Compare managed APIs with self-hosted models at several volumes, because the crossover point drives architecture. Model people cost too: FDE time, operations and governance. Present ranges with assumptions, and the cost per business outcome such as cost per claim handled.", "subtopics": [{"id": "a-solarch-t2-s1", "title": "Tokens per task by stage"}, {"id": "a-solarch-t2-s2", "title": "Volume scenarios"}, {"id": "a-solarch-t2-s3", "title": "API vs self-hosted crossover"}, {"id": "a-solarch-t2-s4", "title": "Non-model costs"}, {"id": "a-solarch-t2-s5", "title": "Cost per business outcome"}]}, {"id": "a-solarch-t3", "title": "Proposals and proofs of value", "explainer": "A good proposal states the problem, success criteria, architecture, phases, assumptions, risks, costs and what the customer must provide (data access, SMEs, approvals). A proof of value runs on the customer's data with a pre-agreed eval set and thresholds, timeboxed to weeks, with a go/no-go decision at the end. Include an exit path for vendor lock-in and a governance section that addresses their compliance needs.", "subtopics": [{"id": "a-solarch-t3-s1", "title": "Proposal structure"}, {"id": "a-solarch-t3-s2", "title": "Customer dependencies"}, {"id": "a-solarch-t3-s3", "title": "Proof-of-value design"}, {"id": "a-solarch-t3-s4", "title": "Eval-based exit criteria"}, {"id": "a-solarch-t3-s5", "title": "Lock-in and exit strategy"}]}], "quiz": [{"q": "Which cost is most often forgotten in AI proposals?", "choices": ["Model tokens", "Data engineering, evals, operations and human review", "GPU names", "Domain names"], "answer": 1, "why": "Non-model costs often exceed token costs."}, {"q": "What makes a proof of value decisive?", "choices": ["Pre-agreed eval set and thresholds on customer data", "A larger model", "A nice demo", "More slides"], "answer": 0, "why": "Agreed measurable criteria enable a real go/no-go."}, {"q": "Why compare APIs vs self-hosting at several volumes?", "choices": ["For fun", "The cost crossover point changes the right architecture", "APIs are always cheaper", "Self-hosting is always cheaper"], "answer": 1, "why": "Economics change with scale."}], "conceptIds": ["fde-lifecycle", "agent-data-arch"]}]}, {"id": "a-l4", "name": "L4 Expert", "subjects": [{"id": "a-scale", "title": "Multi-Region, Multi-Tenant, HA", "why": "Production AI must survive AZ loss and noisy neighbors.", "explainer": "Tenancy isolation (keys, quotas, data partitions) prevents noisy-neighbor and leak disasters. HA needs RPO/RTO for model artifacts and indexes, traffic shifting, and degraded modes. Prefix-cache affinity can conflict with naive load balancing — design sticky or replicated caches deliberately.\n\nCommon mistake: active-active without index consistency story. Another: one GPU pool for all tenants with no fair-share.\n\nRunbooks beat diagrams when pages fire at 3am.", "resources": [{"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}, {"title": "Azure AI architecture", "url": "https://learn.microsoft.com/en-us/azure/architecture/ai-ml/"}, {"title": "K8s scheduling", "url": "https://kubernetes.io/docs/concepts/scheduling-eviction/"}], "project": "Design active-active inference across two regions with failover runbook and degraded mode.", "topics": [{"id": "a-scale-ten", "title": "Tenancy", "subtopics": [{"id": "a-scale-ten-s1", "title": "Noisy-neighbor isolation"}, {"id": "a-scale-ten-s2", "title": "Per-tenant keys and quotas"}, {"id": "a-scale-ten-s3", "title": "Data partitioning"}, {"id": "a-scale-ten-s4", "title": "Fairness in queues"}, {"id": "a-scale-ten-s5", "title": "Cross-tenant cache risk"}], "explainer": "Multi-tenant AI systems need isolation in places classic SaaS does not. One heavy tenant can saturate shared GPUs, so use quotas, fair queuing and priority classes. Give each tenant its own keys, budgets and rate limits. Partition data so retrieval filters by tenant at the index level, not in the prompt. Watch for cross-tenant leakage through shared semantic caches, shared memories or fine-tunes trained on mixed data."}, {"id": "a-scale-ha", "title": "HA/DR", "subtopics": [{"id": "a-scale-ha-s1", "title": "RPO/RTO for model and index"}, {"id": "a-scale-ha-s2", "title": "Artifact replication"}, {"id": "a-scale-ha-s3", "title": "Traffic shifting"}, {"id": "a-scale-ha-s4", "title": "Degraded modes"}, {"id": "a-scale-ha-s5", "title": "Game days"}], "explainer": "Set RPO and RTO for every stateful part: model artifacts, vector indexes, prompt registries, conversation state. Replicate artifacts across regions ahead of time, since pulling 100+ GB of weights during an outage is slow. Use the gateway to shift traffic between regions and providers. Define degraded modes and practice failover in game days. A secondary provider with a different model also needs prompt and eval compatibility, or failover will quietly drop quality."}], "quiz": [{"q": "Sticky routing is sometimes needed to…", "choices": ["Preserve KV/prefix cache locality", "Avoid TLS", "Skip auth", "Disable evals"], "answer": 0, "why": "Cache locality can dominate latency and cost."}, {"q": "Noisy-neighbor protection on shared GPUs uses…", "choices": ["Turning off batching", "More logging", "Quotas, fair queuing and priority classes", "Bigger prompts"], "answer": 2, "why": "These keep one tenant from starving others."}, {"q": "Why pre-replicate model weights to a DR region?", "choices": ["Licensing requires it", "It improves accuracy", "Weights are tiny", "Pulling 100+ GB during an outage is slow"], "answer": 3, "why": "Recovery time depends on artifacts already being there."}], "conceptIds": []}, {"id": "a-plat", "title": "Internal AI Platforms", "why": "Scale the company by productizing plumbing once.", "explainer": "An internal platform offers model gateway, prompt registry, shared evals, sandbox tool runtime, and cost dashboards as golden paths. Developer experience matters: templates, guardrail defaults, observability out of the box, clear chargeback.\n\nCommon mistake: a platform so rigid that squads shadow-IT another vendor. Another: a platform with no product owner — just tickets.\n\nMeasure adoption and time-to-first-eval, not only GPU utilization.", "resources": [{"title": "Full Stack Deep Learning", "url": "https://fullstackdeeplearning.com/"}, {"title": "ml-ops.org", "url": "https://ml-ops.org/"}, {"title": "Team Topologies", "url": "https://teamtopologies.com/"}, {"title": "LiteLLM", "url": "https://docs.litellm.ai/"}], "project": "Sketch an internal AI platform: registry, eval harness, gateway, sandbox, cost view.", "topics": [{"id": "a-plat-cap", "title": "Capabilities", "subtopics": [{"id": "a-plat-cap-s1", "title": "Gateway and routing"}, {"id": "a-plat-cap-s2", "title": "Prompt/version registry"}, {"id": "a-plat-cap-s3", "title": "Shared eval service"}, {"id": "a-plat-cap-s4", "title": "Sandbox tool runtime"}, {"id": "a-plat-cap-s5", "title": "Cost dashboards"}], "explainer": "An internal AI platform bundles the things every team would otherwise rebuild: a gateway with routing and budgets, a prompt and configuration registry with versions, a shared evaluation service, a sandboxed tool runtime for agents, and cost dashboards. The goal is that a product team can ship a safe, observable AI feature in days without becoming experts in GPUs or security."}, {"id": "a-plat-dx", "title": "Developer Experience", "subtopics": [{"id": "a-plat-dx-s1", "title": "Golden paths"}, {"id": "a-plat-dx-s2", "title": "Guardrail defaults"}, {"id": "a-plat-dx-s3", "title": "Obs by default"}, {"id": "a-plat-dx-s4", "title": "Chargeback clarity"}, {"id": "a-plat-dx-s5", "title": "Self-serve vs ticketed"}], "explainer": "Platforms succeed through developer experience. Offer golden paths: templates that come with auth, tracing, evals and guardrails already wired. Make safe defaults the easy path. Turn on observability automatically. Make costs visible per team. Prefer self-service with policy guardrails over ticket queues, because teams route around slow platforms and that is how shadow AI starts. Try it: time how long a new team takes from \"we want an AI feature\" to a traced, budgeted endpoint in staging. If it is weeks, that number is your platform roadmap."}], "quiz": [{"q": "A healthy AI platform optimizes for…", "choices": ["Squad time-to-safe-production", "Maximum number of frameworks", "Hiding all costs", "Forbidding APIs entirely"], "answer": 0, "why": "Enable safe speed."}, {"q": "A golden path is…", "choices": ["A pricing plan", "A template with auth, tracing, evals and guardrails pre-wired", "A premium support tier", "The fastest GPU"], "answer": 1, "why": "It makes the safe way the easy way."}, {"q": "Shadow AI usually grows when…", "choices": ["The official platform is slow or ticket-driven", "Gateways exist", "Budgets are visible", "Evals exist"], "answer": 0, "why": "Teams route around friction."}], "conceptIds": ["ref-arch"]}, {"id": "a-cards", "title": "Model Cards, Licensing & Procurement", "why": "Paperwork is part of the architecture in regulated deals.", "explainer": "Model cards and system cards communicate intended use, limits, and eval summaries. Licensing distinguishes API ToS, open weights, copyleft, and training-data provenance claims. Procurement needs security questionnaires, subprocessors, and exit clauses.\n\nCommon mistake: assuming Hugging Face hosting implies a particular license. Another: no plan to extract prompts and evals when switching vendors.\n\nKeep a contract checklist next to the reference architecture.", "resources": [{"title": "EU AI Act", "url": "https://artificialintelligenceact.eu/"}, {"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}, {"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}], "project": "Fill a model/system card for a client-facing RAG assistant; list license and exit risks.", "topics": [{"id": "a-cards-doc", "title": "Documentation", "subtopics": [{"id": "a-cards-doc-s1", "title": "Model cards"}, {"id": "a-cards-doc-s2", "title": "System cards"}, {"id": "a-cards-doc-s3", "title": "Eval summaries"}, {"id": "a-cards-doc-s4", "title": "Known limitations"}, {"id": "a-cards-doc-s5", "title": "Change logs"}], "explainer": "Documentation is how trust scales. Model cards describe what a model is, how it was trained and evaluated, and where it fails. System cards describe the whole application, including prompts, tools, guardrails and human oversight. Publish eval summaries and known limitations honestly. Keep a change log of model and prompt versions so users and auditors can match behavior to releases."}, {"id": "a-cards-buy", "title": "Procurement", "subtopics": [{"id": "a-cards-buy-s1", "title": "ToS vs weight licenses"}, {"id": "a-cards-buy-s2", "title": "Subprocessors"}, {"id": "a-cards-buy-s3", "title": "Security questionnaires"}, {"id": "a-cards-buy-s4", "title": "Exit and data return"}, {"id": "a-cards-buy-s5", "title": "Insurance / liability notes"}], "explainer": "Procurement for AI has new details. API terms of service and open-weight licenses differ: check commercial use, user thresholds, and output ownership. List subprocessors and data locations. Prepare for security questionnaires that ask about training on customer data, retention, and isolation. Negotiate exit terms, including data return and deletion. Ask about indemnity for IP claims on outputs, and check whether your insurance covers AI-related incidents."}], "quiz": [{"q": "A model card should include…", "choices": ["Intended use, limits, and evaluation notes", "Only marketing screenshots", "Root passwords", "GPU serial numbers"], "answer": 0, "why": "Cards communicate safe use boundaries."}, {"q": "A system card differs from a model card by covering…", "choices": ["Only training data", "The whole application: prompts, tools, guardrails and oversight", "Only weights", "Only pricing"], "answer": 1, "why": "Behavior depends on the system, not just the model."}, {"q": "\"Open weights\" licenses may still…", "choices": ["Never restrict anything", "Ban fine-tuning always", "Restrict commercial use or user counts", "Require GPUs from one vendor"], "answer": 2, "why": "Read each license; terms vary widely."}], "conceptIds": []}, {"id": "a-product", "title": "AI Product Management and Product Engineering for Agents", "why": "Agentic products fail more from wrong problem, wrong UX or wrong autonomy level than from wrong model.", "explainer": "AI Product Managers and Product Engineers decide what the agent should do, for whom, how users stay in control, and how success is measured. Agent products need new product muscles: specifying behavior with eval sets (the eval is the spec), choosing the autonomy level per action (suggest, draft, act with approval, act autonomously), designing UX for uncertainty (showing sources, progress, confidence and easy correction), and pricing when each task has variable cost.\n\nMetrics combine outcome (task completion, time saved, resolution rate), quality (eval pass rates, escalation and correction rates), trust (adoption, retention, override frequency) and economics (cost per task vs value per task). Product engineers prototype rapidly with real models and real data, run A/B tests and ship iteratively behind flags.\n\nCommon mistakes: chat as the default UI when a button would do; full autonomy on day one; no feedback capture; pricing per seat while costs scale per task.\n\nMental model: autonomy is a dial you earn with evidence, one action at a time.", "resources": [{"title": "Google PAIR Guidebook", "url": "https://pair.withgoogle.com/guidebook/"}, {"title": "Microsoft HAX Toolkit (human-AI interaction guidelines)", "url": "https://www.microsoft.com/en-us/haxtoolkit/"}, {"title": "Lenny's Newsletter: AI product evals", "url": "https://www.lennysnewsletter.com/p/beyond-vibe-checks-a-pms-complete"}], "project": "Write a product spec for an agent feature as an eval set (30 cases) plus an autonomy matrix per action. Prototype the UX with source display and one-click correction, define outcome/quality/trust/economics metrics, and design an A/B test with a guardrail metric.", "topics": [{"id": "a-product-t1", "title": "Specs as evals and autonomy design", "explainer": "Replace vague requirements with examples: inputs, expected behaviors and unacceptable behaviors, which engineers turn into the eval suite. For each action the agent can take, choose an autonomy level based on reversibility, cost of error and user trust, and define the evidence needed to raise it, such as 98% approval rate over 500 reviewed actions. This makes progress toward autonomy a measurable roadmap rather than a leap of faith.", "subtopics": [{"id": "a-product-t1-s1", "title": "Example-driven specs"}, {"id": "a-product-t1-s2", "title": "Unacceptable behaviors list"}, {"id": "a-product-t1-s3", "title": "Autonomy levels per action"}, {"id": "a-product-t1-s4", "title": "Evidence thresholds to raise autonomy"}, {"id": "a-product-t1-s5", "title": "Spec-to-eval workflow"}]}, {"id": "a-product-t2", "title": "UX for agents", "explainer": "Good agent UX shows what the agent is doing and why: progress for long tasks, sources and citations, previews of actions before they happen, and easy undo or correction. Use structured UI where possible instead of free chat. Make handoff to a human seamless and preserve context. Capture feedback at the point of correction, because that data is gold for evals. Design for failure states as carefully as for success.", "subtopics": [{"id": "a-product-t2-s1", "title": "Progress and transparency"}, {"id": "a-product-t2-s2", "title": "Citations and previews"}, {"id": "a-product-t2-s3", "title": "Undo and correction"}, {"id": "a-product-t2-s4", "title": "Structured UI vs chat"}, {"id": "a-product-t2-s5", "title": "Human handoff"}]}, {"id": "a-product-t3", "title": "Metrics, experiments and pricing", "explainer": "Define a metric stack: outcome metrics for value, quality metrics from evals and corrections, trust metrics like adoption and override rates, and economic metrics such as cost per task versus value per task. Run A/B tests with guardrail metrics so a cheaper model that raises escalations is caught. Price to align with value and cost: per task, per outcome or hybrid, with usage limits that prevent loss-making customers.", "subtopics": [{"id": "a-product-t3-s1", "title": "Outcome, quality, trust, economics"}, {"id": "a-product-t3-s2", "title": "A/B tests with guardrails"}, {"id": "a-product-t3-s3", "title": "Cost vs value per task"}, {"id": "a-product-t3-s4", "title": "Outcome-based pricing"}, {"id": "a-product-t3-s5", "title": "Usage limits and margins"}]}], "quiz": [{"q": "What is the best form of an agent product spec?", "choices": ["A set of example cases that become the eval suite", "A model choice", "A slogan", "A logo"], "answer": 0, "why": "Evals make behavior requirements concrete and testable."}, {"q": "Which factor most determines an action's autonomy level?", "choices": ["Model size", "UI color", "Token count", "Reversibility and cost of error"], "answer": 3, "why": "Irreversible, costly actions need more oversight."}, {"q": "Why include a guardrail metric in A/B tests?", "choices": ["To catch harm (e.g. more escalations) while optimizing the primary metric", "To make tests longer", "Required by law", "To reduce traffic"], "answer": 0, "why": "Guardrails prevent wins that hurt other outcomes."}], "conceptIds": ["fde-lifecycle"]}]}, {"id": "a-l5", "name": "L5 Frontier", "subjects": [{"id": "a-sov", "title": "Sovereign & Regulated Architectures", "why": "Governments and banks pay for in-boundary designs.", "explainer": "Sovereign AI keeps weights, logs, and often embeddings inside a boundary. Confidential GPUs/TEEs, air-gapped MLOps, signed supply chains, and offline red-team processes appear. Update channels become sneakernet or heavily controlled mirrors.\n\nCommon mistake: 'private VPC endpoint to a public model' sold as sovereign. Another: no patch story for CVEs in the serving stack.\n\nDesign evidence packs auditors can consume without a live demo.", "resources": [{"title": "EU AI Act", "url": "https://artificialintelligenceact.eu/"}, {"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}], "project": "Design an air-gapped inference plus RAG stack with signed update channel.", "topics": [{"id": "a-sov-ctrl", "title": "Controls", "subtopics": [{"id": "a-sov-ctrl-s1", "title": "In-boundary weights and logs"}, {"id": "a-sov-ctrl-s2", "title": "Confidential computing / TEEs"}, {"id": "a-sov-ctrl-s3", "title": "Offline eval and red-team"}, {"id": "a-sov-ctrl-s4", "title": "Signed model supply chain"}, {"id": "a-sov-ctrl-s5", "title": "Local embedding/search"}], "explainer": "Sovereign and regulated deployments keep weights, prompts, logs and embeddings inside a legal and physical boundary. Confidential computing and GPU TEEs protect data in use from the cloud operator. Evals and red-teaming run inside the boundary too. Models arrive through a signed supply chain with verified hashes. Embedding and search run locally so documents never leave. A private network link to a public model API does not satisfy these requirements on its own."}, {"id": "a-sov-ops", "title": "Operations", "subtopics": [{"id": "a-sov-ops-s1", "title": "Signed updates / sneakernet"}, {"id": "a-sov-ops-s2", "title": "Break-glass access"}, {"id": "a-sov-ops-s3", "title": "Telemetry without exfil"}, {"id": "a-sov-ops-s4", "title": "Auditor evidence packs"}, {"id": "a-sov-ops-s5", "title": "Field support model"}], "explainer": "Operating inside a boundary changes daily work. Updates arrive as signed bundles, sometimes physically carried in. Break-glass access for emergencies is logged and time-limited. Telemetry must be designed so metrics leave but data does not. Auditors expect evidence packs. Field support may require cleared staff on site, so the support model is part of the architecture, not an afterthought. Try it: write the runbook for a model update that must cross an air gap, from vendor release to signed bundle to production."}], "quiz": [{"q": "A public-model Private Link alone…", "choices": ["Does not make processing fully sovereign", "Deletes all logs", "Removes prompt injection", "Guarantees ISO 42001"], "answer": 0, "why": "Data still leaves the boundary to the provider."}, {"q": "Confidential computing on GPUs protects data…", "choices": ["In use, even from the host operator", "Only in logs", "Only in transit", "At rest only"], "answer": 0, "why": "TEEs encrypt memory and attest the environment."}, {"q": "In an air-gapped site, model updates typically arrive as…", "choices": ["Email attachments", "Unsigned downloads", "Live API calls", "Signed bundles verified before install"], "answer": 3, "why": "Signatures and hashes protect the offline supply chain."}], "conceptIds": []}, {"id": "a-org", "title": "Org Design & AI Transformation", "why": "Architecture without operating model fails at handoff.", "explainer": "CoE versus federated versus hub-spoke, platform versus product teams, RACI for model incidents, and hiring skills matrices determine whether designs live. Pilots need explicit scale criteria; vendor sprawl needs governance; executives need metrics beyond demo wow.\n\nCommon mistake: centralizing all AI in a team that becomes a bottleneck. Another: federating with zero shared eval standards.\n\nTeam Topologies-style thinking maps cleanly onto AI platforms.", "resources": [{"title": "Team Topologies", "url": "https://teamtopologies.com/"}, {"title": "Full Stack Deep Learning", "url": "https://fullstackdeeplearning.com/"}, {"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}], "project": "Propose CoE plus federated squads for a 2,000-person company adopting agents.", "topics": [{"id": "a-org-model", "title": "Operating Models", "subtopics": [{"id": "a-org-model-s1", "title": "CoE vs federated vs hub-spoke"}, {"id": "a-org-model-s2", "title": "Platform vs product"}, {"id": "a-org-model-s3", "title": "RACI for incidents"}, {"id": "a-org-model-s4", "title": "Skills matrix"}, {"id": "a-org-model-s5", "title": "Vendor management"}], "explainer": "Organizations typically pick a Center of Excellence (central experts), a federated model (each business unit builds), or hub-and-spoke (central platform plus embedded builders). Separate the platform team, which provides paved roads, from product teams, which ship features. Write a RACI for AI incidents. Keep a skills matrix so you know who can do evals, infra, security and domain review. Manage vendors centrally to avoid twenty contracts with the same provider."}, {"id": "a-org-change", "title": "Change", "subtopics": [{"id": "a-org-change-s1", "title": "Pilot to scale criteria"}, {"id": "a-org-change-s2", "title": "Shadow IT risk"}, {"id": "a-org-change-s3", "title": "Sprawl control"}, {"id": "a-org-change-s4", "title": "Executive metrics"}, {"id": "a-org-change-s5", "title": "Training plans"}], "explainer": "Pilots are easy; scaling is hard. Define criteria to graduate a pilot: measured quality, cost per task, security review, owner on call. Watch for shadow AI, where teams use unapproved tools because the official path is slow. Control sprawl by consolidating gateways and prompt stores. Report executive metrics in business terms such as hours saved or resolution rate, and invest in training so staff know what the tools can and cannot do."}], "quiz": [{"q": "A platform team should…", "choices": ["Provide golden paths and reduce cognitive load", "Approve every prompt manually forever", "Own all product UX", "Ban external APIs always"], "answer": 0, "why": "Platforms enable; they do not bottleneck forever."}, {"q": "Hub-and-spoke AI organizations combine…", "choices": ["Only a central team", "Only outsourcing", "A central platform with builders embedded in business units", "No platform"], "answer": 2, "why": "The hub provides paved roads; spokes ship domain features."}, {"q": "A good criterion to graduate a pilot is…", "choices": ["The demo impressed executives", "It has a logo", "It used the newest model", "Measured quality, cost per task, security review and an on-call owner"], "answer": 3, "why": "Scale needs evidence and ownership."}], "conceptIds": []}]}]}, {"id": "engineer", "name": "AI Engineer", "icon": "wrench", "role": "Ships AI-powered products: prompts, tools, RAG, evals, APIs, hardening. Day to day: features, golden sets, traces, cost/latency. Differs from Architect (system shape) and Inference (engines): you own the application that calls the model.", "levels": [{"id": "e-l1", "name": "L1 Foundations", "subjects": [{"id": "e-api", "title": "LLM Application Fundamentals", "why": "Every product starts as messages, tokens, and a reliable client.", "explainer": "Production LLM apps are distributed systems that speak chat APIs. Master streaming SSE, retries with jitter, deadlines, cancellation, and token accounting. Know the difference between chat, completions, and newer responses-style APIs. Structured JSON mode and schema adherence prevent brittle string parsing.\n\nMessage design (system/user/assistant/tool) and chat templates are part of the contract with the model. Context budgets are product decisions: what stays, what summarizes, what retrieves.\n\nCommon mistake: unbounded retries that amplify outages and bills. Another: blocking the request thread on a 60s model call with no timeout.\n\nWrap the vendor SDK behind your own client so you can swap providers and add telemetry once.", "resources": [{"title": "OpenAI prompt engineering", "url": "https://developers.openai.com/api/docs/guides/prompt-engineering"}, {"title": "Anthropic prompt engineering", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"}, {"title": "PyTorch tutorials", "url": "https://docs.pytorch.org/tutorials/"}, {"title": "Twelve-Factor App", "url": "https://12factor.net/"}, {"title": "Docker docs", "url": "https://docs.docker.com/"}], "project": "FastAPI service with streaming chat, retries, timeouts, token accounting, JSON schema mode.", "topics": [{"id": "e-api-client", "title": "Client Craft", "subtopics": [{"id": "e-api-client-s1", "title": "Chat vs completions vs responses APIs"}, {"id": "e-api-client-s2", "title": "Streaming SSE"}, {"id": "e-api-client-s3", "title": "Idempotency and retries"}, {"id": "e-api-client-s4", "title": "Timeouts and cancellation"}, {"id": "e-api-client-s5", "title": "Token and cost accounting"}], "explainer": "A solid LLM client handles the boring failures. Know the API shapes: chat completions, newer responses-style APIs with built-in tools and state, and legacy completions. Streaming uses server-sent events; parse incrementally and handle disconnects. Retry 429 and 5xx with exponential backoff and jitter, and use idempotency keys when the call triggers side effects. Set connect and total timeouts and propagate user cancellation so you stop paying for tokens nobody will read. Log input, output and cached token counts on every call so cost is measurable per feature."}, {"id": "e-api-msg", "title": "Message Design", "subtopics": [{"id": "e-api-msg-s1", "title": "Roles and chat templates"}, {"id": "e-api-msg-s2", "title": "Few-shot packing"}, {"id": "e-api-msg-s3", "title": "Context budgets"}, {"id": "e-api-msg-s4", "title": "Multi-turn state"}, {"id": "e-api-msg-s5", "title": "Provider quirks"}], "explainer": "Messages carry roles (system, user, assistant, tool) that the provider turns into a chat template. Put durable instructions in the system message and task data in user turns. Few-shot examples help most for format and edge cases; keep them short and representative. Budget context explicitly: instructions, retrieved data, history and room for the answer must fit. For multi-turn apps, decide what state you keep server-side versus resend each turn. Providers differ in tool-call formats, max output limits and how they treat system prompts, so wrap them in an adapter."}], "quiz": [{"q": "Streaming primarily improves…", "choices": ["Time-to-first-token UX", "Final answer accuracy always", "GPU utilization to 100%", "Compliance automatically"], "answer": 0, "why": "Users see tokens sooner; quality unchanged."}, {"q": "Which errors should a client usually retry with backoff?", "choices": ["404 Not Found", "429 and 5xx", "400 Bad Request", "401 Unauthorized"], "answer": 1, "why": "Rate limits and transient server errors are retryable; client errors are not."}, {"q": "Propagating user cancellation to the model call mainly saves…", "choices": ["DNS lookups", "Tokens and money spent on output nobody reads", "Disk space", "Embeddings"], "answer": 1, "why": "Generation keeps billing until the request stops."}], "conceptIds": []}, {"id": "e-prompt", "title": "Prompt & Context Engineering", "why": "Most quality gains before fine-tuning live here.", "explainer": "Prompting is specifying behavior under uncertainty. Clear instructions, constraints, schemas, and carefully chosen examples beat purple prose. Context engineering decides what enters the window: system policy, retrieved evidence, tool results, memory summaries — and in what order.\n\nLost-in-the-middle, recency bias, and compaction loss are practical failure modes. Prefer explicit refusal rules over hoping the model abstains.\n\nCommon mistake: a 4,000-word system prompt nobody diffs. Another: stuffing retrieval without citations or overlap checks.\n\nTreat prompts as versioned code with evals on every change.", "resources": [{"title": "OpenAI prompt engineering", "url": "https://developers.openai.com/api/docs/guides/prompt-engineering"}, {"title": "Anthropic prompt engineering", "url": "https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview"}, {"title": "Prompting Guide", "url": "https://www.promptingguide.ai/"}, {"title": "Stanford CS224N", "url": "https://web.stanford.edu/class/cs224n/"}], "project": "Take a flaky prompt; add schema, examples, failure modes; measure on 30 cases before/after.", "topics": [{"id": "e-prompt-tech", "title": "Techniques", "subtopics": [{"id": "e-prompt-tech-s1", "title": "Instructions and constraints"}, {"id": "e-prompt-tech-s2", "title": "CoT vs no-CoT"}, {"id": "e-prompt-tech-s3", "title": "Self-consistency"}, {"id": "e-prompt-tech-s4", "title": "Structured output / JSON schema"}, {"id": "e-prompt-tech-s5", "title": "Delimiter and role hygiene"}], "explainer": "Clear prompts state the task, the audience, constraints and the output format, and include an example when format matters. Chain-of-thought helps on multi-step reasoning but costs tokens; reasoning models do it internally, so explicit CoT prompts matter less there. Self-consistency samples several answers and takes the majority, trading cost for accuracy. Use JSON schema or structured output modes instead of begging for JSON. Wrap untrusted content in clear delimiters and tell the model it is data, which helps but does not stop determined injection."}, {"id": "e-prompt-ctx", "title": "Context Engineering", "subtopics": [{"id": "e-prompt-ctx-s1", "title": "System vs retrieved vs memory"}, {"id": "e-prompt-ctx-s2", "title": "Ordering and recency"}, {"id": "e-prompt-ctx-s3", "title": "Compaction / summarization"}, {"id": "e-prompt-ctx-s4", "title": "Lost-in-the-middle"}, {"id": "e-prompt-ctx-s5", "title": "Citation requirements"}], "explainer": "Context engineering means choosing what goes into the window and in what order. Sources include the system prompt, retrieved documents, memory, tool results and conversation history. Models attend best to the start and end, so put key instructions and the most relevant evidence there. When history grows, compact it by summarizing older turns while pinning facts that must survive. Require citations to retrieved chunks so answers can be verified. Most quality problems in production apps are context problems, not model problems."}], "quiz": [{"q": "Context engineering is mainly about…", "choices": ["What enters the window and in what form", "Only temperature", "Only GPU choice", "Only EU AI Act text"], "answer": 0, "why": "Selection and arrangement of context dominate quality."}, {"q": "Untrusted content in a prompt should be…", "choices": ["Put in the system prompt", "Deleted always", "Mixed into instructions", "Delimited and labeled as data"], "answer": 3, "why": "Clear boundaries help, though they do not fully stop injection."}, {"q": "Models tend to use information best when it is placed…", "choices": ["At the start or end of the context", "In metadata only", "In the exact middle", "Randomly"], "answer": 0, "why": "\"Lost in the middle\" degrades recall for centered content."}], "conceptIds": ["context-eng"]}, {"id": "e-tok", "title": "Tokenizer & Embedding Internals for App Devs", "why": "Token and embedding choices silently set cost and recall.", "explainer": "You rarely train a tokenizer, but you must know fertility, multilingual blowups, and how embedding models differ from the chat model. Chunk boundaries that split sentences kill retrieval. Dimension, MRL, and similarity metrics affect index design.\n\nCommon mistake: embedding with model A and assuming chat model B 'understands' the same vectors. Another: giant chunks to 'save' embeddings that then exceed useful context.\n\nMeasure tokens per page of your real corpus before pricing the product.", "resources": [{"title": "minbpe", "url": "https://github.com/karpathy/minbpe"}, {"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}, {"title": "Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2005.11401"}], "project": "Tokenize 20 real docs; report fertility; chunk three ways and compare retrieval hit rate.", "topics": [{"id": "e-tok-bpe", "title": "Tokenizers", "subtopics": [{"id": "e-tok-bpe-s1", "title": "Fertility by domain"}, {"id": "e-tok-bpe-s2", "title": "Multilingual cost"}, {"id": "e-tok-bpe-s3", "title": "Special tokens"}, {"id": "e-tok-bpe-s4", "title": "Truncation strategies"}, {"id": "e-tok-bpe-s5", "title": "Counting before send"}], "explainer": "Token counts drive cost, latency and truncation. Measure fertility on your real data: JSON, code, logs and non-English text often tokenize poorly. Special tokens such as end-of-turn markers must never appear in user content unescaped. When text is too long, choose a truncation strategy deliberately (keep the head and tail, summarize the middle, or retrieve) instead of chopping silently. Count tokens with the provider's tokenizer before sending so you can reject or compact oversized requests early."}, {"id": "e-emb", "title": "Embeddings", "subtopics": [{"id": "e-emb-s1", "title": "Bi-encoders vs cross-encoders"}, {"id": "e-emb-s2", "title": "Dimension and MRL"}, {"id": "e-emb-s3", "title": "Similarity metrics"}, {"id": "e-emb-s4", "title": "Domain drift"}, {"id": "e-emb-s5", "title": "Asymmetric query/doc models"}], "explainer": "Embeddings turn text into vectors for search. Bi-encoders embed queries and documents separately, which is fast and indexable; cross-encoders read the pair together and are more accurate, so use them to rerank a shortlist. Matryoshka (MRL) models let you truncate vectors to fewer dimensions with modest quality loss, saving memory. Cosine similarity is standard; normalize vectors so dot product equals cosine. Some models use different prefixes or encoders for queries and documents. Re-evaluate when your domain drifts, and remember that changing embedding models means re-indexing."}], "quiz": [{"q": "A bi-encoder is typically used to…", "choices": ["Embed queries/docs for ANN search", "Generate the final answer tokens", "Train the GPU driver", "Replace HTTPS"], "answer": 0, "why": "Bi-encoders enable fast retrieval."}, {"q": "Matryoshka (MRL) embeddings let you…", "choices": ["Encrypt vectors", "Train without data", "Truncate vectors to fewer dimensions with modest quality loss", "Skip tokenization"], "answer": 2, "why": "Prefixes of the vector remain useful embeddings."}, {"q": "After L2-normalizing vectors, dot product equals…", "choices": ["Hamming distance", "Jaccard index", "Euclidean distance", "Cosine similarity"], "answer": 3, "why": "Normalization removes magnitude, leaving the cosine."}], "conceptIds": []}]}, {"id": "e-l2", "name": "L2 Practitioner", "subjects": [{"id": "e-tools", "title": "Tool Calling & Structured I/O", "why": "Tools turn chat into software; schemas keep it sane.", "explainer": "Design task-oriented tools with strict schemas and server-side validation. Parallel tool calls, repair turns, max iterations, and human confirmation for irreversible side effects are part of the loop. Error messages back to the model should be actionable, not stack traces with secrets.\n\nCommon mistake: exposing 80 CRUD endpoints and wondering why tool selection flails. Another: trusting model-produced SQL without a permission layer.\n\nFewer, sharper tools beat a mirror of your REST API.", "resources": [{"title": "OpenAI prompt engineering", "url": "https://developers.openai.com/api/docs/guides/prompt-engineering"}, {"title": "Anthropic Building Effective Agents", "url": "https://www.anthropic.com/engineering/building-effective-agents"}, {"title": "Model Context Protocol", "url": "https://modelcontextprotocol.io/"}], "project": "Implement 5 tools with strict schemas, validation, and safe errors back to the model.", "topics": [{"id": "e-tools-des", "title": "Design", "subtopics": [{"id": "e-tools-des-s1", "title": "Task-oriented vs CRUD"}, {"id": "e-tools-des-s2", "title": "Descriptions models can use"}, {"id": "e-tools-des-s3", "title": "Argument schemas"}, {"id": "e-tools-des-s4", "title": "Idempotent side effects"}, {"id": "e-tools-des-s5", "title": "Side-effect classes"}], "explainer": "Design tools around tasks the model needs, not around your database tables: \"refund_order(order_id, reason)\" beats generic CRUD. Descriptions are prompts, so write them for the model, with when-to-use guidance and examples. Use strict argument schemas with enums and required fields. Classify side effects as read, reversible write or irreversible write, and make writes idempotent with keys so retries do not double-charge. Return compact, structured results and clear error messages the model can act on."}, {"id": "e-tools-loop", "title": "Loop", "subtopics": [{"id": "e-tools-loop-s1", "title": "Parallel tool calls"}, {"id": "e-tools-loop-s2", "title": "Error repair turns"}, {"id": "e-tools-loop-s3", "title": "Max iterations"}, {"id": "e-tools-loop-s4", "title": "Human confirmation"}, {"id": "e-tools-loop-s5", "title": "Timeouts per tool"}], "explainer": "The tool loop is: model proposes calls, harness executes, results go back, repeat until the model answers. Run independent calls in parallel. When a tool fails, return a useful error so the model can repair arguments on the next turn rather than crashing. Cap iterations and total tokens so loops cannot run forever. Insert human confirmation before irreversible actions. Give each tool its own timeout so one slow API does not stall the whole run."}], "quiz": [{"q": "Tool results should be treated as…", "choices": ["Untrusted input that can inject instructions", "Trusted system prompts", "GPU telemetry only", "Always empty"], "answer": 0, "why": "Tool outputs are an injection channel."}, {"q": "Idempotency keys on write tools prevent…", "choices": ["Long prompts", "Slow responses", "Schema errors", "Duplicate side effects on retries"], "answer": 3, "why": "A retried call with the same key is a no-op."}, {"q": "When a tool fails, the harness should…", "choices": ["Return a clear error so the model can repair its call", "Crash the run", "Retry forever", "Hide the failure"], "answer": 0, "why": "Actionable errors enable self-correction within budgets."}], "conceptIds": ["tool-calling"]}, {"id": "e-rag", "title": "RAG Systems Deep Dive", "why": "Retrieval is the default enterprise grounding path.", "explainer": "Indexing (chunking, embeddings, metadata), hybrid BM25+dense, reranking, query rewrite, multi-hop, and citation grounding form the pipeline. Failures: wrong chunk, split fact, stale index, injection via docs, over-retrieval noise. GraphRAG and knowledge-graph hybrids help when relations matter more than similarity.\n\nEvaluate retrieval and generation separately. Refuse when unsupported.\n\nCommon mistake: one-size chunking for policies, tables, and code. Another: no ACL filters on the index in a multi-tenant app.", "resources": [{"title": "Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2005.11401"}, {"title": "LlamaIndex", "url": "https://developers.llamaindex.ai/python/framework/"}, {"title": "LangChain", "url": "https://docs.langchain.com/oss/python/langchain/overview"}, {"title": "Ragas", "url": "https://docs.ragas.io/en/stable/"}], "project": "Hybrid BM25+vector RAG with citations, refusal, ACL filters, and a Ragas-style report.", "topics": [{"id": "e-rag-index", "title": "Indexing", "subtopics": [{"id": "e-rag-index-s1", "title": "Chunking strategies"}, {"id": "e-rag-index-s2", "title": "Embeddings choice"}, {"id": "e-rag-index-s3", "title": "Metadata and ACLs"}, {"id": "e-rag-index-s4", "title": "Hybrid BM25+dense"}, {"id": "e-rag-index-s5", "title": "Graph / hierarchical indexes"}], "explainer": "Indexing quality sets the ceiling for RAG. Chunk on structure (headings, sections) rather than fixed character counts, with modest overlap. Pick embeddings by testing retrieval on your data. Attach metadata (source, date, ACL, section) to every chunk so you can filter and cite. Combine BM25 keyword search with dense vectors, since each catches what the other misses. For complex corpora, hierarchical or graph indexes capture relationships that flat chunks lose."}, {"id": "e-rag-query", "title": "Query Path", "subtopics": [{"id": "e-rag-query-s1", "title": "Query rewrite / HyDE"}, {"id": "e-rag-query-s2", "title": "Multi-hop"}, {"id": "e-rag-query-s3", "title": "Reranking"}, {"id": "e-rag-query-s4", "title": "Citation grounding"}, {"id": "e-rag-query-s5", "title": "Refusal and coverage"}], "explainer": "At query time, rewrite vague or conversational questions into standalone searches; HyDE generates a hypothetical answer and searches with it. Multi-hop questions need iterative retrieval where each step informs the next. Retrieve broadly (say 50 candidates) then rerank with a cross-encoder down to the best 5 to 10. Force the model to cite chunk ids and to say when the evidence does not cover the question. Good refusals are a feature, not a failure."}, {"id": "e-rag-fail", "title": "Failure Modes", "subtopics": [{"id": "e-rag-fail-s1", "title": "Wrong chunk / split fact"}, {"id": "e-rag-fail-s2", "title": "Stale index"}, {"id": "e-rag-fail-s3", "title": "Doc-based injection"}, {"id": "e-rag-fail-s4", "title": "Over-retrieval noise"}, {"id": "e-rag-fail-s5", "title": "Eval blind spots"}], "explainer": "RAG fails in recognizable ways. The answer was split across two chunks and neither alone is enough. The index is stale. A document contains injected instructions that the model follows. Too many weak chunks drown the relevant one. Evals only test easy questions so problems stay hidden. Diagnose by logging retrieved chunks with every answer and labeling failures as retrieval misses versus generation errors; the fixes are completely different."}, {"id": "e-rag-x1", "title": "Knowledge graphs for RAG", "explainer": "Knowledge graphs store entities and typed relationships, such as customer owns contract and contract references a policy, which supports multi-hop questions that chunk similarity misses. Build them by extracting entities and relations with an LLM, resolving duplicates, and storing them in a graph database. At query time, combine vector search to find entry points with graph traversal or Cypher queries to follow relations. GraphRAG adds community summaries for global questions. Graphs cost effort to maintain, so use them where relationships drive answers.", "subtopics": [{"id": "e-rag-x1-s1", "title": "Entities and relations"}, {"id": "e-rag-x1-s2", "title": "LLM-based extraction and entity resolution"}, {"id": "e-rag-x1-s3", "title": "Graph databases and Cypher"}, {"id": "e-rag-x1-s4", "title": "Vector entry points plus traversal"}, {"id": "e-rag-x1-s5", "title": "When knowledge graphs pay off"}]}], "quiz": [{"q": "Hybrid search combines…", "choices": ["Lexical (e.g. BM25) and dense vectors", "Two GPUs only", "HTTP and FTP", "Training and inference licenses"], "answer": 0, "why": "Lexical+dense covers complementary failures."}, {"q": "Reranking with a cross-encoder is typically applied to…", "choices": ["The entire corpus", "The final answer", "Only the query", "A shortlist of retrieved candidates"], "answer": 3, "why": "Cross-encoders are accurate but too slow for full-corpus search."}, {"q": "To diagnose a bad RAG answer first check…", "choices": ["The tokenizer license", "GPU temperature", "Which chunks were retrieved", "The font"], "answer": 2, "why": "Separate retrieval misses from generation errors."}], "conceptIds": ["rag-pipeline", "hnsw", "graphrag"]}, {"id": "e-cache", "title": "Semantic Caching & Gateway Clients", "why": "Repeat traffic should not always pay full token price.", "explainer": "Application-level semantic caches and gateway features (LiteLLM and friends) reduce spend on FAQs and repeated agent prefixes. Keys must include tenant, tool policy version, and model identity. Bypass on freshness-critical or personalized paths.\n\nCommon mistake: caching answers that include time-varying inventory. Another: sharing cache across permission tiers.\n\nInstrument hit rate next to quality — a high hit rate with wrong answers is a silent outage.", "resources": [{"title": "LiteLLM", "url": "https://docs.litellm.ai/"}, {"title": "OpenTelemetry", "url": "https://opentelemetry.io/docs/"}, {"title": "Ragas", "url": "https://docs.ragas.io/en/stable/"}], "project": "Add a semantic cache with tenant keys; measure hit rate and quality on 100 repeated queries.", "topics": [{"id": "e-cache-des", "title": "Design", "subtopics": [{"id": "e-cache-des-s1", "title": "Similarity thresholds"}, {"id": "e-cache-des-s2", "title": "Key composition"}, {"id": "e-cache-des-s3", "title": "TTL and invalidation"}, {"id": "e-cache-des-s4", "title": "Bypass rules"}, {"id": "e-cache-des-s5", "title": "Cold-start behavior"}], "explainer": "Semantic caching stores responses keyed by prompt embeddings and returns a hit when a new prompt is similar enough. The similarity threshold is the main knob: too low and users get wrong answers, too high and nothing hits. Build keys from the embedding plus tenant, model, prompt version and relevant parameters. Use TTLs and event-based invalidation when source data changes. Bypass the cache for personalized or tool-using requests. Expect a cold start with no hits until traffic builds the cache."}, {"id": "e-cache-ops", "title": "Ops", "subtopics": [{"id": "e-cache-ops-s1", "title": "Hit rate dashboards"}, {"id": "e-cache-ops-s2", "title": "Poisoned cache incidents"}, {"id": "e-cache-ops-s3", "title": "Versioned policy in keys"}, {"id": "e-cache-ops-s4", "title": "Multi-region cache"}, {"id": "e-cache-ops-s5", "title": "Cost attribution"}], "explainer": "Track hit rate, false-hit rate (sampled and reviewed), latency saved and dollars saved. A poisoned cache, where one bad answer gets served thousands of times, is the classic incident, so keep a way to purge by key pattern instantly. Put the policy version in the key so changes invalidate old entries automatically. In multi-region deployments decide whether caches are regional or replicated. Attribute savings to teams so the value is visible."}], "quiz": [{"q": "Cache keys should change when…", "choices": ["Model, prompt version, or permission scope changes", "Only the wall clock changes by 1s", "The GPU UUID changes", "The user scrolls"], "answer": 0, "why": "Semantic identity includes policy and model."}, {"q": "The classic semantic-cache incident is…", "choices": ["A cache miss", "Low disk usage", "One wrong answer served thousands of times", "High TTL on images"], "answer": 2, "why": "Keep the ability to purge entries instantly."}, {"q": "Personalized or tool-using requests should usually…", "choices": ["Always hit the cache", "Bypass the semantic cache", "Be cached forever", "Be cached across tenants"], "answer": 1, "why": "Their correct answers depend on user-specific state."}], "conceptIds": ["model-router"]}, {"id": "e-eval", "title": "Product Evals & Quality Loops", "why": "Ship with a gate, not a vibe check.", "explainer": "Suites need capability, safety, and style slices; golden plus adversarial cases; process metrics for tools; cost and latency budgets. Put evals in CI. Calibrate judges. Sample production for new failures.\n\nCommon mistake: only happy-path demos in the suite. Another: changing model and prompt simultaneously without a factorial eval.\n\nMake failing evals block merges for critical paths.", "resources": [{"title": "OpenAI Evals", "url": "https://github.com/openai/evals"}, {"title": "Ragas", "url": "https://docs.ragas.io/en/stable/"}, {"title": "Stanford HELM", "url": "https://crfm.stanford.edu/helm/"}, {"title": "Judging LLM-as-a-Judge", "url": "https://arxiv.org/abs/2306.05685"}, {"title": "lm-evaluation-harness", "url": "https://github.com/EleutherAI/lm-evaluation-harness"}], "project": "CI evals: 40 golden cases; fail PR on >3% quality drop or cost/latency regress.", "topics": [{"id": "e-eval-suite", "title": "Suite Design", "subtopics": [{"id": "e-eval-suite-s1", "title": "Capability / safety / style"}, {"id": "e-eval-suite-s2", "title": "Golden + adversarial"}, {"id": "e-eval-suite-s3", "title": "Process metrics"}, {"id": "e-eval-suite-s4", "title": "Cost and latency budgets"}, {"id": "e-eval-suite-s5", "title": "Slice by user cohort"}], "explainer": "A product eval suite covers capability (does it solve tasks), safety (refusals, leaks, harmful content) and style (tone, format). Mix golden examples from real traffic with adversarial cases. For agents, add process metrics such as steps taken and tool errors. Track cost and latency per case alongside quality so trade-offs are explicit. Slice results by user cohort, language and task type, because averages hide the segment that is failing."}, {"id": "e-eval-ops", "title": "Ops", "subtopics": [{"id": "e-eval-ops-s1", "title": "Versioned prompts in evals"}, {"id": "e-eval-ops-s2", "title": "Judge calibration"}, {"id": "e-eval-ops-s3", "title": "Production sampling"}, {"id": "e-eval-ops-s4", "title": "Regression dashboards"}, {"id": "e-eval-ops-s5", "title": "Flaky eval hygiene"}], "explainer": "Treat evals as code. Version prompts, models and judge configs together so results are reproducible. Calibrate LLM judges against human labels periodically. Sample production traffic into review queues to find new failure types and feed them back into the golden set. Show regression dashboards per release. Quarantine flaky cases and fix their nondeterminism rather than ignoring red results. Try it: run the same eval twice with no changes. Any case that flips is flaky and needs fixing before it can gate a release."}], "quiz": [{"q": "Process metrics for agents include…", "choices": ["Whether the correct tool and args were chosen", "Only BLEU", "Only GPU temp", "Only NPS"], "answer": 0, "why": "Trajectory correctness matters."}, {"q": "Why slice eval results by cohort?", "choices": ["To use fewer cases", "To reduce cost", "Judges require it", "Averages hide segments that fail"], "answer": 3, "why": "A 90% average can hide a 50% language or task slice."}, {"q": "A case that flips pass/fail with no changes is…", "choices": ["Flaky and should be fixed before gating releases", "Proof of improvement", "A great signal", "A judge upgrade"], "answer": 0, "why": "Flaky cases erode trust in the eval gate."}], "conceptIds": ["evals"]}, {"id": "e-vector", "title": "Vector Search Internals", "why": "Retrieval quality and cost depend on how the index actually finds neighbors.", "explainer": "Vector databases use approximate nearest neighbor (ANN) indexes such as HNSW, IVF and product quantization. Understanding their knobs lets you trade recall, latency and memory deliberately, size infrastructure, and avoid pitfalls such as filters that destroy recall.\n\nCommon mistakes: never measuring recall against exact search; post-filtering ANN results by tenant; re-embedding without re-indexing; choosing a vector DB before knowing data size and filter needs.", "resources": [{"title": "HNSW paper (Malkov & Yashunin)", "url": "https://arxiv.org/abs/1603.09320"}, {"title": "Faiss wiki", "url": "https://github.com/facebookresearch/faiss/wiki"}, {"title": "pgvector", "url": "https://github.com/pgvector/pgvector"}], "project": "Index 1M vectors with HNSW and IVF-PQ in Faiss. Plot recall@10 vs latency for several efSearch and nprobe values, measure memory, then add a tenant filter and observe recall with pre- vs post-filtering.", "topics": [{"id": "e-vec-ann", "title": "ANN Algorithms", "explainer": "Exact search is linear in corpus size. HNSW navigates a layered proximity graph and offers excellent recall and latency at the cost of memory (vectors plus links). IVF partitions vectors into clusters and searches only the closest nprobe lists, which is cheaper in memory and easy to shard. Product quantization compresses vectors into compact codes, enabling billions of vectors in RAM, usually with a full-precision rerank of top candidates. DiskANN-style indexes keep most data on SSD.", "subtopics": [{"id": "e-vec-ann-s1", "title": "Exact vs approximate search"}, {"id": "e-vec-ann-s2", "title": "HNSW graphs (M, ef)"}, {"id": "e-vec-ann-s3", "title": "IVF lists and nprobe"}, {"id": "e-vec-ann-s4", "title": "Product quantization"}, {"id": "e-vec-ann-s5", "title": "Disk-based indexes"}]}, {"id": "e-vec-ops", "title": "Operating Vector Indexes", "explainer": "Measure recall@k against exact search on a sample whenever you change parameters or data. Size memory as vectors plus index overhead. Filters by tenant or ACL should be applied during search (filtered HNSW, partitioned indexes) rather than after, or results can come back nearly empty. Plan re-indexing when embedding models change and handle deletes, which some graph indexes support poorly. Hybrid keyword plus vector search is often the best default.", "subtopics": [{"id": "e-vec-ops-s1", "title": "Recall measurement"}, {"id": "e-vec-ops-s2", "title": "Memory sizing"}, {"id": "e-vec-ops-s3", "title": "Filtered search strategies"}, {"id": "e-vec-ops-s4", "title": "Re-indexing and deletes"}, {"id": "e-vec-ops-s5", "title": "Hybrid search"}]}], "quiz": [{"q": "Increasing HNSW efSearch generally…", "choices": ["Deletes vectors", "Lowers recall", "Raises recall and latency", "Reduces memory"], "answer": 2, "why": "A wider search explores more candidates."}, {"q": "Product quantization mainly reduces…", "choices": ["Dimensions of queries only", "Query count", "Memory per vector", "Recall to zero"], "answer": 2, "why": "Vectors become compact codes."}, {"q": "Post-filtering ANN results by tenant can cause…", "choices": ["Better recall", "Lower memory", "Faster indexing", "Few or no results when the tenant is small"], "answer": 3, "why": "Most top candidates may belong to other tenants."}, {"q": "10M float32 vectors of 768 dims take about…", "choices": ["30.7 GB", "307 GB", "3 GB", "768 MB"], "answer": 0, "why": "10M × 768 × 4 bytes ≈ 30.7 GB."}], "conceptIds": ["hnsw", "graphrag"]}, {"id": "e-reasoning", "title": "Reasoning Models, Test-Time Compute and Model API Platform Features", "why": "Reasoning models and platform features (stateful APIs, caching, batch, built-in tools) change the cost and quality math of every agent.", "explainer": "Reasoning models (OpenAI o-series and GPT reasoning modes, Claude with extended thinking, Gemini thinking, DeepSeek-R1, Qwen reasoning) spend extra tokens thinking before answering. This test-time compute boosts math, coding, planning and multi-step tool use, controlled by settings such as reasoning effort or a thinking budget. The trade-off is latency and cost: thinking tokens are billed, and simple tasks gain nothing.\n\nModel APIs now bundle platform features that agents should use deliberately: the OpenAI Responses API with stored conversation state and built-in tools (web search, file search, code interpreter, computer use); prompt caching across OpenAI, Anthropic and Gemini; batch APIs at roughly half price for offline jobs; structured outputs; citations; moderation endpoints; and fine-tuning including reinforcement fine-tuning (RFT) with graders. Cloud platforms mirror these: Bedrock batch inference, model evaluation and Guardrails; Azure AI Foundry evaluations and content safety.\n\nCommon mistakes: max reasoning effort everywhere; dropping prior reasoning items between tool calls so the model re-thinks; online calls for work that could be batched; no caching on long stable system prompts.\n\nMental model: reasoning effort is a dial on cost per correct answer. Measure it.", "resources": [{"title": "OpenAI reasoning models guide", "url": "https://platform.openai.com/docs/guides/reasoning"}, {"title": "Anthropic extended thinking", "url": "https://docs.claude.com/en/docs/build-with-claude/extended-thinking"}, {"title": "OpenAI Batch API", "url": "https://platform.openai.com/docs/guides/batch"}, {"title": "OpenAI reinforcement fine-tuning", "url": "https://platform.openai.com/docs/guides/reinforcement-fine-tuning"}, {"title": "Amazon Bedrock model evaluation", "url": "https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html"}], "project": "On 50 multi-step tasks, compare a non-reasoning model with a reasoning model at low, medium and high effort. Report accuracy, latency, total tokens and cost per correct answer. Then move an offline summarization job to a batch API and add prompt caching to the agent's system prompt, and measure the savings.", "topics": [{"id": "e-reasoning-t1", "title": "Reasoning models and test-time compute", "explainer": "Reasoning models are trained, typically with reinforcement learning on verifiable tasks, to produce long internal chains of thought before answering. More thinking tokens generally improve accuracy on hard problems, with diminishing returns. APIs expose this as reasoning effort levels or thinking token budgets. For agents, reasoning helps planning and tool selection; keep reasoning state across tool calls where the API supports it (for example, passing back reasoning items or thinking blocks) to avoid repeated thinking. Route easy requests to non-reasoning models.", "subtopics": [{"id": "e-reasoning-t1-s1", "title": "How reasoning models are trained"}, {"id": "e-reasoning-t1-s2", "title": "Reasoning effort and thinking budgets"}, {"id": "e-reasoning-t1-s3", "title": "Interleaved thinking with tools"}, {"id": "e-reasoning-t1-s4", "title": "Preserving reasoning state"}, {"id": "e-reasoning-t1-s5", "title": "Routing easy vs hard requests"}]}, {"id": "e-reasoning-t2", "title": "Stateful APIs, built-in tools, caching and batch", "explainer": "The Responses API can store conversation state server-side and run built-in tools such as web search, file search over uploaded files, code interpreter and computer use, which removes boilerplate but couples you to a vendor. Prompt caching discounts repeated prefixes, so put stable instructions and tool definitions first. Batch APIs process large offline jobs asynchronously at about half price within a 24-hour window; Bedrock batch inference is the cloud equivalent. Use streaming for user-facing latency and batch for everything that can wait.", "subtopics": [{"id": "e-reasoning-t2-s1", "title": "Responses API and stored state"}, {"id": "e-reasoning-t2-s2", "title": "Built-in web search, file search, code interpreter"}, {"id": "e-reasoning-t2-s3", "title": "Prompt caching and prefix ordering"}, {"id": "e-reasoning-t2-s4", "title": "Batch APIs and Bedrock batch inference"}, {"id": "e-reasoning-t2-s5", "title": "Streaming vs batch"}]}, {"id": "e-reasoning-t3", "title": "Vendor fine-tuning, evaluation and safety services", "explainer": "Hosted fine-tuning covers supervised fine-tuning, preference tuning and reinforcement fine-tuning, where you supply tasks and graders and the vendor runs RL on a reasoning model. Managed evaluation services (Bedrock model evaluation, Azure AI Foundry evaluations, OpenAI Evals) run LLM-as-judge and human evaluation jobs. Moderation and content safety APIs (OpenAI Moderation, Azure AI Content Safety with Prompt Shields, Bedrock Guardrails) classify harmful content and injection attempts. Use them as building blocks, while keeping your own golden sets as the source of truth.", "subtopics": [{"id": "e-reasoning-t3-s1", "title": "SFT, preference tuning, RFT"}, {"id": "e-reasoning-t3-s2", "title": "Graders for RFT"}, {"id": "e-reasoning-t3-s3", "title": "Managed evaluation jobs: Bedrock model evaluation, Azure AI Foundry"}, {"id": "e-reasoning-t3-s4", "title": "Moderation and content safety APIs"}, {"id": "e-reasoning-t3-s5", "title": "Keeping your own golden sets"}]}], "quiz": [{"q": "A model at high reasoning effort is 2% more accurate but 4x the cost on simple FAQ questions. Best action?", "choices": ["Use high effort everywhere", "Use batch for chat", "Disable caching", "Route simple questions to low effort or a non-reasoning model"], "answer": 3, "why": "Optimize cost per correct answer by routing by difficulty."}, {"q": "Where should stable instructions and tool definitions go to benefit from prompt caching?", "choices": ["In random order", "In the user message", "At the start, as a stable prefix", "At the end of the prompt"], "answer": 2, "why": "Caches match on identical prefixes."}, {"q": "Which workload fits a batch API?", "choices": ["Live voice agent", "Real-time fraud alert", "Interactive chat", "Nightly classification of 200k documents"], "answer": 3, "why": "Batch suits large, latency-tolerant offline jobs at lower price."}], "conceptIds": ["model-router"]}]}, {"id": "e-l3", "name": "L3 Advanced", "subjects": [{"id": "e-agents", "title": "Application-Level Agents", "why": "When the next step depends on the last result — and only then.", "explainer": "Start with workflows and state machines. Promote to a single tool-using agent when branching is truly model-driven. Use plan-act-observe loops with budgets. Subagents need clear contracts. Deterministic wrappers around brittle steps reduce variance.\n\nCommon mistake: a swarm for a form-fill. Another: no stop condition beyond 'model says done.'\n\nCompare agent versus workflow on evals and cost before celebrating autonomy.", "resources": [{"title": "Anthropic Building Effective Agents", "url": "https://www.anthropic.com/engineering/building-effective-agents"}, {"title": "LangChain", "url": "https://docs.langchain.com/oss/python/langchain/overview"}, {"title": "Model Context Protocol", "url": "https://modelcontextprotocol.io/"}], "project": "Replace a brittle chain with one agent plus tools and stop conditions; compare evals and cost.", "topics": [{"id": "e-agents-when", "title": "When to Agent", "subtopics": [{"id": "e-agents-when-s1", "title": "Workflow vs agent tree"}, {"id": "e-agents-when-s2", "title": "State machines first"}, {"id": "e-agents-when-s3", "title": "Single agent before swarm"}, {"id": "e-agents-when-s4", "title": "Human escalation"}, {"id": "e-agents-when-s5", "title": "Budgeting"}], "explainer": "Most problems that look like agent problems are workflows: a fixed sequence of steps with an LLM inside some of them. Workflows are cheaper, faster and easier to test. Model the task as a state machine first. Use a single tool-using agent when steps genuinely depend on intermediate results. Only reach for multiple agents when tasks are parallel or need very different contexts. Always define human escalation and step, token and dollar budgets."}, {"id": "e-agents-impl", "title": "Implementation", "subtopics": [{"id": "e-agents-impl-s1", "title": "Plan-Act-Observe"}, {"id": "e-agents-impl-s2", "title": "Scratchpads"}, {"id": "e-agents-impl-s3", "title": "Subagents"}, {"id": "e-agents-impl-s4", "title": "Deterministic wrappers"}, {"id": "e-agents-impl-s5", "title": "Idempotency"}], "explainer": "A practical agent runs plan, act, observe in a loop. A scratchpad or todo list keeps the plan visible across turns. Subagents can handle isolated subtasks with fresh context and return summaries. Wrap fragile operations in deterministic code rather than asking the model to do them. Make every side-effecting tool idempotent so a retry after a crash does not repeat work. Log the full trajectory for debugging and evals."}], "quiz": [{"q": "Prefer a workflow when…", "choices": ["Steps are known and stable", "Every step needs creative tool choice", "You have infinite budget", "Evals are impossible"], "answer": 0, "why": "Deterministic pipelines beat agents when known."}, {"q": "Before building multiple agents you should…", "choices": ["Add more agents", "Skip evals", "Try a workflow, then a single tool-using agent", "Remove budgets"], "answer": 2, "why": "Complexity should be earned by evidence."}, {"q": "A visible todo list or scratchpad in an agent helps…", "choices": ["Keep the plan coherent across many turns", "Avoid tool calls", "Encrypt data", "Lower GPU temperature"], "answer": 0, "why": "Explicit plans reduce drift."}], "conceptIds": ["agent-loop"]}, {"id": "e-prod", "title": "Production Hardening", "why": "Demos are not products.", "explainer": "Timeouts, circuit breakers, fallback models, queues, backpressure, and idempotent writes keep systems alive. Observability needs structured traces of prompts, tools, tokens, and dollars — with PII redaction. AuthN/Z on tools, output filters, dependency pinning, and spend caps are mandatory.\n\nCommon mistake: logging raw prompts to a multi-tenant sink. Another: no kill switch when a prompt change loops tools.\n\nOn-call for AI includes quality pages, not only 5xx.", "resources": [{"title": "Twelve-Factor App", "url": "https://12factor.net/"}, {"title": "OpenTelemetry", "url": "https://opentelemetry.io/docs/"}, {"title": "OWASP Top 10 for LLM Apps", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}, {"title": "Docker docs", "url": "https://docs.docker.com/"}, {"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}], "project": "Add tracing, rate limits, spend caps, and a kill switch to your LLM API app.", "topics": [{"id": "e-prod-rel", "title": "Reliability", "subtopics": [{"id": "e-prod-rel-s1", "title": "Timeouts / breakers"}, {"id": "e-prod-rel-s2", "title": "Fallback models"}, {"id": "e-prod-rel-s3", "title": "Queues and backpressure"}, {"id": "e-prod-rel-s4", "title": "Idempotent writes"}, {"id": "e-prod-rel-s5", "title": "Load shedding"}], "explainer": "Production LLM features need the reliability patterns of any distributed system. Set timeouts and circuit breakers on model calls. Configure fallback models or providers. Put async work on queues with backpressure so spikes do not cascade. Make writes idempotent. Shed low-priority load when capacity is short. Test these paths deliberately, because a provider outage is a matter of when, not if."}, {"id": "e-prod-obs", "title": "Observability", "subtopics": [{"id": "e-prod-obs-s1", "title": "Structured traces"}, {"id": "e-prod-obs-s2", "title": "Token and $ metrics"}, {"id": "e-prod-obs-s3", "title": "Quality sampling"}, {"id": "e-prod-obs-s4", "title": "Alerting on drift"}, {"id": "e-prod-obs-s5", "title": "Redacted logs"}], "explainer": "Trace every request across retrieval, model calls and tools with structured spans (OpenTelemetry GenAI conventions help). Record tokens, cost, latency and model version per span. Sample outputs for quality review. Alert on drift in quality scores, refusal rates or tokens per request, not only on errors. Redact secrets and personal data before traces are stored, since traces are a common source of leaks."}, {"id": "e-prod-sec", "title": "App Security", "subtopics": [{"id": "e-prod-sec-s1", "title": "AuthN/Z on tools"}, {"id": "e-prod-sec-s2", "title": "Output filters"}, {"id": "e-prod-sec-s3", "title": "PII redaction"}, {"id": "e-prod-sec-s4", "title": "Dependency pinning"}, {"id": "e-prod-sec-s5", "title": "Spend caps"}], "explainer": "Authorize every tool call against the end user's permissions, not the app's service account. Filter outputs for sensitive data and unsafe content before display or action. Redact PII before sending to third-party models where possible. Pin dependency and model versions to avoid supply-chain surprises. Enforce spend caps per user and per key so an abuser or a runaway loop cannot generate a five-figure bill overnight."}], "quiz": [{"q": "A kill switch should be able to…", "choices": ["Disable tools or force safe mode quickly", "Only restart Nginx", "Wipe the model weights", "Ignore audits"], "answer": 0, "why": "Operational safety needs fast containment."}, {"q": "Spend caps per user mainly guard against…", "choices": ["Abuse and runaway loops creating huge bills", "Slow DNS", "UI bugs", "Low accuracy"], "answer": 0, "why": "Hard limits contain the blast radius."}, {"q": "Tool calls should be authorized against…", "choices": ["The app's admin account", "The end user's permissions", "The model's preference", "Nobody"], "answer": 1, "why": "Otherwise the agent becomes a confused deputy."}], "conceptIds": []}, {"id": "e-ft", "title": "Fine-Tuning & Adaptation", "why": "Fine-tune when prompting and retrieval hit a ceiling.", "explainer": "SFT for format and style, LoRA/QLoRA for efficient adaptation, DPO-style preference methods when ranked feedback exists. Data quality beats quantity. Watch for catastrophic forgetting and eval before merge. Synthetic data helps if validated against held-out human gold.\n\nCommon mistake: fine-tuning to fix retrieval failures. Another: no license review on training data.\n\nKeep a decision record: why fine-tune beat better prompts.", "resources": [{"title": "LoRA: Low-Rank Adaptation", "url": "https://arxiv.org/abs/2106.09685"}, {"title": "QLoRA", "url": "https://arxiv.org/abs/2305.14314"}, {"title": "Direct Preference Optimization", "url": "https://arxiv.org/abs/2305.18290"}, {"title": "Hugging Face PEFT docs", "url": "https://huggingface.co/docs/peft/index"}, {"title": "Hugging Face TRL docs", "url": "https://huggingface.co/docs/trl/index"}], "project": "LoRA-tune a small open model on 500 curated examples; compare to prompt+RAG on the same eval.", "topics": [{"id": "e-ft-when", "title": "Decision", "subtopics": [{"id": "e-ft-when-s1", "title": "Prompt/RAG ceiling tests"}, {"id": "e-ft-when-s2", "title": "Style / format / domain gaps"}, {"id": "e-ft-when-s3", "title": "Data volume and quality"}, {"id": "e-ft-when-s4", "title": "Forgetting risk"}, {"id": "e-ft-when-s5", "title": "License constraints"}], "explainer": "Fine-tune only after prompts and retrieval hit a ceiling you can measure. Fine-tuning is good at style, format, narrow skills and making smaller models act like bigger ones; it is bad at
