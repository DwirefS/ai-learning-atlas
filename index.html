d": "i-struct-ops-s4", "title": "Client contracts"}, {"id": "i-struct-ops-s5", "title": "Observability"}], "explainer": "Grammar compilation costs time, so cache compiled schemas. Constraints can interact with prefix caching and speculative decoding in engine-specific ways. Failure modes include the model being forced into valid but wrong values, or long loops of whitespace. Agree on contracts with clients about required fields and error handling. Monitor schema violation and repair rates. Try it: log time spent compiling grammars per request; if it is large, cache compiled schemas by hash."}], "quiz": [{"q": "Constrained decoding enforces…", "choices": ["Token choices compatible with grammar/schema", "Lower electricity always", "License changes", "NCCL topology"], "answer": 0, "why": "Masked logits implement grammar."}, {"q": "Constrained decoding guarantees…", "choices": ["Lower cost", "Correct values", "Shorter outputs", "Syntactically valid output for the schema"], "answer": 3, "why": "Valid structure, not necessarily true content."}, {"q": "Grammar compilation cost is best handled by…", "choices": ["Recompiling each request", "Bigger GPUs", "Caching compiled schemas", "Disabling schemas"], "answer": 2, "why": "Repeated schemas then cost nothing to compile."}], "conceptIds": []}]}, {"id": "i-l3", "name": "L3 Advanced", "subjects": [{"id": "i-pd", "title": "Prefill/Decode Disaggregation", "why": "Long prompts stall decodes; split when justified.", "explainer": "Co-located serving couples FTL and TBT. P/D disagg separates pools, transfers KV, rate-matches capacity. Bidirectional KV helps multi-turn.\n\nCommon mistake: disaggregating low-ISL chat where co-location wins. Another: ignoring transfer bandwidth.\n\nSLA-aware planners beat static ratios.", "resources": [{"title": "DistServe Prefill/Decode Disaggregation", "url": "https://arxiv.org/abs/2401.09670"}, {"title": "vLLM disaggregated serving guide", "url": "https://blog.vllm.ai/2026/09/29/disaggregated-serving-guide.html"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "TensorRT-LLM docs", "url": "https://nvidia.github.io/TensorRT-LLM/"}], "project": "Minimal P/D split or simulation; compare TTFT/TBT under long-ISL load.", "topics": [{"id": "i-pd-why", "title": "Motivation", "subtopics": [{"id": "i-pd-why-s1", "title": "ISL/OSL asymmetry"}, {"id": "i-pd-why-s2", "title": "Piggyback interference"}, {"id": "i-pd-why-s3", "title": "SLA rate matching"}, {"id": "i-pd-why-s4", "title": "When co-locate wins"}, {"id": "i-pd-why-s5", "title": "Cost model"}], "explainer": "Prefill is compute-heavy and bursty; decode is memory-bound and steady. On shared GPUs, a large prefill stalls ongoing decodes (interference), hurting time between tokens. Disaggregation runs them on separate GPU pools sized for each phase, so you can match the prefill-to-decode ratio to your input and output lengths. It wins for long inputs and strict latency SLOs; for short prompts and small deployments, co-location is simpler and cheaper."}, {"id": "i-pd-impl", "title": "Implementation", "subtopics": [{"id": "i-pd-impl-s1", "title": "KV transfer"}, {"id": "i-pd-impl-s2", "title": "Proxy orchestration"}, {"id": "i-pd-impl-s3", "title": "Bidirectional KV"}, {"id": "i-pd-impl-s4", "title": "Capacity planning"}, {"id": "i-pd-impl-s5", "title": "Failure modes"}], "explainer": "In a disaggregated setup, a router sends a request to a prefill worker, which computes the KV cache and transfers it to a decode worker over NVLink or RDMA (NIXL, Mooncake and similar libraries do this). The proxy coordinates handoff and streaming. Capacity planning sets the ratio of prefill to decode GPUs. New failure modes include stuck KV transfers and imbalance between pools, so monitor transfer latency and queue depth on both sides."}, {"id": "i-pd-fw", "title": "Frameworks & Operations", "explainer": "Several stacks now ship disaggregated serving: vLLM and SGLang support separate prefill and decode instances with KV connectors, NVIDIA Dynamo adds KV-aware routing and the NIXL transfer library, llm-d brings it to Kubernetes, and Mooncake pioneered a KV-cache-centric design. Operating them means monitoring KV transfer latency and failures, the ratio of prefill to decode capacity, and queueing on each side. Start with co-located serving, measure interference, and move to disaggregation only when TBT SLOs demand it.", "subtopics": [{"id": "i-pd-fw-s1", "title": "vLLM / SGLang disagg modes"}, {"id": "i-pd-fw-s2", "title": "NVIDIA Dynamo and NIXL"}, {"id": "i-pd-fw-s3", "title": "llm-d on Kubernetes"}, {"id": "i-pd-fw-s4", "title": "Mooncake KV-centric design"}, {"id": "i-pd-fw-s5", "title": "Monitoring KV transfer"}]}], "quiz": [{"q": "P/D disagg targets…", "choices": ["Interference between long prefills and ongoing decodes", "Tokenizer training", "EU paperwork", "CSS"], "answer": 0, "why": "Stage separation reduces cross-SLO interference."}, {"q": "Co-located prefill and decode is usually better for…", "choices": ["Short prompts and small deployments", "Never", "Massive clusters", "Very long inputs with strict TBT"], "answer": 0, "why": "Disaggregation adds KV transfer and orchestration overhead."}, {"q": "In P/D disaggregation the KV cache is…", "choices": ["Recomputed by the decode worker", "Stored only on disk", "Transferred from prefill to decode workers", "Discarded"], "answer": 2, "why": "Transfer over NVLink/RDMA avoids recomputation."}], "conceptIds": ["prefill-decode", "pd-disagg"]}, {"id": "i-dist", "title": "Distributed Inference Parallelism", "why": "Bigger than one GPU needs a plan.", "explainer": "Tensor, pipeline, expert (MoE), sequence/context parallelism. NCCL, NVLink/NVSwitch, IB/RoCE, overlap decide scale-out value.\n\nCommon mistake: TP across nodes without bandwidth. Another: EP without load-balance monitors.\n\nNCCL tests are bring-up.", "resources": [{"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "NCCL user guide", "url": "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/overview.html"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}, {"title": "TensorRT-LLM docs", "url": "https://nvidia.github.io/TensorRT-LLM/"}, {"title": "Mixture of Experts (Shazeer et al.)", "url": "https://arxiv.org/abs/1701.06538"}], "project": "Serve TP=2 and TP=4; explain bottlenecks; note when PP/EP helps.", "topics": [{"id": "i-dist-types", "title": "Types", "subtopics": [{"id": "i-dist-types-s1", "title": "Tensor parallel"}, {"id": "i-dist-types-s2", "title": "Pipeline parallel"}, {"id": "i-dist-types-s3", "title": "Expert parallel"}, {"id": "i-dist-types-s4", "title": "Sequence/context parallel"}, {"id": "i-dist-types-s5", "title": "Combined"}], "explainer": "When a model does not fit on one GPU, split it. Tensor parallelism splits each layer's matrices across GPUs and needs fast all-reduce, so keep it within an NVLink domain. Pipeline parallelism assigns layers to stages, tolerating slower links but adding bubbles. Expert parallelism places MoE experts on different GPUs with all-to-all routing. Sequence or context parallelism splits very long sequences. Large deployments combine them."}, {"id": "i-dist-comm", "title": "Communication", "subtopics": [{"id": "i-dist-comm-s1", "title": "NCCL collectives"}, {"id": "i-dist-comm-s2", "title": "NVLink/NVSwitch"}, {"id": "i-dist-comm-s3", "title": "InfiniBand/RoCE"}, {"id": "i-dist-comm-s4", "title": "Overlap"}, {"id": "i-dist-comm-s5", "title": "Topology awareness"}], "explainer": "Distributed inference lives or dies on communication. NCCL provides collectives such as all-reduce and all-to-all. NVLink and NVSwitch give hundreds of GB/s inside a node or rack; InfiniBand or RoCE connect nodes at lower bandwidth. Good engines overlap communication with compute. Place tensor-parallel groups inside the fastest domain and check the topology with nvidia-smi topo -m before blaming the model."}], "quiz": [{"q": "Tensor parallelism shards…", "choices": ["Matmuls across GPUs for one replica", "Unrelated models only", "Only tokenizer", "Only audit log"], "answer": 0, "why": "TP splits layer math."}, {"q": "Pipeline parallelism tolerates slower links but adds…", "choices": ["Larger vocabularies", "Pipeline bubbles", "No communication", "More memory per GPU"], "answer": 1, "why": "Stages idle while waiting for micro-batches."}, {"q": "Expert parallelism mainly generates which collective?", "choices": ["All-reduce", "None", "Broadcast only", "All-to-all"], "answer": 3, "why": "Tokens are dispatched to experts on other GPUs and gathered back."}], "conceptIds": ["parallelism", "nvlink-ib", "nccl-collectives", "moe-routing"]}, {"id": "i-lora-serve", "title": "Multi-LoRA & Adapter Serving", "why": "Many customers, one base.", "explainer": "Multi-LoRA batching hosts many adapters with request routing. Memory, hot-swap, noisy-neighbor need policy.\n\nCommon mistake: thousands of cold adapters in GPU memory. Another: no tenant rate isolation.\n\nAdapters are first-class deployables.", "resources": [{"title": "LoRA: Low-Rank Adaptation", "url": "https://arxiv.org/abs/2106.09685"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "Hugging Face PEFT docs", "url": "https://huggingface.co/docs/peft/index"}, {"title": "SGLang documentation", "url": "https://docs.sglang.io/"}], "project": "Serve two LoRAs on one vLLM; measure switch overhead and isolation.", "topics": [{"id": "i-lora-mem", "title": "Memory & Routing", "subtopics": [{"id": "i-lora-mem-s1", "title": "Adapter footprints"}, {"id": "i-lora-mem-s2", "title": "Request routing"}, {"id": "i-lora-mem-s3", "title": "Hot vs cold"}, {"id": "i-lora-mem-s4", "title": "Quantized adapters"}, {"id": "i-lora-mem-s5", "title": "Batching constraints"}], "explainer": "Multi-LoRA serving keeps one base model in memory and loads many small adapters. Adapters are megabytes to hundreds of megabytes each. The router sends each request to a server that has its adapter loaded; hot adapters stay in GPU memory, cold ones live in CPU or disk. Kernels such as Punica and S-LoRA batch requests with different adapters together. Quantized adapters save more memory."}, {"id": "i-lora-ops", "title": "Ops", "subtopics": [{"id": "i-lora-ops-s1", "title": "Versioning"}, {"id": "i-lora-ops-s2", "title": "Canary"}, {"id": "i-lora-ops-s3", "title": "Noisy neighbor"}, {"id": "i-lora-ops-s4", "title": "Rollback"}, {"id": "i-lora-ops-s5", "title": "Per-adapter obs"}], "explainer": "Treat adapters as deployable artifacts with versions. Canary new adapters on a slice of traffic. A heavily used adapter can starve others, so enforce fairness. Keep rollback instant by retaining the previous version. Emit metrics per adapter (latency, errors, quality) so tenant-specific problems are visible. A useful rule: an adapter is a release, not a file. Give it a version, an owner, an eval report and a rollback path. Try it: serve two adapters on one base model and route by request header, watching latency per adapter."}], "quiz": [{"q": "Multi-LoRA aims to…", "choices": ["Host many adapters on one base engine", "Train foundations nightly", "Replace networking", "Eliminate evals"], "answer": 0, "why": "Specialization without full replicas."}, {"q": "Multi-LoRA serving keeps…", "choices": ["Only adapters", "One full model per adapter", "One base model plus many small adapters", "Only CPU copies"], "answer": 2, "why": "Adapters share the base weights."}, {"q": "Cold adapters typically live in…", "choices": ["HBM always", "CPU memory or disk until requested", "The client", "The tokenizer"], "answer": 1, "why": "Hot ones are promoted to GPU memory."}], "conceptIds": ["lora"]}, {"id": "i-coldstart", "title": "Weight Loading & Cold Start", "why": "Autoscaling LLMs fails if a new replica takes ten minutes to become ready.", "explainer": "A new replica must get a node, pull an image, load tens to hundreds of GB of weights, initialize the engine and warm up. Each step can be measured and shortened. This subject covers where time goes, fast loading techniques, and how to choose between always-on, warm pools and scale-to-zero per model.\n\nCommon mistakes: pulling weights from object storage on every start; huge images with weights baked in and no layer caching; autoscaling on signals that react too late for a minutes-long cold start.", "resources": [{"title": "vLLM Run:ai Model Streamer", "url": "https://docs.vllm.ai/en/latest/models/extensions/runai_model_streamer.html"}, {"title": "safetensors docs", "url": "https://huggingface.co/docs/safetensors/index"}, {"title": "Knative scale to zero", "url": "https://knative.dev/docs/serving/autoscaling/scale-to-zero/"}, {"title": "KServe docs", "url": "https://kserve.github.io/website/"}], "project": "Measure each cold-start phase for a 7B-70B model: node ready, image pull, weight load (object store vs local NVMe vs streamer), engine init, first token. Then cut total time by at least half and document which change mattered most.", "topics": [{"id": "i-cs-where", "title": "Where the Time Goes", "explainer": "Break cold start into phases and time each: node provisioning (cloud can take minutes), image pull (CUDA images are often 10+ GB), weight download and load into GPU memory (model bytes ÷ bandwidth), engine initialization (KV cache allocation, CUDA graph capture, kernel compilation such as torch.compile), and warmup requests. Without measurement, teams optimize the wrong phase. Log timestamps for each phase on every start and keep the distribution, not just one run.", "subtopics": [{"id": "i-cs-where-s1", "title": "Node provisioning"}, {"id": "i-cs-where-s2", "title": "Image pull"}, {"id": "i-cs-where-s3", "title": "Weight transfer and load"}, {"id": "i-cs-where-s4", "title": "Engine init and CUDA graphs"}, {"id": "i-cs-where-s5", "title": "Phase-level timing"}]}, {"id": "i-cs-fast", "title": "Fast Loading Techniques", "explainer": "Shorten the big phases. Keep weights on node-local NVMe or a shared high-throughput cache rather than object storage. Use safetensors so tensors can be memory-mapped and streamed. Stream tensors concurrently straight to GPU memory. Pre-shard checkpoints to your tensor-parallel layout so each GPU reads only its slice. Keep images slim and pre-pulled on nodes; use lazy-loading image formats. Cache compiled artifacts (CUDA graphs, compile caches) where your engine supports it.", "subtopics": [{"id": "i-cs-fast-s1", "title": "Local NVMe and caches"}, {"id": "i-cs-fast-s2", "title": "safetensors and mmap"}, {"id": "i-cs-fast-s3", "title": "Parallel streaming to GPU"}, {"id": "i-cs-fast-s4", "title": "Pre-sharded checkpoints"}, {"id": "i-cs-fast-s5", "title": "Image slimming and pre-pull"}]}, {"id": "i-cs-policy", "title": "Scale-to-Zero vs Warm Pools", "explainer": "Every model needs a readiness policy. Hot models stay always-on with headroom. Warm models keep a small pool of ready replicas and scale out from there. Cold models scale to zero and accept a first-request delay, shown honestly in the UI. Scale on leading signals (queue depth, request rate trends) and pre-scale for known peaks. For multi-model platforms, multiplex many rarely used models or LoRA adapters on shared replicas instead of dedicating GPUs to each.", "subtopics": [{"id": "i-cs-policy-s1", "title": "Hot / warm / cold tiers"}, {"id": "i-cs-policy-s2", "title": "Leading autoscale signals"}, {"id": "i-cs-policy-s3", "title": "Scheduled pre-scaling"}, {"id": "i-cs-policy-s4", "title": "Model multiplexing"}, {"id": "i-cs-policy-s5", "title": "User-facing loading states"}]}], "quiz": [{"q": "Time to load 140 GB of weights at 7 GB/s is about…", "choices": ["20 s", "200 s", "2,000 s", "2 s"], "answer": 0, "why": "140 ÷ 7 = 20 seconds."}, {"q": "Pre-sharding checkpoints to the TP layout helps because…", "choices": ["It shrinks the model", "It improves accuracy", "Each GPU reads only its slice", "It removes CUDA"], "answer": 2, "why": "Less data per GPU, loaded in parallel."}, {"q": "Scale-to-zero is a good fit for…", "choices": ["Rarely used models where a first-request delay is acceptable", "Your busiest model", "Training", "Strict-SLO chat"], "answer": 0, "why": "Savings outweigh occasional cold starts."}, {"q": "Why is safetensors faster to load than pickle checkpoints?", "choices": ["It is compressed", "It skips weights", "It uses CPUs", "It can be memory-mapped without code execution"], "answer": 3, "why": "Raw tensor layout enables zero-copy mapping."}], "conceptIds": ["cold-start"]}, {"id": "i-gateway", "title": "LLM Gateways & Inference Routing", "why": "Routing decides cost, latency and resilience before a single token is generated.", "explainer": "Gateways give every app one endpoint with keys, budgets, policy and traces, and route across providers, models and replicas. Inside a self-hosted fleet, KV- and prefix-aware routing can cut prefill work dramatically. This subject covers gateway functions, endpoint picking, and multi-model policies.\n\nCommon mistakes: round-robin across LLM replicas; fallbacks to models never evaluated with your prompts; gateways without per-tenant budgets.", "resources": [{"title": "Gateway API Inference Extension", "url": "https://gateway-api-inference-extension.sigs.k8s.io/"}, {"title": "LiteLLM docs", "url": "https://docs.litellm.ai/docs/"}, {"title": "Envoy AI Gateway", "url": "https://aigateway.envoyproxy.io/"}, {"title": "llm-d", "url": "https://llm-d.ai/"}, {"title": "NVIDIA Dynamo (GitHub)", "url": "https://github.com/ai-dynamo/dynamo"}], "project": "Put LiteLLM or Envoy AI Gateway in front of two self-hosted replicas and one external provider. Add per-team budgets and a fallback. Then compare round-robin against prefix-aware routing on a workload with a shared 4k-token system prompt, measuring TTFT and GPU prefill time.", "topics": [{"id": "i-gw-func", "title": "Gateway Functions", "explainer": "A production gateway terminates auth, maps virtual keys to provider keys, enforces rate limits and budgets per team, normalizes request formats, runs policy hooks (PII redaction, injection screening, content rules), applies retries, fallbacks and hedging, and emits traces with tokens and cost. It is also where you implement model aliases ('support-default' points to a specific model version) so apps never hard-code model names.", "subtopics": [{"id": "i-gw-func-s1", "title": "Virtual keys and budgets"}, {"id": "i-gw-func-s2", "title": "Format normalization"}, {"id": "i-gw-func-s3", "title": "Policy hooks"}, {"id": "i-gw-func-s4", "title": "Retries, fallbacks, hedging"}, {"id": "i-gw-func-s5", "title": "Model aliases"}]}, {"id": "i-gw-route", "title": "KV- and Prefix-Aware Routing", "explainer": "LLM replicas are stateful: each holds a KV cache. A smart endpoint picker scores replicas on queue length, KV utilization, loaded LoRA adapters and prefix-cache affinity, sending requests that share a prefix to the replica that already cached it. This avoids recomputing long system prompts and documents. Balance affinity with load to avoid hot spots. The Kubernetes Gateway API Inference Extension standardizes this pattern; llm-d and Dynamo implement it with cache-aware schedulers.", "subtopics": [{"id": "i-gw-route-s1", "title": "Why round-robin fails"}, {"id": "i-gw-route-s2", "title": "Queue and KV-based scoring"}, {"id": "i-gw-route-s3", "title": "Prefix-cache affinity"}, {"id": "i-gw-route-s4", "title": "LoRA-aware routing"}, {"id": "i-gw-route-s5", "title": "Hot-spot balancing"}]}, {"id": "i-gw-policy", "title": "Multi-Model & Multi-Provider Policy", "explainer": "Routing policy decides which model serves a request: by tier, task, cost budget, region or a learned difficulty score. Fallback chains handle provider outages and rate limits. Every target in a chain must be evaluated with your prompts, or failover silently lowers quality. Log the routing decision with each request so cost and quality can be attributed. Review policies regularly as prices and models change.", "subtopics": [{"id": "i-gw-policy-s1", "title": "Tier and task routing"}, {"id": "i-gw-policy-s2", "title": "Fallback chains"}, {"id": "i-gw-policy-s3", "title": "Eval parity for fallbacks"}, {"id": "i-gw-policy-s4", "title": "Routing decision logs"}, {"id": "i-gw-policy-s5", "title": "Policy reviews"}]}, {"id": "i-gateway-x1", "title": "Kubernetes Gateway API Inference Extension and llm-d", "explainer": "The Kubernetes Gateway API Inference Extension adds model-aware routing to standard gateways: an InferencePool groups model-server pods, and an endpoint picker chooses a pod using live signals such as queue depth, KV-cache utilization and loaded LoRA adapters. llm-d builds on vLLM and this extension for distributed inference on Kubernetes, adding prefix-cache-aware routing, disaggregated prefill and decode, and KV cache offloading. Databricks AI Gateway and similar products provide the higher-level policy layer.", "subtopics": [{"id": "i-gateway-x1-s1", "title": "InferencePool and endpoint picker"}, {"id": "i-gateway-x1-s2", "title": "Queue- and KV-aware scheduling"}, {"id": "i-gateway-x1-s3", "title": "llm-d architecture"}, {"id": "i-gateway-x1-s4", "title": "KV cache offloading"}, {"id": "i-gateway-x1-s5", "title": "Policy gateways (Databricks AI Gateway) vs inference routers"}]}], "quiz": [{"q": "Prefix-aware routing saves mainly…", "choices": ["Disk space", "Network egress", "Output tokens", "Prefill compute for shared prompt prefixes"], "answer": 3, "why": "Cached KV for the prefix is reused."}, {"q": "Model aliases in a gateway let you…", "choices": ["Skip auth", "Hide costs", "Swap the underlying model without app changes", "Train models"], "answer": 2, "why": "Apps call a stable name."}, {"q": "A fallback model that was never evaluated with your prompts risks…", "choices": ["Silent quality drops during failover", "Lower cost always", "Nothing", "Higher uptime"], "answer": 0, "why": "Prompts tuned for one model may fail on another."}, {"q": "Why is round-robin a poor fit for LLM replicas?", "choices": ["It ignores KV state, queue depth and cached prefixes", "It is too complex", "It needs GPUs", "It breaks TLS"], "answer": 0, "why": "Replicas are stateful and unevenly loaded."}], "conceptIds": ["llm-gateway-routing", "model-router"]}]}, {"id": "i-l4", "name": "L4 Expert", "subjects": [{"id": "i-kernel", "title": "GPU Kernels & Attention Impls", "why": "Profiles and sometimes Triton.", "explainer": "FlashAttention IO-aware algorithm, GQA/MQA paths, paged kernels, MLA variants. Nsight, Triton, CUDA graphs, torch.compile.\n\nCommon mistake: 'faster' kernels ignoring numerics. Another: microbenchmarks that vanish under continuous batching.\n\nRead the profile first.", "resources": [{"title": "FlashAttention", "url": "https://arxiv.org/abs/2205.14135"}, {"title": "FlashAttention-2", "url": "https://arxiv.org/abs/2307.08691"}, {"title": "FlashAttention GitHub", "url": "https://github.com/Dao-AILab/flash-attention"}, {"title": "Triton language", "url": "https://triton-lang.org/"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}], "project": "Profile attention; write small Triton fused op; compare to PyTorch.", "topics": [{"id": "i-kern-attn", "title": "Attention Kernels", "subtopics": [{"id": "i-kern-attn-s1", "title": "FlashAttention IO awareness"}, {"id": "i-kern-attn-s2", "title": "GQA/MQA paths"}, {"id": "i-kern-attn-s3", "title": "Paged kernels"}, {"id": "i-kern-attn-s4", "title": "MLA variants"}, {"id": "i-kern-attn-s5", "title": "Numeric modes"}], "explainer": "FlashAttention computes attention in tiles that stay in fast on-chip SRAM, avoiding writing the huge score matrix to HBM; it is exact, just IO-aware. GQA and MQA kernels exploit shared KV heads. Paged attention kernels read KV from scattered blocks. MLA variants decompress latent KV on the fly. Numeric modes (BF16, FP8) change speed and accuracy, and newer GPUs add special instructions for them."}, {"id": "i-kern-tool", "title": "Tooling", "subtopics": [{"id": "i-kern-tool-s1", "title": "Nsight"}, {"id": "i-kern-tool-s2", "title": "Triton"}, {"id": "i-kern-tool-s3", "title": "CUDA graphs"}, {"id": "i-kern-tool-s4", "title": "torch.compile"}, {"id": "i-kern-tool-s5", "title": "Roofline"}], "explainer": "Profile before optimizing. Nsight Systems shows the timeline of kernels, copies and gaps; Nsight Compute digs into one kernel. Triton lets you write custom GPU kernels in Python. CUDA graphs remove CPU launch overhead, which matters a lot in decode. torch.compile fuses operations automatically. The roofline model tells you whether a kernel is limited by compute or memory bandwidth, and therefore which optimization can help."}], "quiz": [{"q": "FlashAttention mainly reduces…", "choices": ["HBM traffic for attention", "Need for positions", "Dataset size", "HTTP codes"], "answer": 0, "why": "IO-aware tiling cuts HBM trips."}, {"q": "CUDA graphs mainly reduce…", "choices": ["CPU kernel-launch overhead", "Network latency", "Model size", "HBM usage"], "answer": 0, "why": "Replaying captured graphs avoids per-kernel launch cost, important in decode."}, {"q": "The roofline model tells you whether a kernel is…", "choices": ["Deterministic", "Compute-bound or memory-bound", "Licensed", "Correct"], "answer": 1, "why": "That decides which optimizations can help."}], "conceptIds": ["flash-attn"]}, {"id": "i-slo", "title": "Capacity Planning & SLO Engineering", "why": "Inference is SRE with GPUs.", "explainer": "Load shapes, concurrency vs batch, autoscale signals, warm pools, admission control, shedding, fallbacks, priority lanes.\n\nCommon mistake: autoscaling on CPU while GPUs bottleneck. Another: no overload playbook.\n\nWrite runbooks while calm.", "resources": [{"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "vLLM disaggregated serving guide", "url": "https://blog.vllm.ai/2026/09/29/disaggregated-serving-guide.html"}], "project": "Size GPUs for a latency SLO with headroom; write overload runbook.", "topics": [{"id": "i-slo-plan", "title": "Planning", "subtopics": [{"id": "i-slo-plan-s1", "title": "Load shapes"}, {"id": "i-slo-plan-s2", "title": "Concurrency vs batch"}, {"id": "i-slo-plan-s3", "title": "Autoscale signals"}, {"id": "i-slo-plan-s4", "title": "Warm pools"}, {"id": "i-slo-plan-s5", "title": "Headroom"}], "explainer": "Capacity planning starts with load shape: requests per second, input and output lengths, and how bursty traffic is. Concurrency is not batch size; many concurrent users can be served by continuous batching on few GPUs until KV memory runs out. Autoscale on queue depth or tokens in flight, not CPU. Keep warm pools because cold starts on GPUs take minutes. Hold headroom for spikes and failures."}, {"id": "i-slo-deg", "title": "Degradation", "subtopics": [{"id": "i-slo-deg-s1", "title": "Admission control"}, {"id": "i-slo-deg-s2", "title": "Shed non-critical"}, {"id": "i-slo-deg-s3", "title": "Fallback model"}, {"id": "i-slo-deg-s4", "title": "Priority lanes"}, {"id": "i-slo-deg-s5", "title": "Incident comms"}], "explainer": "When demand exceeds capacity, degrade on purpose. Admission control rejects or queues requests before they hurt everyone. Shed non-critical traffic such as batch jobs first. Fall back to a smaller model for some tiers. Use priority lanes so paying or interactive users keep their SLOs. Communicate clearly during incidents, including status pages, because silent slowness erodes trust faster than an honest message."}], "quiz": [{"q": "Goodput emphasizes…", "choices": ["Useful successful tokens under SLO", "Only peak FLOPs", "Only disk IOPS", "Only marketing QPS"], "answer": 0, "why": "SLO-compliant useful work."}, {"q": "GPU serving should autoscale on…", "choices": ["CPU utilization", "Queue depth or tokens in flight", "Time of day only", "Disk IO"], "answer": 1, "why": "CPU barely moves when GPUs saturate."}, {"q": "Warm pools exist because…", "choices": ["They improve accuracy", "GPUs are free", "GPU cold starts (node + image + weights) take minutes", "Regulations"], "answer": 2, "why": "Spikes cannot wait for cold capacity."}], "conceptIds": ["cost-model", "cost-per-token", "cold-start"]}]}, {"id": "i-l5", "name": "L5 Frontier", "subjects": [{"id": "i-hw", "title": "Next-Gen Hardware & Memory Systems", "why": "GB200-class and offload change designs.", "explainer": "Blackwell/GB200, AMD MI300/ROCm, hybrid CPU+GPU, other accelerators, HBM limits, KV offload, CXL, multi-host KV.\n\nCommon mistake: interconnect-light hardware for heavy TP/EP. Another: ignoring power/cooling in BOM.\n\nBriefs tied to traffic mix.", "resources": [{"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}, {"title": "NCCL user guide", "url": "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/overview.html"}, {"title": "TensorRT-LLM docs", "url": "https://nvidia.github.io/TensorRT-LLM/"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}], "project": "Design brief: NVLink-heavy vs many smaller GPUs for your ISL/OSL mix.", "topics": [{"id": "i-hw-plat", "title": "Platforms", "subtopics": [{"id": "i-hw-plat-s1", "title": "Blackwell/GB200 class"}, {"id": "i-hw-plat-s2", "title": "AMD ROCm"}, {"id": "i-hw-plat-s3", "title": "CPU+GPU hybrid"}, {"id": "i-hw-plat-s4", "title": "Other accelerators"}, {"id": "i-hw-plat-s5", "title": "Power envelopes"}], "explainer": "Hardware sets serving economics. NVIDIA Blackwell and GB200 NVL72 racks connect 72 GPUs in one NVLink domain, ideal for big MoE models. AMD Instinct GPUs with ROCm offer large HBM and are supported by major engines. CPU-plus-GPU superchips share memory coherently. Other accelerators (TPUs, Trainium, Gaudi, inference ASICs) can be cheaper for supported models. Power per rack is now a first-class constraint."}, {"id": "i-hw-mem", "title": "Memory", "subtopics": [{"id": "i-hw-mem-s1", "title": "HBM capacity/bandwidth"}, {"id": "i-hw-mem-s2", "title": "KV offload"}, {"id": "i-hw-mem-s3", "title": "CXL pools"}, {"id": "i-hw-mem-s4", "title": "Multi-host KV"}, {"id": "i-hw-mem-s5", "title": "Failure domains"}], "explainer": "HBM capacity decides how many sequences and how much context fit; HBM bandwidth decides decode speed. KV offload to CPU or NVMe and CXL memory pools extend capacity. Multi-host KV stores let any server reuse cached prefixes. Each extra tier adds latency and new failure domains, so measure hit rates before adding complexity. Try it: compute how many 8k-token sequences fit in the KV budget of your GPU, then compare with what the engine logs at startup."}], "quiz": [{"q": "Heavy TP across nodes needs…", "choices": ["High-bandwidth low-latency interconnect", "Only cheap gigabit always", "No NCCL", "No evaluation"], "answer": 0, "why": "Collectives demand fabric."}, {"q": "HBM bandwidth mostly determines…", "choices": ["Tokenizer speed", "Decode tokens per second", "Training data size", "Disk throughput"], "answer": 1, "why": "Decode re-reads weights each step."}, {"q": "A GB200 NVL72 rack is notable for…", "choices": ["72 GPUs in one NVLink domain", "Air cooling only", "No HBM", "CPU-only inference"], "answer": 0, "why": "Large NVLink domains suit big TP and MoE."}], "conceptIds": ["nvlink-ib"]}, {"id": "i-research", "title": "Inference Research Watchlist", "why": "Papers become engine features fast.", "explainer": "Better speculation, learned schedulers, cross-request memory, energy-aware serving, MoE placement. Follow MLSys and engine roadmaps.\n\nCommon mistake: adopting a paper before the bottleneck matches. Another: never revisiting quarterly.\n\nTag reading: try/watch/ignore.", "resources": [{"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}, {"title": "SGLang documentation", "url": "https://docs.sglang.io/"}, {"title": "PagedAttention / Efficient LLM Serving", "url": "https://arxiv.org/abs/2309.06180"}, {"title": "DistServe Prefill/Decode Disaggregation", "url": "https://arxiv.org/abs/2401.09670"}, {"title": "Speculative Decoding (Leviathan et al.)", "url": "https://arxiv.org/abs/2211.17192"}], "project": "Pick one recent inference paper; reproduce a figure or toy the idea.", "topics": [{"id": "i-res-topics", "title": "Active Topics", "subtopics": [{"id": "i-res-topics-s1", "title": "Better speculation"}, {"id": "i-res-topics-s2", "title": "Learned schedulers"}, {"id": "i-res-topics-s3", "title": "Cross-request KV"}, {"id": "i-res-topics-s4", "title": "Energy-aware serving"}, {"id": "i-res-topics-s5", "title": "MoE placement"}, {"id": "i-res-topics-s6", "title": "Disagg variants"}], "explainer": "Inference research moves monthly. Watch better speculation methods, learned schedulers that predict output length, cross-request KV sharing at cluster scale, energy-aware serving that trades a little latency for power, smarter MoE expert placement, and new variants of disaggregation. Before adopting a paper, check whether the gains hold at your batch sizes, models and hardware, and whether a maintained engine already implements it."}], "quiz": [{"q": "Before adopting a paper…", "choices": ["Confirm it targets your measured bottleneck", "Always rewrite CUDA", "Delete evals", "Ignore ISL/OSL"], "answer": 0, "why": "Bottleneck fit first."}, {"q": "A paper's speedup may not transfer if…", "choices": ["It is recent", "Your batch sizes, models or hardware differ", "It used your exact setup", "It has code"], "answer": 1, "why": "Gains are often regime-specific."}, {"q": "Learned schedulers try to predict…", "choices": ["Output length or cost of requests", "Token prices", "User names", "GPU temperatures"], "answer": 0, "why": "Better length estimates improve batching and fairness."}], "conceptIds": []}]}]}, {"id": "infra", "name": "AI Infrastructure", "icon": "server", "role": "Owns GPU platform: clusters, scheduling, storage, networking, observability, cloud. Differs from Inference (engines) and Architect (solution design).", "levels": [{"id": "f-l1", "name": "L1 Foundations", "subjects": [{"id": "f-gpu", "title": "GPU Architecture Literacy", "why": "Schedule devices you understand.", "explainer": "SMs, HBM, L2, Tensor Cores, numeric formats, MIG/MPS, power/thermals. Drivers, CUDA/ROCm, container toolkits.\n\nCommon mistake: GPU util without HBM/SM clocks. Another: CUDA version skew across nodes.\n\nnvidia-smi and DCGM are literacy.", "resources": [{"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}, {"title": "NVIDIA GPU Operator", "url": "https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html"}, {"title": "NCCL user guide", "url": "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/overview.html"}], "project": "Collect metrics under idle/prefill/decode loads; explain differences.", "topics": [{"id": "f-gpu-hw", "title": "Hardware", "subtopics": [{"id": "f-gpu-hw-s1", "title": "SMs, HBM, L2"}, {"id": "f-gpu-hw-s2", "title": "Numeric formats / Tensor Cores"}, {"id": "f-gpu-hw-s3", "title": "MIG / MPS"}, {"id": "f-gpu-hw-s4", "title": "Power and thermals"}, {"id": "f-gpu-hw-s5", "title": "Failure modes"}], "explainer": "A GPU is many streaming multiprocessors (SMs) sharing an L2 cache and high-bandwidth memory (HBM). Tensor Cores do the matrix math, fastest in low-precision formats such as BF16, FP8 and FP4. HBM size limits what fits; HBM bandwidth limits decode speed. MIG splits one GPU into isolated slices; MPS lets processes share SMs concurrently. GPUs throttle when hot or power-capped, so clocks matter as much as utilization. Learn the failure modes too: ECC errors, fallen-off-the-bus events, and NVLink errors."}, {"id": "f-gpu-sw", "title": "Software", "subtopics": [{"id": "f-gpu-sw-s1", "title": "CUDA / ROCm drivers"}, {"id": "f-gpu-sw-s2", "title": "cuDNN / NCCL"}, {"id": "f-gpu-sw-s3", "title": "Container toolkit"}, {"id": "f-gpu-sw-s4", "title": "Multi-GPU visibility"}, {"id": "f-gpu-sw-s5", "title": "Version skew"}], "explainer": "The software stack goes kernel driver, CUDA (or ROCm) runtime, libraries such as cuDNN, cuBLAS and NCCL, then frameworks. The NVIDIA Container Toolkit exposes GPUs to containers. CUDA_VISIBLE_DEVICES controls which GPUs a process sees. The classic production bug is version skew: a container built for a newer CUDA than the node's driver supports, or different driver versions across nodes in one training job. Pin and inventory versions everywhere."}], "quiz": [{"q": "HBM bandwidth most constrains…", "choices": ["Decode-heavy LLM serving", "Tiny compute-bound matmuls always", "DNS", "CSS"], "answer": 0, "why": "Decode streams weights/KV from HBM."}, {"q": "MIG differs from MPS in that MIG…", "choices": ["Partitions the GPU into hardware-isolated slices", "Shares SMs without isolation", "Disables HBM", "Only works on CPUs"], "answer": 0, "why": "MIG gives dedicated SMs, memory and cache per slice."}, {"q": "A container built for a newer CUDA than the node driver supports will…", "choices": ["Run faster", "Use the CPU silently always", "Auto-upgrade the driver", "Likely fail to initialize CUDA"], "answer": 3, "why": "Driver and userspace must be compatible."}], "conceptIds": ["gpu-memory"]}, {"id": "f-k8s", "title": "Kubernetes for Accelerators", "why": "K8s + device plugins is the default platform.", "explainer": "Device plugins, GPU Operator, quotas, taints/affinities, DRA. Jobs vs Deployments vs Ray. Model pull init containers; PVC vs NVMe; pod security.\n\nCommon mistake: YAML asks for 1 GPU, runtime sees 0. Another: no split between train and serve nodes.\n\nGolden images beat snowflakes.", "resources": [{"title": "Kubernetes Device Plugins", "url": "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/device-plugins/"}, {"title": "NVIDIA GPU Operator", "url": "https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html"}, {"title": "K8s scheduling", "url": "https://kubernetes.io/docs/concepts/scheduling-eviction/"}, {"title": "Ray docs", "url": "https://docs.ray.io/en/latest/"}], "project": "Stand up GPU Operator path; schedule a CUDA job with resource requests.", "topics": [{"id": "f-k8s-dev", "title": "Devices", "subtopics": [{"id": "f-k8s-dev-s1", "title": "Device plugins"}, {"id": "f-k8s-dev-s2", "title": "GPU Operator"}, {"id": "f-k8s-dev-s3", "title": "Quotas"}, {"id": "f-k8s-dev-s4", "title": "Taints / affinity"}, {"id": "f-k8s-dev-s5", "title": "DRA awareness"}], "explainer": "Kubernetes sees GPUs through device plugins that advertise resources like nvidia.com/gpu. The NVIDIA GPU Operator installs and manages the driver, container toolkit, device plugin, DCGM exporter, MIG manager and feature discovery as one unit. Use ResourceQuotas to cap GPUs per namespace, and taints plus node affinity to keep non-GPU pods off expensive nodes. Dynamic Resource Allocation (DRA) is the newer API for richer device requests."}, {"id": "f-k8s-work", "title": "Workloads", "subtopics": [{"id": "f-k8s-work-s1", "title": "Deployments vs Jobs vs Ray"}, {"id": "f-k8s-work-s2", "title": "Init model pulls"}, {"id": "f-k8s-work-s3", "title": "EmptyDir vs PVC"}, {"id": "f-k8s-work-s4", "title": "Pod security"}, {"id": "f-k8s-work-s5", "title": "Priority classes"}], "explainer": "Training fits Jobs (or JobSet, Kubeflow Training Operator, or Ray via KubeRay); serving fits Deployments behind autoscalers. Model weights are large, so pull them with init containers or sidecars, or mount a shared volume or cache to avoid every pod downloading 100 GB. EmptyDir on local NVMe is fast scratch; PVCs persist. Apply pod security standards even to GPU workloads, and use PriorityClasses so production serving can preempt experiments."}, {"id": "f-k8s-ops", "title": "Day-2 GPU Cluster Ops", "explainer": "Running GPU clusters day to day means planned driver upgrades with drains, node health checks before scheduling, labeling nodes by GPU model and health, autoscaling node pools, and keeping spare capacity for failures. Track allocatable versus used GPUs per namespace to spot waste. Keep runbooks for stuck pods holding GPUs and for nodes whose device plugin stopped advertising devices. Most outages here are slow leaks, not explosions.", "subtopics": [{"id": "f-k8s-ops-s1", "title": "Driver upgrade drains"}, {"id": "f-k8s-ops-s2", "title": "Health-gated scheduling"}, {"id": "f-k8s-ops-s3", "title": "Allocatable vs used tracking"}, {"id": "f-k8s-ops-s4", "title": "Node pool autoscaling"}, {"id": "f-k8s-ops-s5", "title": "Stuck GPU pod runbooks"}]}], "quiz": [{"q": "GPU Operator primarily…", "choices": ["Manages NVIDIA drivers/tooling on K8s", "Trains LLMs alone", "Replaces etcd", "Is a vector DB"], "answer": 0, "why": "Operator manages GPU software lifecycle."}, {"q": "Taints on GPU nodes are used to…", "choices": ["Speed up GPUs", "Encrypt traffic", "Keep non-GPU pods off expensive nodes", "Enable MIG"], "answer": 2, "why": "Only pods tolerating the taint schedule there."}, {"q": "Init containers or node caches for model weights avoid…", "choices": ["Every pod downloading huge weights on start", "DNS", "Logging", "Pod security"], "answer": 0, "why": "Weight pulls dominate cold start."}], "conceptIds": ["k8s-gpu", "gpu-sharing"]}, {"id": "f-linux", "title": "Linux, Containers & Driver Ops", "why": "The layer that pages you.", "explainer": "cgroups, hugepages, IOMMU, persistence mode, fabric manager, runtime hooks, secure base images. Debug 'GPU not found' in five minutes.\n\nCommon mistake: upgrading driver under pinned CUDA userspace. Another: writable root + host GPU in multi-tenant clusters.\n\nExact-command runbooks.", "resources": [{"title": "Docker docs", "url": "https://docs.docker.com/"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}, {"title": "NVIDIA GPU Operator", "url": "https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html"}], "project": "Runbook: diagnose/fix node that lost GPU visibility after reboot.", "topics": [{"id": "f-linux-os", "title": "OS/Driver", "subtopics": [{"id": "f-linux-os-s1", "title": "Persistence mode"}, {"id": "f-linux-os-s2", "title": "Fabric manager"}, {"id": "f-linux-os-s3", "title": "Driver/userspace matrix"}, {"id": "f-linux-os-s4", "title": "IOMMU quirks"}, {"id": "f-linux-os-s5", "title": "Health checks"}], "explainer": "GPU nodes need care at the OS layer. Enable persistence mode so the driver stays loaded and first calls are not slow. NVSwitch systems require the Fabric Manager service, or multi-GPU jobs fail. Match driver and CUDA userspace per NVIDIA's compatibility matrix. IOMMU and PCIe ACS settings can silently cut peer-to-peer bandwidth. Run health checks (DCGM diagnostics) at boot and periodically to catch bad GPUs before jobs land on them."}, {"id": "f-linux-ct", "title": "Containers", "subtopics": [{"id": "f-linux-ct-s1", "title": "Runtime hooks"}, {"id": "f-linux-ct-s2", "title": "Device mounts"}, {"id": "f-linux-ct-s3", "title": "Seccomp/AppArmor"}, {"id": "f-linux-ct-s4", "title": "Image pinning"}, {"id": "f-linux-ct-s5", "title": "Supply scanning"}], "explainer": "Containers reach GPUs through runtime hooks (the NVIDIA Container Toolkit or CDI) that mount device files and driver libraries. Avoid privileged containers; mount only needed devices. Keep seccomp and AppArmor profiles on. Pin images by digest so a tag update cannot change your CUDA stack overnight. Scan images, since AI images are huge and pull in many dependencies. Try it: run nvidia-smi inside an unprivileged container with only the needed device mounted, and confirm it works without --privileged."}], "quiz": [{"q": "CUDA userspace and driver…", "choices": ["Must be compatible", "Always interchangeable", "Never need pinning", "Only matter on Windows"], "answer": 0, "why": "Version matrix matters."}, {"q": "NVSwitch-based servers require which service for multi-GPU jobs?", "choices": ["sshd", "cron", "NVIDIA Fabric Manager", "chronyd"], "answer": 2, "why": "Fabric Manager configures the NVSwitch fabric."}, {"q": "Pinning images by digest prevents…", "choices": ["Image scanning", "Logging", "A retagged image silently changing your stack", "GPU access"], "answer": 2, "why": "Digests are immutable; tags are not."}], "conceptIds": []}]}, {"id": "f-l2", "name": "L2 Practitioner", "subjects": [{"id": "f-sched", "title": "Schedulers & Orchestrators", "why": "Scarce GPUs make policy into product.", "explainer": "Slurm, Kueue, Ray/KubeRay, HPA on custom metrics. Gang scheduling, preemption, fairshare, binpacking.\n\nCommon mistake: default K8s assumptions for multi-GPU gangs. Another: train vs serve without priority.\n\nDocument the real policy.", "resources": [{"title": "Slurm docs", "url": "https://slurm.schedmd.com/documentation.html"}, {"title": "Kueue", "url": "https://kueue.sigs.k8s.io/"}, {"title": "Ray docs", "url": "https://docs.ray.io/en/latest/"}, {"title": "K8s scheduling", "url": "https://kubernetes.io/docs/concepts/scheduling-eviction/"}], "project": "Compare Kueue vs Ray Jobs for inference burst; document fairness.", "topics": [{"id": "f-sched-batch", "title": "Batch/Train", "subtopics": [{"id": "f-sched-batch-s1", "title": "Slurm partitions/GRES"}, {"id": "f-sched-batch-s2", "title": "Gang scheduling"}, {"id": "f-sched-batch-s3", "title": "Preemption"}, {"id": "f-sched-batch-s4", "title": "Reservations"}, {"id": "f-sched-batch-s5", "title": "Fairshare"}], "explainer": "Slurm still runs most HPC and many training clusters: partitions group nodes, GRES describes GPUs, and fairshare balances users. Gang scheduling starts all pods of a distributed job together or none at all, preventing deadlock where half a job holds GPUs waiting for the rest. Preemption reclaims GPUs for higher priority work, so jobs must checkpoint. Reservations hold capacity for planned runs."}, {"id": "f-sched-svc", "title": "Serving", "subtopics": [{"id": "f-sched-svc-s1", "title": "HPA on tokens/s or queue"}, {"id": "f-sched-svc-s2", "title": "Kueue"}, {"id": "f-sched-svc-s3", "title": "KubeRay"}, {"id": "f-sched-svc-s4", "title": "Binpacking"}, {"id": "f-sched-svc-s5", "title": "Spot handling"}], "explainer": "Serving autoscalers should scale on queue depth, tokens per second, or KV usage, not CPU. Kueue adds job queueing, quotas and fair sharing across teams on Kubernetes; Volcano offers gang scheduling and batch policies. KubeRay manages Ray clusters for serving and training. Binpacking fills nodes tightly to free whole nodes; spreading improves resilience. Spot GPUs need graceful drain and fast restart."}], "quiz": [{"q": "Gang scheduling is needed when…", "choices": ["All workers must start together", "A single pod suffices", "Only cron", "DNS down"], "answer": 0, "why": "Distributed barriers need co-start."}, {"q": "Kueue adds to Kubernetes…", "choices": ["GPU drivers", "Service mesh", "Job queueing, quotas and fair sharing", "DNS"], "answer": 2, "why": "It admits jobs when quota is available."}, {"q": "Spot GPU serving needs…", "choices": ["Bigger prompts", "Disabled autoscaling", "Graceful drain and fast restart", "No changes"], "answer": 2, "why": "Spot capacity can vanish with short notice."}], "conceptIds": ["k8s-gpu"]}, {"id": "f-store", "title": "Storage for Models & Data", "why": "Weight distribution dominates cold start.", "explainer": "Object stores, parallel FS, NVMe scratch, registries, P2P/lazy pulls, dataset streaming, index DR. Immutable versioned artifacts.\n\nCommon mistake: pulling 70B remotely on every scale-up. Another: mutable latest tags.\n\nCold-start budget is an SLO.", "resources": [{"title": "Docker docs", "url": "https://docs.docker.com/"}, {"title": "Databricks ML", "url": "https://www.databricks.com/product/machine-learning"}, {"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}], "project": "Benchmark cold start object storage vs warm cache; add cache layer.", "topics": [{"id": "f-store-types", "title": "Systems", "subtopics": [{"id": "f-store-types-s1", "title": "Object stores"}, {"id": "f-store-types-s2", "title": "Parallel FS"}, {"id": "f-store-types-s3", "title": "Local NVMe"}, {"id": "f-store-types-s4", "title": "Registries"}, {"id": "f-store-types-s5", "title": "Index storage"}], "explainer": "Object storage (S3 and equivalents) holds checkpoints and datasets cheaply but with high latency. Parallel file systems (Lustre, GPFS, WEKA, VAST) feed training at high throughput. Local NVMe gives the fastest scratch and model cache. Container and model registries store versioned artifacts. Vector indexes have their own storage needs, mostly RAM and SSD. Rule of thumb: object store for durability, parallel FS for training throughput, local NVMe for hot model cache. Try it: time loading the same checkpoint from each tier on one node."}, {"id": "f-store-pat", "title": "Patterns", "subtopics": [{"id": "f-store-pat-s1", "title": "Immutable versions"}, {"id": "f-store-pat-s2", "title": "P2P / lazy pull"}, {"id": "f-store-pat-s3", "title": "Dataset streaming"}, {"id": "f-store-pat-s4", "title": "Backup/DR"}, {"id": "f-store-pat-s5", "title": "Bandwidth planning"}], "explainer": "Store models and datasets as immutable, versioned artifacts with hashes. Speed up cold starts with peer-to-peer distribution, lazy-loading image formats, or node-local caches. Stream datasets instead of copying them to every node. Back up checkpoints across regions. Plan bandwidth: 100 nodes each pulling a 140 GB model at once is 14 TB of traffic. Try it: measure cold-start time for a 70B model pulled from object storage versus a node-local cache, and put both numbers in your capacity plan."}], "quiz": [{"q": "Production artifacts should be…", "choices": ["Immutably versioned", "Only latest", "Edited on GPU node", "In chat logs"], "answer": 0, "why": "Immutability enables rollback."}, {"q": "100 nodes each pulling a 140 GB model at once moves about…", "choices": ["1.4 TB", "140 TB", "140 GB", "14 TB"], "answer": 3, "why": "100 × 140 GB = 14,000 GB = 14 TB."}, {"q": "Fastest tier for a hot model cache on a node is usually…", "choices": ["Email", "Tape", "Local NVMe", "Object storage"], "answer": 2, "why": "Local NVMe avoids network latency."}], "conceptIds": []}, {"id": "f-net", "title": "High-Performance Networking", "why": "Distributed AI dies on bad fabric.", "explainer": "NVLink/NVSwitch, PCIe, IB, RoCE, GPUDirect, NCCL knobs, topology-aware placement. Interpret NCCL busbw vs algbw.\n\nCommon mistake: RoCE without lossless config. Another: ignoring PCIe topology.\n\nFabric is in the BOM.", "resources": [{"title": "NCCL user guide", "url": "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/overview.html"}, {"title": "NCCL tests", "url": "https://github.com/NVIDIA/nccl-tests"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}], "project": "Run NCCL all-reduce tests; document topology and bandwidth.", "topics": [{"id": "f-net-fab", "title": "Fabrics", "subtopics": [{"id": "f-net-fab-s1", "title": "NVLink / NVSwitch"}, {"id": "f-net-fab-s2", "title": "PCIe topology"}, {"id": "f-net-fab-s3", "title": "InfiniBand"}, {"id": "f-net-fab-s4", "title": "RoCE congestion"}, {"id": "f-net-fab-s5", "title": "Ethernet AI NICs"}], "explainer": "Inside a server, NVLink and NVSwitch connect GPUs at hundreds of GB/s, far above PCIe. Between servers, InfiniBand gives low latency and lossless transport; RoCE runs RDMA over Ethernet but needs careful congestion control (PFC and ECN). New AI Ethernet NICs and switches aim to match InfiniBand. PCIe topology matters: a GPU and NIC on different CPU sockets cross a slow link."}, {"id": "f-net-lib", "title": "Libraries/Ops", "subtopics": [{"id": "f-net-lib-s1", "title": "NCCL env knobs"}, {"id": "f-net-lib-s2", "title": "GPUDirect RDMA"}, {"id": "f-net-lib-s3", "title": "Topology-aware placement"}, {"id": "f-net-lib-s4", "title": "Loss symptoms"}, {"id": "f-net-lib-s5", "title": "Telemetry"}], "explainer": "NCCL picks algorithms and transports automatically, but environment variables such as NCCL_DEBUG=INFO, NCCL_SOCKET_IFNAME and NCCL_IB_HCA reveal and control its choices. GPUDirect RDMA lets NICs read GPU memory directly, skipping the CPU. Topology-aware placement keeps communicating ranks close. Packet loss shows up as slow or hung collectives, not errors. Monitor link counters and run nccl-tests regularly. Try it: run nccl-tests all_reduce_perf across two nodes with NCCL_DEBUG=INFO and confirm the log shows the InfiniBand or RoCE transport, not TCP sockets."}], "quiz": [{"q": "NCCL all-reduce depends heavily on…", "choices": ["Interconnect topology and config", "Python version only", "CSS", "Prompt text"], "answer": 0, "why": "Collectives ride the fabric."}, {"q": "RoCE requires careful configuration of…", "choices": ["Fonts", "GPUs only", "Congestion control such as PFC and ECN", "Tokenizers"], "answer": 2, "why": "RDMA over Ethernet needs a well-behaved lossless or near-lossless fabric."}, {"q": "If NCCL logs show it fell back to TCP sockets on an InfiniBand cluster, you should…", "choices": ["Ignore it", "Retrain the model", "Lower batch size", "Check NCCL_IB_HCA, drivers and RDMA device visibility"], "answer": 3, "why": "Socket fallback cuts bandwidth dramatically."}], "conceptIds": ["nvlink-ib", "nccl-collectives"]}, {"id": "f-procure", "title": "GPU Procurement & Capacity Markets", "why": "Capacity is a market.", "explainer": "Reservations, spot, secondary clouds, owned depreciation, lead times, SKU fit to parallelism.\n\nCommon mistake: cheapest GPU-hour without fabric/memory fit. Another: single-region shortage with no exit.\n\nQuarterly plans beat panic buys.", "resources": [{"title": "FinOps Foundation", "url": "https://www.finops.org/"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}, {"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}], "project": "Quarterly plan: reserved vs on-demand vs spot for steady+burst.", "topics": [{"id": "f-proc-buy", "title": "Buying", "subtopics": [{"id": "f-proc-buy-s1", "title": "Reservations"}, {"id": "f-proc-buy-s2", "title": "Spot"}, {"id": "f-proc-buy-s3", "title": "Secondary clouds"}, {"id": "f-proc-buy-s4", "title": "Owned hardware"}, {"id": "f-proc-buy-s5", "title": "Lead times"}], "explainer": "GPUs come through on-demand cloud, reservations and committed-use discounts, spot instances, newer GPU clouds, or owned hardware. Reservations trade flexibility for price and availability guarantees. Spot is cheap but can disappear at any moment. Owned hardware has the lowest unit cost at high utilization, but lead times for GPUs, power and data center space can run many months. Try it: model one year of a steady workload on on-demand, one-year reserved and spot-with-fallback pricing, including the cost of interruptions."}, {"id": "f-proc-fit", "title": "Fit", "subtopics": [{"id": "f-proc-fit-s1", "title": "HBM needs"}, {"id": "f-proc-fit-s2", "title": "Interconnect SKUs"}, {"id": "f-proc-fit-s3", "title": "Power/cooling"}, {"id": "f-proc-fit-s4", "title": "Software support"}, {"id": "f-proc-fit-s5", "title": "Vendor lock"}], "explainer": "Pick hardware for the workload. Large models need enough HBM per GPU or per NVLink domain. Training and tensor-parallel serving need high-bandwidth interconnect SKUs. Check power and cooling: modern racks can exceed 100 kW and need liquid cooling. Confirm your software stack supports the accelerator. Consider lock-in to one vendor's ecosystem when committing for years. Try it: for a target model, write the minimum GPU memory, interconnect and rack power needed, then check which offerings in your region meet all three."}], "quiz": [{"q": "Spot GPUs require…", "choices": ["Checkpointing and interrupt-tolerant workloads", "Zero engineering changes", "Guaranteed global NCCL", "No monitoring"], "answer": 0, "why": "Interrupts are the deal."}, {"q": "Owned GPU hardware has the lowest unit cost when…", "choices": ["You lack power", "Utilization is low", "Utilization is high and sustained", "Workloads are one-off"], "answer": 2, "why": "Fixed costs amortize over many busy hours."}, {"q": "A key non-GPU lead-time risk for owned AI capacity is…", "choices": ["Tokenizers", "Utility power and data center space", "Keyboards", "DNS"], "answer": 1, "why": "Power provisioning can take months to years."}], "conceptIds": []}, {"id": "f-interconnect", "title": "GPU Interconnects & Collective Debugging", "why": "Most multi-GPU slowdowns are communication problems, not compute problems.", "explainer": "Inside a node, GPUs talk over NVLink/NVSwitch; between nodes, over InfiniBand or RoCE with GPUDirect RDMA. NCCL turns that fabric into collectives (all-reduce, all-gather, all-to-all). Your job is to know the expected bandwidth of every hop, prove it with nccl-tests, and recognize when a job is slow because a link, NIC binding or transport choice is wrong.\n\nCommon mistakes: tensor parallelism across nodes; GPU and NIC on different CPU sockets; NCCL silently falling back to TCP sockets; ignoring link error counters until a job hangs.\n\nMental model: compute is rented by the hour, but you are often paying for GPUs that wait on the network.", "resources": [{"title": "NCCL troubleshooting", "url": "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html"}, {"title": "NCCL environment variables", "url": "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/env.html"}, {"title": "nccl-tests (GitHub)", "url": "https://github.com/NVIDIA/nccl-tests"}, {"title": "GPUDirect RDMA", "url": "https://docs.nvidia.com/cuda/gpudirect-rdma/index.html"}], "project": "Run all_reduce_perf on one node and across two nodes. Record busbw, compare with link specs, then deliberately break the IB binding (wrong NCCL_IB_HCA) and document how the logs and numbers change.", "topics": [{"id": "f-ic-topo", "title": "Fabric Topology", "explainer": "Topology decides achievable bandwidth. Read nvidia-smi topo -m: NV# means NVLink between GPUs, PIX/PXB means PCIe switches, SYS means crossing CPU sockets (slow). Each GPU should have a nearby NIC (rail-optimized designs pair GPU i on every node with the same switch rail). Know your numbers: NVLink on H100 is about 900 GB/s bidirectional per GPU, a 400 Gb/s NIC is 50 GB/s per direction, PCIe Gen5 x16 about 64 GB/s per direction. Plan placement so the heaviest traffic, usually tensor parallelism, stays on NVLink.", "subtopics": [{"id": "f-ic-topo-s1", "title": "nvidia-smi topo -m reading"}, {"id": "f-ic-topo-s2", "title": "NVLink / NVSwitch domains"}, {"id": "f-ic-topo-s3", "title": "Rail-optimized fabrics"}, {"id": "f-ic-topo-s4", "title": "GPU-NIC affinity and NUMA"}, {"id": "f-ic-topo-s5", "title": "InfiniBand vs RoCE trade-offs"}]}, {"id": "f-ic-nccl", "title": "NCCL Collectives", "explainer": "NCCL chooses algorithm (ring, tree, NVLS) and transport (NVLink, IB verbs, sockets) per collective. Ring all-reduce sends 2(N-1)/N of the buffer per GPU; tree lowers latency for small messages; NVLink SHARP offloads reductions into NVSwitch. nccl-tests reports algbw and busbw: compare busbw with link speed to judge efficiency. Message size matters: small messages are latency-bound, large ones bandwidth-bound, so always sweep sizes. NCCL_DEBUG=INFO prints the chosen rings, channels and transports; that log is the first thing to read when performance looks wrong.", "subtopics": [{"id": "f-ic-nccl-s1", "title": "All-reduce, all-gather, reduce-scatter, all-to-all"}, {"id": "f-ic-nccl-s2", "title": "Ring vs tree vs NVLS"}, {"id": "f-ic-nccl-s3", "title": "algbw vs busbw"}, {"id": "f-ic-nccl-s4", "title": "Message-size sweeps"}, {"id": "f-ic-nccl-s5", "title": "NCCL_DEBUG logs"}]}, {"id": "f-ic-debug", "title": "Debugging Hangs & Slowdowns", "explainer": "Slow or hung collectives usually come from one of a few causes: a straggler rank (bad GPU, thermal throttling, noisy neighbor), a degraded link (rising symbol errors or link flaps on IB ports), transport fallback to sockets, wrong interface selection, or ranks calling collectives in different orders. Tools: NCCL_DEBUG=INFO and NCCL_DEBUG_SUBSYS, ibstat and perfquery for port counters, DCGM for NVLink errors, PyTorch's NCCL timeouts and flight recorder to find which rank is behind. Bisect: single node first, then pairs of nodes, to isolate the bad component.", "subtopics": [{"id": "f-ic-debug-s1", "title": "Straggler detection"}, {"id": "f-ic-debug-s2", "title": "IB port counters (ibstat, perfquery)"}, {"id": "f-ic-debug-s3", "title": "Socket fallback symptoms"}, {"id": "f-ic-debug-s4", "title": "Flight recorder and timeouts"}, {"id": "f-ic-debug-s5", "title": "Node-pair bisection"}]}], "quiz": [{"q": "nccl-tests busbw far below link speed most likely indicates…", "choices": ["Perfect performance", "Too much HBM", "A topology, transport or placement problem", "A tokenizer bug"], "answer": 2, "why": "busbw is normalized to compare with hardware link rates."}, {"q": "In nvidia-smi topo -m, 'SYS' between a GPU and NIC means…", "choices": ["Same PCIe switch", "Traffic crosses the CPU interconnect between sockets", "No connection", "NVLink"], "answer": 1, "why": "SYS paths are the slowest; pick a NIC on the GPU's socket."}, {"q": "Ring all-reduce traffic per GPU is approximately…", "choices": ["N × buffer", "2(N-1)/N × buffer", "Zero with NVLink", "buffer / N"], "answer": 1, "why": "It stays near 2× buffer regardless of GPU count."}, {"q": "A good first step for a multi-node hang is…", "choices": ["Find the lagging rank with timeouts/flight recorder and check that node's logs", "Add more nodes", "Lower temperature", "Retrain the model"], "answer": 0, "why": "Hangs usually trace to one rank or link."}], "conceptIds": ["nccl-collectives", "xid-triage"]}, {"id": "f-gpushare", "title": "GPU Sharing & Batch Scheduling on Kubernetes", "why": "GPUs are too expensive to leave idle or to hand out one whole card at a time.", "explainer": "The GPU Operator turns Kubernetes nodes into GPU nodes: driver, container toolkit, device plugin, DCGM exporter, MIG manager and feature discovery. On top, you choose how to share: MIG for hard isolation, time-slicing for dev density, MPS for concurrent kernels. DRA gives pods richer device requests. Kueue and Volcano add the queueing, quotas, fair share and gang scheduling that batch and training jobs need.\n\nCommon mistakes: time-slicing production inference (no memory isolation); no quotas, so one team grabs every GPU; running distributed jobs without gang scheduling, causing partial-allocation deadlocks.\n\nGoal: high utilization with predictable performance for the workloads that need it.", "resources": [{"title": "NVIDIA GPU Operator", "url": "https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/index.html"}, {"title": "MIG user guide", "url": "https://docs.nvidia.com/datacenter/tesla/mig-user-guide/"}, {"title": "Kubernetes Dynamic Resource Allocation", "url": "https://kubernetes.io/docs/concepts/scheduling-eviction/dynamic-resource-allocation/"}, {"title": "Kueue overview", "url": "https://kueue.sigs.k8s.io/docs/overview/"}, {"title": "Volcano docs", "url": "https://volcano.sh/en/docs/"}], "project": "On a GPU node, install the GPU Operator, enable time-slicing with 4 replicas, then switch a second GPU to a MIG mixed profile. Run the same small model on both and compare latency under a noisy neighbor. Add Kueue with two team queues and show fair sharing.", "topics": [{"id": "f-gs-operator", "title": "GPU Operator & Device Stack", "explainer": "The GPU Operator manages the whole node-side stack as Kubernetes resources: driver containers (or pre-installed drivers), the NVIDIA Container Toolkit, the device plugin advertising nvidia.com/gpu, GPU Feature Discovery labels (model, memory, MIG capability), the DCGM exporter for metrics, and the MIG manager. Upgrades roll through nodes like any DaemonSet, which is why driver upgrades need maintenance windows and drains. Node labels from feature discovery let you schedule by GPU model or memory size instead of hard-coding node names.", "subtopics": [{"id": "f-gs-operator-s1", "title": "Operator components"}, {"id": "f-gs-operator-s2", "title": "Driver containers vs host drivers"}, {"id": "f-gs-operator-s3", "title": "Feature discovery labels"}, {"id": "f-gs-operator-s4", "title": "DCGM exporter"}, {"id": "f-gs-operator-s5", "title": "Upgrade and drain strategy"}]}, {"id": "f-gs-share", "title": "MIG, Time-Slicing & MPS", "explainer": "MIG partitions supported GPUs (A100, H100, newer) into isolated instances with dedicated SMs and memory; profiles like 1g.10gb or 3g.40gb are fixed, and changing them requires the GPU to be idle. Time-slicing advertises a GPU as several replicas with no isolation, ideal for notebooks and CI. MPS lets processes run kernels concurrently with optional SM limits, improving throughput for many small inference workers. In the GPU Operator these are configured via ConfigMaps and node labels. Pick by isolation need: production multi-tenant means MIG; dev density means time-slicing.", "subtopics": [{"id": "f-gs-share-s1", "title": "MIG profiles and strategies"}, {"id": "f-gs-share-s2", "title": "Time-slicing replicas"}, {"id": "f-gs-share-s3", "title": "MPS for small workers"}, {"id": "f-gs-share-s4", "title": "Isolation and noisy neighbors"}, {"id": "f-gs-share-s5", "title": "Choosing per workload"}]}, {"id": "f-gs-dra", "title": "Dynamic Resource Allocation", "explainer": "Device plugins only expose integer counts. DRA introduces DeviceClasses and ResourceClaims so a pod can ask for devices by attributes (GPU model, memory, MIG profile, interconnect) and share a claimed device between containers. Drivers publish ResourceSlices describing available devices; the scheduler matches claims against them, optionally with CEL selectors. DRA graduated to general availability in recent Kubernetes releases, and NVIDIA ships a DRA driver. Expect it to become the standard way to request accelerators, including multi-node NVLink domains.", "subtopics": [{"id": "f-gs-dra-s1", "title": "ResourceClaims and DeviceClasses"}, {"id": "f-gs-dra-s2", "title": "ResourceSlices"}, {"id": "f-gs-dra-s3", "title": "CEL device selectors"}, {"id": "f-gs-dra-s4", "title": "NVIDIA DRA driver"}, {"id": "f-gs-dra-s5", "title": "Migration from device plugins"}]}, {"id": "f-gs-queue", "title": "Kueue & Volcano", "explainer": "Batch jobs need queues, not first-come scheduling. Kueue adds ClusterQueues with quotas per resource flavor (for example H100 versus L4), LocalQueues per team, borrowing of unused quota, preemption, and all-or-nothing admission for gang-style jobs. Volcano is a batch scheduler with gang scheduling, queues and fair share, popular for Spark, MPI and training. Both prevent the classic deadlock where two distributed jobs each hold half the GPUs they need. Pair them with PriorityClasses so production serving can preempt experiments.", "subtopics": [{"id": "f-gs-queue-s1", "title": "ClusterQueue / LocalQueue"}, {"id": "f-gs-queue-s2", "title": "Resource flavors and borrowing"}, {"id": "f-gs-queue-s3", "title": "Gang (all-or-nothing) admission"}, {"id": "f-gs-queue-s4", "title": "Volcano queues and fair share"}, {"id": "f-gs-queue-s5", "title": "Preemption policies"}]}], "quiz": [{"q": "Which sharing mode gives hardware memory isolation between tenants?", "choices": ["MIG", "Overcommit", "Time-slicing", "MPS default"], "answer": 0, "why": "MIG instances have dedicated memory and SMs."}, {"q": "DRA improves on device plugins by…", "choices": ["Disabling scheduling", "Allowing attribute-based device requests via ResourceClaims", "Replacing containers", "Removing GPUs"], "answer": 1, "why": "Pods can ask for specific device properties."}, {"q": "Gang scheduling prevents…", "choices": ["High utilization", "MIG", "Logging", "Two distributed jobs each holding partial GPUs and deadlocking"], "answer": 3, "why": "All-or-nothing admission avoids partial allocations."}, {"q": "Kueue resource flavors let you…", "choices": ["Change GPU colors", "Quota different GPU types separately", "Install drivers", "Skip quotas"], "answer": 1, "why": "Flavors represent distinct hardware pools."}], "conceptIds": ["gpu-sharing"]}]}, {"id": "f-l3", "name": "L3 Advanced", "subjects": [{"id": "f-obs", "title": "Observability & AI SRE", "why": "Different dashboards than web CPUs.", "explainer": "DCGM, engine metrics, AI API SLIs, power/carbon. Runbooks for NCCL hangs, OOM, thrash, quality drops. Error budgets.\n\nCommon mistake: paging only on 5xx while quality collapses. Another: traces without cost.\n\nQuality is an SLI.", "resources": [{"title": "OpenTelemetry", "url": "https://opentelemetry.io/docs/"}, {"title": "Prometheus", "url": "https://prometheus.io/docs/introduction/overview/"}, {"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}, {"title": "vLLM documentation", "url": "https://docs.vllm.ai/en/latest/"}], "project": "Grafana: GPU util, HBM, SM clocks, TTFT, queue, $/1M tokens.", "topics": [{"id": "f-obs-met", "title": "Metrics", "subtopics": [{"id": "f-obs-met-s1", "title": "DCGM"}, {"id": "f-obs-met-s2", "title": "Engine metrics"}, {"id": "f-obs-met-s3", "title": "AI API SLIs"}, {"id": "f-obs-met-s4", "title": "Power/carbon"}, {"id": "f-obs-met-s5", "title": "Cost metrics"}], "explainer": "DCGM exposes GPU metrics: SM activity, memory bandwidth, temperature, power, ECC and XID errors. Engine metrics (vLLM, SGLang, TensorRT-LLM) cover queue depth, KV usage, TTFT and token rates. Add AI API SLIs per route. Track power and estimated carbon. Join metrics with cost so dashboards show dollars per million tokens, not just utilization. Try it: build one dashboard row that shows SM activity, HBM bandwidth, power, tokens per second and dollars per million tokens side by side."}, {"id": "f-obs-ops", "title": "Operations", "subtopics": [{"id": "f-obs-ops-s1", "title": "Runbooks"}, {"id": "f-obs-ops-s2", "title": "Error budgets"}, {"id": "f-obs-ops-s3", "title": "Incident archetypes"}, {"id": "f-obs-ops-s4", "title": "Postmortems"}, {"id": "f-obs-ops-s5", "title": "Quality pages"}], "explainer": "Write runbooks for common incidents: GPU fell off the bus, NCCL hang, OOM loops, KV thrash, provider outage. Use error budgets to balance velocity and stability. Know the incident archetypes so on-call recognizes them quickly. Run blameless postmortems. Page on quality regressions as well as availability, since a model that answers wrongly at full speed is still an outage. Try it: pick the last three GPU incidents and check whether a runbook existed; write the missing ones while memory is fresh."}], "quiz": [{"q": "AI SRE dashboards should include…", "choices": ["Latency, goodput, memory/KV, quality", "Only loadavg", "Only tweets", "Only disk %"], "answer": 0, "why": "AI-specific SLIs."}, {"q": "Which DCGM signal indicates a hardware or driver fault?", "choices": ["XID errors", "Tokens per second", "Prompt length", "Fan speed only"], "answer": 0, "why": "XIDs are driver-reported error events."}, {"q": "Why page on quality regressions?", "choices": ["Regulators require pages", "They are rare", "To test pagers", "A fast wrong model is still an outage"], "answer": 3, "why": "Users experience bad answers as failure."}], "conceptIds": ["ai-sre", "xid-triage"]}, {"id": "f-secinfra", "title": "Infra Security & Isolation", "why": "Multi-tenant GPUs are hard.", "explainer": "Namespaces, MIG, sandboxes, egress, signed images/SBOMs, model provenance, admission, secrets, confidential computing.\n\nCommon mistake: shared root-capable GPU containers. Another: unsigned model blobs.\n\nDefense in depth.", "resources": [{"title": "Docker docs", "url": "https://docs.docker.com/"}, {"title": "Firecracker", "url": "https://firecracker-microvm.github.io/"}, {"title": "gVisor", "url": "https://gvisor.dev/"}, {"title": "NIST AI RMF", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}, {"title": "OWASP Top 10 for LLM Apps", "url": "https://owasp.org/www-project-top-10-for-large-language-model-applications/"}], "project": "Tenant isolation design: network policies, secrets, MIG vs nodes.", "topics": [{"id": "f-sec-iso", "title": "Isolation", "subtopics": [{"id": "f-sec-iso-s1", "title": "Namespace isolation"}, {"id": "f-sec-iso-s2", "title": "MIG"}, {"id": "f-sec-iso-s3", "title": "Sandbox runtimes"}, {"id": "f-sec-iso-s4", "title": "Egress controls"}, {"id": "f-sec-iso-s5", "title": "Confidential GPUs"}], "explainer": "Isolation for GPU workloads uses namespaces and network policies, MIG for hardware-partitioned GPUs, and sandbox runtimes such as gVisor or Kata Containers for untrusted code. Control egress tightly so a compromised workload cannot exfiltrate weights or data. Confidential computing on recent GPUs encrypts memory and attests the environment, protecting data even from the host operator. Rule of thumb: the more untrusted the code, the stronger the boundary: namespace, then gVisor, then microVM. Try it: run an agent's code tool in gVisor and test egress blocking."}, {"id": "f-sec-sup", "title": "Supply Chain", "subtopics": [{"id": "f-sec-sup-s1", "title": "Signed images/SBOMs"}, {"id": "f-sec-sup-s2", "title": "Model provenance"}, {"id": "f-sec-sup-s3", "title": "Admission controllers"}, {"id": "f-sec-sup-s4", "title": "Secrets"}, {"id": "f-sec-sup-s5", "title": "Vuln SLAs"}], "explainer": "Sign container images and model artifacts, and keep SBOMs. Record model provenance: where weights came from and their hashes. Prefer safetensors over pickle-based formats, which can execute code on load. Admission controllers block unsigned or unscanned images. Store secrets in a vault, never in images or env files baked into models. Set SLAs for patching vulnerabilities. Try it: convert a pickle checkpoint to safetensors, sign it, and configure the loader to refuse unsigned or pickle files."}], "quiz": [{"q": "Agent code tools should run in…", "choices": ["Strong sandboxes with egress allowlists", "K8s control plane", "Unrestricted host PID", "DNS server"], "answer": 0, "why": "Assume untrusted code."}, {"q": "Prefer safetensors over pickle because…", "choices": ["It is smaller always", "It compresses KV", "It cannot execute code on load", "It is faster to train"], "answer": 2, "why": "Safetensors stores raw tensors only."}, {"q": "Strong isolation for untrusted agent code is…", "choices": ["A longer prompt", "Root containers", "gVisor or microVMs with egress limits", "A shared host shell"], "answer": 2, "why": "Stronger boundaries limit escape and exfiltration."}], "conceptIds": ["threat-model"]}, {"id": "f-cloud", "title": "Cloud AI Platforms & Accounts", "why": "Hyperscaler primitives.", "explainer": "Bedrock, Azure AI Foundry, Vertex, managed GPU pools, spot, quotas, Private Link, cross-account roles, cost anomalies.\n\nCommon mistake: account sprawl without guardrails. Another: ignoring regional GPU quota until launch.\n\nAccount vending with baselines.", "resources": [{"title": "AWS Bedrock", "url": "https://docs.aws.amazon.com/bedrock/"}, {"title": "Azure AI Foundry", "url": "https://learn.microsoft.com/en-us/azure/ai-foundry/"}, {"title": "Vertex AI", "url": "https://cloud.google.com/vertex-ai/docs"}, {"title": "GCP MLOps", "url": "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning"}, {"title": "FinOps Foundation", "url": "https://www.finops.org/"}], "project": "Private inference endpoint with VPC, logging, quota alerts.", "topics": [{"id": "f-cloud-svc", "title": "Services", "subtopics": [{"id": "f-cloud-svc-s1", "title": "Managed model APIs"}, {"id": "f-cloud-svc-s2", "title": "Managed K8s GPU pools"}, {"id": "f-cloud-svc-s3", "title": "Spot"}, {"id": "f-cloud-svc-s4", "title": "Marketplace"}, {"id": "f-cloud-svc-s5", "title": "Serverless GPU"}], "explainer": "Clouds offer managed model APIs, managed Kubernetes with GPU node pools, spot GPUs, marketplace models, and serverless GPU platforms that scale to zero. Managed services cut operational load; raw GPU instances give control and often better unit cost at scale. Most organizations use a mix. A good default: start on managed APIs to learn demand, then move steady high-volume traffic to self-hosted capacity once utilization data proves the savings. Try it: price one workload both ways."}, {"id": "f-cloud-ops", "title": "Ops", "subtopics": [{"id": "f-cloud-ops-s1", "title": "Quotas/reservations"}, {"id": "f-cloud-ops-s2", "title": "Private networking"}, {"id": "f-cloud-ops-s3", "title": "Cross-account roles"}, {"id": "f-cloud-ops-s4", "title": "Cost anomalies"}, {"id": "f-cloud-ops-s5", "title": "Landing zones"}], "explainer": "GPU quotas are scarce and approved per region, so request them well ahead. Use private networking to reach model endpoints without the public internet. Set up cross-account roles so teams share capacity safely. Alert on cost anomalies daily, since a forgotten 8-GPU node costs thousands per week. Build GPU workloads into your landing zone with guardrails from the start. Try it: set a daily budget alert per GPU project and a tag policy that blocks untagged GPU instances."}], "quiz": [{"q": "GPU quota should be…", "choices": ["Requested and monitored before launch", "Ignored until 500s", "Checked annually", "Handled by tokenizer"], "answer": 0, "why": "Capacity is a dependency."}, {"q": "GPU quota should be requested…", "choices": ["Never", "Only for CPUs", "Well ahead, per region", "After launch"], "answer": 2, "why": "GPU quota is scarce and approved slowly."}, {"q": "A forgotten 8-GPU node mostly shows up as…", "choices": ["Faster CI", "Better accuracy", "Lower power", "A cost anomaly"], "answer": 3, "why": "Daily cost alerts catch idle spend."}], "conceptIds": []}, {"id": "f-energy", "title": "Energy, Power & Cooling", "why": "Watts are first-class constraints.", "explainer": "Rack density, liquid cooling, PUE, carbon-aware shifting, utility lead times. Energy per 1M tokens as FinOps/ESG metric.\n\nCommon mistake: BOM facilities cannot power. Another: no summer thermal headroom.\n\nPartner with facilities early.", "resources": [{"title": "FinOps Foundation", "url": "https://www.finops.org/"}, {"title": "Google SRE Book", "url": "https://sre.google/sre-book/table-of-contents/"}, {"title": "CUDA docs", "url": "https://docs.nvidia.com/cuda/"}], "project": "Estimate power for N GPUs at TDP; propose cooling constraints for BOM.", "topics": [{"id": "f-en-fac", "title": "Facilities", "subtopics": [{"id": "f-en-fac-s1", "title": "Rack density"}, {"id": "f-en-fac-s2", "title": "Air vs liquid"}, {"id": "f-en-fac-s3", "title": "PUE"}, {"id": "f-en-fac-s4", "title": "Utility lead times"}, {"id": "f-en-fac-s5", "title": "Redundancy"}], "explainer": "AI racks draw 40 to 130+ kW versus under 10 kW for classic servers. Air cooling tops out around 30 to 40 kW per rack; beyond that you need rear-door heat exchangers or direct liquid cooling. PUE (facility power divided by IT power) measures overhead. Utility power can take years to provision, which now gates AI expansion more than GPU supply. Plan redundancy for power and cooling, not just servers."}, {"id": "f-en-ops", "title": "Ops/ESG", "subtopics": [{"id": "f-en-ops-s1", "title": "Energy per 1M tokens"}, {"id": "f-en-ops-s2", "title": "Carbon-aware scheduling"}, {"id": "f-en-ops-s3", "title": "Reporting"}, {"id": "f-en-ops-s4", "title": "Thermal incidents"}, {"id": "f-en-ops-s5", "title": "Efficiency"}], "explainer": "Measure energy per million tokens so efficiency improvements are visible. Carbon-aware scheduling moves flexible batch work to times or regions with cleaner power. Reporting rules increasingly require energy and emissions disclosure. Thermal incidents (cooling failures) can throttle or shut down racks within minutes, so monitor and alert on inlet temperatures. Efficiency gains from quantization and better batching direc
